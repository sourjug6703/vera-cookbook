<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A source-grounded family recipe collection." />
    <title>Vera's Culinary Adventures</title>
    <link rel="stylesheet" href="styles.css?v=sharp-didone-20260825" />
  </head>
  <body>
    <!--
      THESIS: A living family cookbook is a browsable kitchen table, not a magazine spread.
      OWN-WORLD: Ivory paper, black ink, tomato red, Bodoni display, condensed utility type, and framed food studies.
      STORY: A family cook finds a verified recipe, understands its source, and opens the full preparation without losing place.
      FIRST VIEWPORT: The title, search, source-order browse groups, recipe grid, and featured-table detail share one practical work surface.
      FORM: Family Recipe Issue challenger selected by the user, translated into a recipe-library layout; seed 89e48c46.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div class="site-shell">
      <header class="site-header">
        <a class="portrait-lockup" href="#top" aria-label="Vera's Culinary Adventures home">
          <img class="portrait-mark" src="assets/vera-portrait-linocut-plus-20-b-transparent.png" alt="" width="512" height="512" />
        </a>
        <div class="site-masthead">
          <a class="wordmark" href="#top" aria-label="Vera's Culinary Adventures home">
            Vera's <span>Culinary Adventures</span>
          </a>
          <div class="header-controls">
            <label class="search-field" for="recipe-search">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
              <input id="recipe-search" type="search" placeholder="Find a recipe" autocomplete="off" />
            </label>
            <button class="saved-button" id="saved-filter" type="button" aria-pressed="false">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-3.8L6 21V3Z"></path></svg>
              Saved recipes
              <span class="saved-count" id="saved-count">0</span>
            </button>
          </div>
        </div>
      </header>

      <main id="top" class="reader-layout">
        <aside class="collection-nav" aria-label="Recipe collection navigation">
          <div class="nav-heading">Browse by</div>
          <div id="collection-tabs" class="collection-tabs" aria-label="Recipe sections"></div>
          <div class="source-note">
            <span class="source-dot"></span>
            <p><strong>110 source-checked recipes.</strong> Browse groups follow the cookbook’s sequence.</p>
          </div>
        </aside>

        <section class="recipe-library" aria-label="Recipe collection">
          <div id="collection-view">
            <div class="library-heading">
              <div>
                <p id="result-summary" aria-live="polite">Loading recipes…</p>
              </div>
              <button class="sort-control" id="sort-control" type="button" aria-label="Change recipe order">
                <span id="sort-label">Cookbook order</span>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"></path></svg>
              </button>
            </div>
            <div class="recipe-grid" id="recipe-grid" aria-live="polite"></div>
            <div class="empty-state" id="empty-state" hidden>
              <p>No recipe is matching that search yet.</p>
              <button type="button" id="clear-search">Clear search</button>
            </div>
            <button class="load-more" id="load-more" type="button" hidden>
              Load more recipes
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"></path></svg>
            </button>
          </div>
          <section class="recipe-reader" id="recipe-reader" aria-live="polite" aria-label="Recipe reader" hidden></section>
        </section>

        <aside class="recipe-panel" id="recipe-panel" aria-live="polite">
          <div class="panel-label">Tonight’s table</div>
          <div id="featured-recipe" class="featured-recipe"></div>
        </aside>
      </main>
    </div>
    <template id="recipe-card-template">
      <article class="recipe-card">
        <button class="card-image" type="button" aria-label="Open recipe"></button>
        <div class="card-copy">
          <div class="card-order"></div>
          <h2></h2>
          <p class="card-meta"></p>
          <div class="card-actions">
            <button class="open-recipe" type="button">Read recipe <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"></path></svg></button>
            <button class="save-recipe" type="button" aria-label="Save recipe"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-3.8L6 21V3Z"></path></svg></button>
          </div>
        </div>
      </article>
    </template>
    <script src="app.js?v=illustrated-index-detail-20260825" defer></script>
  </body>
</html>
