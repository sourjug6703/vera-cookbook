    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1 fresh head of red cabbage, about 2 lbs.
      language: en
      source_region_ids:
      - vera-r0055-ingredients
    - segment_id: ingredient-2
      text_verbatim: 1·1/2 cups vinegar
      language: en
      source_region_ids:
      - vera-r0055-ingredients
    - segment_id: ingredient-3
      text_verbatim: 4 tablespoons vegetable oil
      language: en
      source_region_ids:
      - vera-r0055-ingredients
    - segment_id: ingredient-4
      text_verbatim: 1 medium onion, chopped
      language: en
      source_region_ids:
      - vera-r0055-ingredients
    - segment_id: ingredient-5
      text_verbatim: 2 oz. bacon, diced
      language: en
      source_region_ids:
      - vera-r0055-ingredients
    - segment_id: ingredient-6
      text_verbatim: 3 tablespoons sugar
      language: en
      source_region_ids:
      - vera-r0055-ingredients
    - segment_id: ingredient-7
      text_verbatim: caraway seeds
      language: en
      source_region_ids:
      - vera-r0055-ingredients
    - segment_id: ingredient-8
      text_verbatim: 1 large apple, peeled and thinly sliced
      language: en
      source_region_ids:
      - vera-r0055-ingredients
    - segment_id: ingredient-9
      text_verbatim: 3 tablespoons flour
      language: en
      source_region_ids:
      - vera-r0055-ingredients
    - segment_id: ingredient-10
      text_verbatim: 2/3 cup red wine
      language: en
      source_region_ids:
      - vera-r0055-ingredients
    - segment_id: ingredient-11
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0055-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Remove wilted outside leaves from the head of red cabbage. Quarter, core and rinse
        it. Cut in strips, scald with hot vinegar. In a skillet combine oil, bacon, onion, caraway seeds
        and sugar. Sauté mixture until brownned. Add cabbage, thinly sliced apple, dash of salt, cover
        and simmer 15 minutes, or until cabbage is almost tender. Uncover, let liquid almost dry out,
        blend in flour and red wine, simmer 5·10 minutes. Cabbage should be tender but crisp. Serve with
        roast goose, duckling, pork, game.
      language: en
      source_region_ids:
      - vera-r0055-step-1
      step_number: 1
