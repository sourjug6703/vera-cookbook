transcription:
  yield_time_lines:
  - segment_id: yield-1
    text_verbatim: 'Serves 6 - Preparation time: 45 minutes'
    language: en
    source_region_ids:
    - vera-r0060-yield
  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 6 cups coarse flour, (Gold Medal Wondra)
      language: en
      source_region_ids:
      - vera-r0060-ingredients
    - segment_id: ingredient-2
      text_verbatim: 1 whole egg
      language: en
      source_region_ids:
      - vera-r0060-ingredients
    - segment_id: ingredient-3
      text_verbatim: 1 egg yolk
      language: en
      source_region_ids:
      - vera-r0060-ingredients
    - segment_id: ingredient-4
      text_verbatim: 2·1/2 cups club soda
      language: en
      source_region_ids:
      - vera-r0060-ingredients
    - segment_id: ingredient-5
      text_verbatim: 3 cups croutons, (4 hard baked rolls)
      language: en
      source_region_ids:
      - vera-r0060-ingredients
    - segment_id: ingredient-6
      text_verbatim: 4 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0060-ingredients
    - segment_id: ingredient-7
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0060-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: 'Croutons: Cut rolls in 1/2" thick slices, cut each slice in uniform squares, braise
        lightly in butter. Set aside.'
      language: en
      source_region_ids:
      - vera-r0060-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: In a bowl combine flour, egg, egg yolk, salt, and club soda. Knead until the dough
        is smooth and no longer sticks to the bowl. Dough should be of medium consistency, not too thick.
        Add croutons, mix well. Turn the dough over onto a floured pastry board and form two oblong balls-dumplings.
        Place them in lightly salted boiling water and boil over medium heat for 25 minutes. While cooking
        turn them with a spatula.
      language: en
      source_region_ids:
      - vera-r0060-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Remove dumplings to a cutting board and cut each into 1/2 · 3/4" slices. Use a thread
        or very sharp knife. Brush each slice lightly with melted butter.
      language: en
      source_region_ids:
      - vera-r0060-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Serve with roasts, fowl, game, sauces.
      language: en
      source_region_ids:
      - vera-r0060-step-4
      step_number: 4
    - segment_id: step-5
      text_verbatim: Dumpling slices can be frozen and reheated in double boiler.
      language: en
      source_region_ids:
      - vera-r0060-step-5
      step_number: 5
