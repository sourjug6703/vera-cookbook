    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1·1/2 lbs. ground sirloin or chuck (ground pork shoulder can substitute half of the
        ground beef)
      language: en
      source_region_ids:
      - vera-r0004-ingredients
    - segment_id: ingredient-2
      text_verbatim: 1 whole egg
      language: en
      source_region_ids:
      - vera-r0004-ingredients
    - segment_id: ingredient-3
      text_verbatim: 2 hard baked rolls
      language: en
      source_region_ids:
      - vera-r0004-ingredients
    - segment_id: ingredient-4
      text_verbatim: 1 slice bacon
      language: en
      source_region_ids:
      - vera-r0004-ingredients
    - segment_id: ingredient-5
      text_verbatim: salt, pepper, marjoram
      language: en
      source_region_ids:
      - vera-r0004-ingredients
    - segment_id: ingredient-6
      text_verbatim: 1 small onion
      language: en
      source_region_ids:
      - vera-r0004-ingredients
    - segment_id: ingredient-7
      text_verbatim: 3/4 cup water
      language: en
      source_region_ids:
      - vera-r0004-ingredients
    - segment_id: ingredient-8
      text_verbatim: 3 tablespoons bread crumbs
      language: en
      source_region_ids:
      - vera-r0004-ingredients
    - segment_id: ingredient-9
      text_verbatim: 4 pickled dills
      language: en
      source_region_ids:
      - vera-r0004-ingredients
    - segment_id: ingredient-10
      text_verbatim: 4 hard boiled eggs
      language: en
      source_region_ids:
      - vera-r0004-ingredients
    - segment_id: ingredient-11
      text_verbatim: 3/4 cup chicken stock
      language: en
      source_region_ids:
      - vera-r0004-ingredients
    - segment_id: ingredient-12
      text_verbatim: 4 tablespoons vegetable oil
      language: en
      source_region_ids:
      - vera-r0004-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Soak the rolls in water, squeeze off excess liquid, shred them and mix well with
        the ground meat. Add diced bacon, egg, salt, pepper, marjoram, chopped onion, 1 tablespoon water
        and mix it very well. If the mixture is not thick enough, add 1-2 tablespoons bread crumbs.
      language: en
      source_region_ids:
      - vera-r0004-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Turn the mixture over onto a board dusted with bread crumbs. Form a 3/4” thick rectangle.
        Arrange hard boiled eggs and peeled and diced pickles by longer side of the rectangle. Roll the
        meat mixture over the eggs and form a loaf. Grease baking tray with oil, sprinkle the remaining
        oil over the loaf, and bake at 350F for one hour. Baste with chicken stock and juices from the
        pan. When done, slice the loaf on a serving dish, sprinkle with pan drippings.
      language: en
      source_region_ids:
      - vera-r0004-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Serve with vegetables, mashed potatoes, boiled potatoes, potato salad, etc.
      language: en
      source_region_ids:
      - vera-r0004-step-3
      step_number: 3
