    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 2 lbs. ground round
      language: en
      source_region_ids:
      - vera-r0003-ingredients
    - segment_id: ingredient-2
      text_verbatim: 1 whole egg
      language: en
      source_region_ids:
      - vera-r0003-ingredients
    - segment_id: ingredient-3
      text_verbatim: 2 hard baked rolls
      language: en
      source_region_ids:
      - vera-r0003-ingredients
    - segment_id: ingredient-4
      text_verbatim: 2 slices bacon
      language: en
      source_region_ids:
      - vera-r0003-ingredients
    - segment_id: ingredient-5
      text_verbatim: salt, pepper, marjoram
      language: en
      source_region_ids:
      - vera-r0003-ingredients
    - segment_id: ingredient-6
      text_verbatim: 1 medium size onion
      language: en
      source_region_ids:
      - vera-r0003-ingredients
    - segment_id: ingredient-7
      text_verbatim: 3/4 cup water
      language: en
      source_region_ids:
      - vera-r0003-ingredients
    - segment_id: ingredient-8
      text_verbatim: 3/4 cup bread crumbs
      language: en
      source_region_ids:
      - vera-r0003-ingredients
    - segment_id: ingredient-9
      text_verbatim: 1/2 cup oil for frying
      language: en
      source_region_ids:
      - vera-r0003-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      step_number: 1
      text_verbatim: Soak the rolls in water, squeeze off excess liquid, shred them. Blend them with the
        ground meat, egg, chopped onion, diced bacon, salt, pepper and marjoram.
      language: en
      source_region_ids:
      - vera-r0003-step-1
    - segment_id: step-2
      step_number: 2
      text_verbatim: Form 12 hamburgers, coat them with bread crumbs and fry on both sides.
      language: en
      source_region_ids:
      - vera-r0003-step-2
    - segment_id: step-3
      step_number: 3
      text_verbatim: Instead of frying, they can be roasted in the oven, basting them with hot oil, their
        own juices, chicken or beef stock, or water.
      language: en
      source_region_ids:
      - vera-r0003-step-3
    - segment_id: step-4
      step_number: 4
      text_verbatim: Serve with mashed potatoes and salad. Or serve cold with dark bread, potato salad,
        or pickles.
      language: en
      source_region_ids:
      - vera-r0003-step-4
