  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 3 egg whites
      language: en
      source_region_ids:
      - vera-r0111-listgroup-2
    - segment_id: ingredient-2
      text_verbatim: 1/2 cup sugar
      language: en
      source_region_ids:
      - vera-r0111-listgroup-2
    - segment_id: ingredient-3
      text_verbatim: 5 oz. slivered almonds
      language: en
      source_region_ids:
      - vera-r0111-listgroup-2
    - segment_id: ingredient-4
      text_verbatim: Butter and flour for cookie sheet
      language: en
      source_region_ids:
      - vera-r0111-listgroup-2
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Beat egg whites and sugar in a bain-marie, until the mixture thickens. Remove from
        heat, stir in almonds. Drop by teaspoonfuls on a buttered and floured cookie sheet 1\frac{1}{2}
        " apart. Bake 14 minutes at 325F. Snow-balls should puff-up and be pale-golden. Remove carefully
        from cookie sheet.
      language: en
      source_region_ids:
      - vera-r0111-text-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Let snow-balls dry thoroughly, at least 2 hours, in a warm oven under 200F.
      language: en
      source_region_ids:
      - vera-r0111-text-3
      step_number: 2
    - segment_id: step-3
      text_verbatim: Store in a dry place.
      language: en
      source_region_ids:
      - vera-r0111-text-4
      step_number: 3
