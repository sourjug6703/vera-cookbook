    - segment_id: ingredient-6
      text_verbatim: butter and flour for cake pan
      language: en
      source_region_ids:
      - vera-r0107-listgroup-3
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Beat egg whites until stiff, set aside. In a separate bowl cream sugar and egg yolks,
        adding one at a time and beating well after each addition. Add 1 tablespoon water. Continue beating
        until light and fluffy, about 10 minutes total. Fold in flour, nuts and stiffly whipped egg whites.
        Mix thoroughly, pour batter into buttered and floured 9" spring form cake pan. Preheat oven to
        350F, bake about 40 minutes or until cake tester or wooden pick comes out clean and cake separates
        from side of spring form.
      language: en
      source_region_ids:
      - vera-r0107-text-2
      step_number: 1
    - segment_id: step-2
      text_verbatim: When cooled, cut cake horizontally, spread evenly with chocolate or mocca filling,
        then frost top and sides with the same. Decorate with walnuts or pecan halves or tosted almonds
        slivers.
      language: en
      source_region_ids:
      - vera-r0107-text-4
      step_number: 2
