  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Pound the scallops. Make a few short cuts on the edges to prevent curling, salt them
        on both sides. Dredge them in flour, shake off excess, dip in beaten eggs and coat with bread
        crumbs. Fry in hot oil in a covered pan about 4 minutes or until golden brown; turn and fry the
        other side uncovered. Drain on paper towel. Serve with potatoes, potato salad, mashed potatoes,
        green salad.
      language: en
      source_region_ids:
      - vera-r0011-step-1
      step_number: 1
  notes:
  - segment_id: note-1
    text_verbatim: This is the correct way to prepare Wiener Schnitzels,
      a very popular meal in Bohemia. Thinly sliced boneless pork chops, beef tenderloin slices, boned
      and skinned chicken breast or cutlets may be prepared in the same manner.
