transcription:
  yield_time_lines:
  - segment_id: yield-1
    text_verbatim: 'Serves 6 – Preparation time: 45 minutes'
    language: en
    source_region_ids:
    - vera-r0047-yield
  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 6 carp steaks, 3·4 lbs.
      language: en
      source_region_ids:
      - vera-r0047-ingredients
    - segment_id: ingredient-2
      text_verbatim: 1·1/2 cups water or fish broth
      language: en
      source_region_ids:
      - vera-r0047-ingredients
    - segment_id: ingredient-3
      text_verbatim: 6 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0047-ingredients
    - segment_id: ingredient-4
      text_verbatim: 1 medium onion, finely chopped
      language: en
      source_region_ids:
      - vera-r0047-ingredients
    - segment_id: ingredient-5
      text_verbatim: parsley, finely chopped
      language: en
      source_region_ids:
      - vera-r0047-ingredients
    - segment_id: ingredient-6
      text_verbatim: 2 tablespoons paprika
      language: en
      source_region_ids:
      - vera-r0047-ingredients
    - segment_id: ingredient-7
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0047-ingredients
    - segment_id: ingredient-8
      text_verbatim: 3 tablespoons butter and 4 tablespoons flour for the roux
      language: en
      source_region_ids:
      - vera-r0047-ingredients
    - segment_id: ingredient-9
      text_verbatim: 'Optional: 1/2 cup heavy cream'
      language: en
      source_region_ids:
      - vera-r0047-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Melt butter in a large saucepot, add onion and cook until translucent. Add parsley
        and paprika, simmer 3 minutes. Add the fish and some of the fish broth or water.
      language: en
      source_region_ids:
      - vera-r0047-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Cover and simmer 15·20 minutes.
      language: en
      source_region_ids:
      - vera-r0047-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Using a slotted spatula, lift the carp portions onto a heated platter. For sauce,
        melt butter in a skillet and stir in flour. Cook and stir until golden.
      language: en
      source_region_ids:
      - vera-r0047-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: 'Add cooking liquid from the carp and some of the fish broth if needed.Cook until
        sauce thickens. Optional: for a creamier sauce blend in heavy cream. Season to taste with salt
        and pepper. Strain over fish. Serve with mashed potatoes, rice, tomato salad.'
      language: en
      source_region_ids:
      - vera-r0047-step-4
      step_number: 4
