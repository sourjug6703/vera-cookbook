      text_verbatim: 3 tablespoons golden raisins
      language: en
      source_region_ids:
      - vera-r0073-listgroup-1
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: In a bowl cream the sugar and the egg yolks. Add ricotta, lemon rind, sponge crumbs,
        rum and raisins - mix well. The sponge crumbs are added to thicken the filling. You can add a
        little more or less, to achieve the right consistency. If the filling is not thick enough, is
        runny, it would run out while baking and jeopardize the good look of the finished product.
      language: en
      source_region_ids:
      - vera-r0073-text-2
      step_number: 1
