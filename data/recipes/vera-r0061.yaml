  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 5 cups coarse flour, Gold Medal Wondra
      language: en
      source_region_ids:
      - vera-r0061-ingredients-main
    - segment_id: ingredient-2
      text_verbatim: 1 teaspoon baking powder
      language: en
      source_region_ids:
      - vera-r0061-ingredients-main
    - segment_id: ingredient-3
      text_verbatim: 1·1/2 cups milk, lukewarm
      language: en
      source_region_ids:
      - vera-r0061-ingredients-main
    - segment_id: ingredient-4
      text_verbatim: grated rind of 1 lemon
      language: en
      source_region_ids:
      - vera-r0061-ingredients-main
    - segment_id: ingredient-5
      text_verbatim: 2 egg yolks
      language: en
      source_region_ids:
      - vera-r0061-ingredients-main
    - segment_id: ingredient-6
      text_verbatim: 1 oz. fresh yeast
      language: en
      source_region_ids:
      - vera-r0061-ingredients-main
    - segment_id: ingredient-7
      text_verbatim: 1 teaspoon sugar
      language: en
      source_region_ids:
      - vera-r0061-ingredients-main
    - segment_id: ingredient-8
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0061-ingredients-main
  - section_id: ingredients-optional
    ingredients:
    - segment_id: ingredient-9
      text_verbatim: 3 tablespoons fried bread crumbs
      language: en
      source_region_ids:
      - vera-r0061-optional-ingredients
    label:
      segment_id: ingredient-label-optional
      text_verbatim: 'Optional:'
      language: en
      source_region_ids:
      - vera-r0061-optional-label
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: 'Leavening: In a bowl stir fresh yeast and sugar until it dissolves. Add 1/4 cup
        lukewarm milk and 1/3 cup flour, mix thoroughly into a smooth ball. Dust with flour, set aside
        to rise, in a warm draft free place. Should double in bulk within 15 minutes.'
      language: en
      source_region_ids:
      - vera-r0061-leavening
      step_number: 1
    - segment_id: step-2
      text_verbatim: In a separate bowl combine remaining flour, baking powder, lemon rind, salt. Make
        a well in center where you put egg yolks and the risen leavening. Mix all, gradually adding the
        remaining lukewarm milk. Knead until dough is smooth and separates from the bowl. Let it rise
        in a warm place for 30 minutes.
      language: en
      source_region_ids:
      - vera-r0061-step-1a
      - vera-r0061-step-1b
      step_number: 2
    - segment_id: step-3
      text_verbatim: Cut tablespoonsfuls of dough, round them into balls, let them rise on a floured surface
        for 10 minutes. Drop dumplings into rapidly boiling salted water, boil 5 minutes, turn them around
        with a spatula and cook another 5 minutes. Drain, pierce each with fork, sprinkle with hot butter.
      language: en
      source_region_ids:
      - vera-r0061-step-2
      step_number: 3
    - segment_id: step-4
      text_verbatim: 'Optional: Coat with fried bread crumbs. Serve with meats and sauces.'
      language: en
      source_region_ids:
      - vera-r0061-step-3
      step_number: 4
