  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 3 lbs. boneless veal shoulder, cut in 1” cubes
      language: en
      source_region_ids:
      - vera-r0012-ingredients
    - segment_id: ingredient-2
      text_verbatim: 6 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0012-ingredients
    - segment_id: ingredient-3
      text_verbatim: 1 medium onion, finely chopped
      language: en
      source_region_ids:
      - vera-r0012-ingredients
    - segment_id: ingredient-4
      text_verbatim: 2 tablespoons paprika
      language: en
      source_region_ids:
      - vera-r0012-ingredients
    - segment_id: ingredient-5
      text_verbatim: dash of hot curry powder
      language: en
      source_region_ids:
      - vera-r0012-ingredients
    - segment_id: ingredient-6
      text_verbatim: 2 cups chicken broth
      language: en
      source_region_ids:
      - vera-r0012-ingredients
    - segment_id: ingredient-7
      text_verbatim: juice of 1 lemon
      language: en
      source_region_ids:
      - vera-r0012-ingredients
    - segment_id: ingredient-8
      text_verbatim: 4 tablespoons flour
      language: en
      source_region_ids:
      - vera-r0012-ingredients
    - segment_id: ingredient-9
      text_verbatim: 1 pint heavy cream
      language: en
      source_region_ids:
      - vera-r0012-ingredients
    - segment_id: ingredient-10
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0012-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Melt butter in a heavy 3 quart saucepan. Add onion and cook over medium heat until
        translucent. Add paprika, curry, veal, 2·3 tablespoons chicken broth.
      language: en
      source_region_ids:
      - vera-r0012-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Simmer over low heat about 1 hr. adding gradually chicken broth, if needed. The meat
        must be simmering in just enough liquid so that it does not stick to the pot. You may not use
        up all of the chicken broth. When the veal is tender, not overcooked, add lemon juice. Mix well
        flour and cream and blend the mixture into the stew. Bring to boil, simmer 5 minutes, stirring
        often. Season to taste with salt and pepper.
      language: en
      source_region_ids:
      - vera-r0012-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Serve with dumplings, noodles, salad.
      language: en
      source_region_ids:
      - vera-r0012-step-3
      step_number: 3
