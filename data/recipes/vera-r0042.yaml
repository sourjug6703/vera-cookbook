      - vera-r0042-ingredients
    - segment_id: ingredient-5
      text_verbatim: 3·4 tablespoons flour
      language: en
      source_region_ids:
      - vera-r0042-ingredients
    - segment_id: ingredient-6
      text_verbatim: 1·1/2 cups chicken broth
      language: en
      source_region_ids:
