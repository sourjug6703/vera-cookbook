    - segment_id: ingredient-7
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0042-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Rinse and wipe the pheasant inside and out. Lard the breast and thighs with bacon
        strips. Brown the pheasant evenly all around in a frying pan in half of the butter and onion.
        Preheat oven to 350F. Transfer pheasant, breast down, into an ovenproof deep dish together with
        the butter and onion from the frying pan. Add salt and pepper. Roast 30·40 minutes, until the
        top gets reddish. Baste often with the remaining butter and chicken broth. Turn the bird breast
        side up, continue roasting in the same manner, 40·45 minutes. On the stove top bring the pan juices
        to boil. Add flour and cook 5 minutes stirring constantly. Add the remaining chicken broth and
        cook a little more. When the sauce thickens, strain it and pour over pheasant, cut in four portion
        sizes. Serve with red cabbage, potatoes, cranberries.
      language: en
      source_region_ids:
      - vera-r0042-step-1a
      - vera-r0042-step-1b
      step_number: 1
