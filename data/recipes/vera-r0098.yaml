  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: In a bowl cream the butter, sugar, egg yolks, vanilla sugar and lemon rind. Beat
        until fluffy. Add the milk and the flour mixed with baking powder. Fold in the stiffly whipped
        egg whites. Pour half of the batter in a separate bowl. Dissolve the cocoa powder in water and
        combine with one of the yellow batter halves. Turn the mixture into a buttered and floured fluted
        tube pan, alternating the yellow and the brown batter.
      language: en
      source_region_ids:
      - vera-r0098-text-2
      step_number: 1
    - segment_id: step-2
      text_verbatim: Bake at 350F for 1 hour, or until the toothpick comes out clean. Invert the cake
        onto wire rack, dust with sugar, cool and slice.
      language: en
      source_region_ids:
      - vera-r0098-text-3
      step_number: 2
