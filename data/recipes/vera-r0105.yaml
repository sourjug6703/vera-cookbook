  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: On a lightly floured surface sift together flour, salt, sugar and vanilla sugar.
        Make a well in the center. Put egg yolks, cream, wine and crumbled butter in the well. Knead,
        with the palms of your hands, until dough is smooth and shiny. Roll out into a paper-thin sheet.
        Cut into 2" squares. Make two 1" cuts inside each square. Fry in hot oil or butter on both sides,
        until lightly golden. Drain on paper towel, sprinkle with sugar mixed with vanilla sugar.
      language: en
      source_region_ids:
      - vera-r0105-text-2
      step_number: 1
