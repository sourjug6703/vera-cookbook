    - vera-r0006-yield
  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 6 thin, approx. 1/4”, slices beef sirloin (or veal top round)
      language: en
      source_region_ids:
      - vera-r0006-ingredients
    - segment_id: ingredient-2
      text_verbatim: 6 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0006-ingredients
    - segment_id: ingredient-3
      text_verbatim: 1 small onion
      language: en
      source_region_ids:
      - vera-r0006-ingredients
    - segment_id: ingredient-4
      text_verbatim: 1·1/2 cups sliced mushrooms
      language: en
      source_region_ids:
      - vera-r0006-ingredients
    - segment_id: ingredient-5
      text_verbatim: juice of one lemon
      language: en
      source_region_ids:
      - vera-r0006-ingredients
    - segment_id: ingredient-6
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0006-ingredients
    - segment_id: ingredient-7
      text_verbatim: 2 egg yolks
      language: en
      source_region_ids:
      - vera-r0006-ingredients
    - segment_id: ingredient-8
      text_verbatim: 6 thin slices bacon
      language: en
      source_region_ids:
      - vera-r0006-ingredients
    - segment_id: ingredient-9
      text_verbatim: 3/4 cup white wine
      language: en
      source_region_ids:
      - vera-r0006-ingredients
    - segment_id: ingredient-10
      text_verbatim: 3/4 cup olive oil
      language: en
      source_region_ids:
      - vera-r0006-ingredients
    - segment_id: ingredient-11
      text_verbatim: 3 tablespoons Worcestershire sauce
      language: en
      source_region_ids:
      - vera-r0006-ingredients
    - segment_id: ingredient-12
      text_verbatim: 3 cloves garlic
      language: en
      source_region_ids:
      - vera-r0006-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Pound the meat slices and salt them on both sides. In a skillet, combine the butter
        and finely chopped onion. Brown the onion lightly, then add sliced mushrooms and lemon juice.
        Sauté 6-8 minutes. Discard the fat. Blend in two egg yolks, spice with salt and pepper. Spread
        the mixture evenly over the meat slices, roll each to enclose mixture, wrap each roll with a slice
        of bacon. Tie them with a string or fasten with wooden picks or small skewers. Place them in a
        container.
      language: en
      source_region_ids:
      - vera-r0006-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Mix wine, olive oil, Worcestershire sauce and pressed garlic and pour over the meat
        rolls. Let them marinate for 4 hours or overnight in a refrigerator.
      language: en
      source_region_ids:
      - vera-r0006-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: On stove top heat a large heavy skillet. Add the rolls and brown them on all sides
        for about 20 minutes frequently adding some of the marinate. Remove the string, wooden picks or
        skewers. Serve with fried potatoes, vegetables, salad.
      language: en
      source_region_ids:
      - vera-r0006-step-3
      step_number: 3
