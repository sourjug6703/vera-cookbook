transcription:
  yield_time_lines:
  - segment_id: yield-1
    text_verbatim: 'Serves 6 – Preparation time: 3 hours'
    language: en
    source_region_ids:
    - vera-r0014-yield
  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 3·4 lbs. fresh ham, boned and skinned
      language: en
      source_region_ids:
      - vera-r0014-ingredients
    - segment_id: ingredient-2
      text_verbatim: 4 slices bacon
      language: en
      source_region_ids:
      - vera-r0014-ingredients
    - segment_id: ingredient-3
      text_verbatim: 6 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0014-ingredients
    - segment_id: ingredient-4
      text_verbatim: 2 carrots
      language: en
      source_region_ids:
      - vera-r0014-ingredients
    - segment_id: ingredient-5
      text_verbatim: 1 celery root
      language: en
      source_region_ids:
      - vera-r0014-ingredients
    - segment_id: ingredient-6
      text_verbatim: 1 parsnip
      language: en
      source_region_ids:
      - vera-r0014-ingredients
    - segment_id: ingredient-7
      text_verbatim: 3 bay leaves, thyme, whole allspice, whole black pepper
      language: en
      source_region_ids:
      - vera-r0014-ingredients
    - segment_id: ingredient-8
      text_verbatim: 1 lemon
      language: en
      source_region_ids:
      - vera-r0014-ingredients
    - segment_id: ingredient-9
      text_verbatim: 1·1/2 cups sour cream
      language: en
      source_region_ids:
      - vera-r0014-ingredients
    - segment_id: ingredient-10
      text_verbatim: 2 tablespoons flour
      language: en
      source_region_ids:
      - vera-r0014-ingredients
    - segment_id: ingredient-11
      text_verbatim: 1·1/2 cups chicken stock or water
      language: en
      source_region_ids:
      - vera-r0014-ingredients
    - segment_id: ingredient-12
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0014-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Dice the carrots, celery root and parsnip. Cut the bacon into short strips.
      language: en
      source_region_ids:
      - vera-r0014-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Skim off fat from the meat, rinse and pat it dry, salt it and lard with bacon strips.
      language: en
      source_region_ids:
      - vera-r0014-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: In a large stewpot combine melted butter, vegetables, spices, lemon rind, grated
        or chopped.
      language: en
      source_region_ids:
      - vera-r0014-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Set over medium heat. Add the meat and brown it lightly on all sides. Lower the heat,
        cover tightly and simmer over low heat until tender, about 2 hours, gradually adding the chicken
        stock or water.
      language: en
      source_region_ids:
      - vera-r0014-step-4
      step_number: 4
    - segment_id: step-5
      text_verbatim: Remove meat from pot, keep it warm.
      language: en
      source_region_ids:
      - vera-r0014-step-5
      step_number: 5
    - segment_id: step-6
      text_verbatim: Strain the gravy into a saucepan. Combine flour and sour cream and blend it into
        the gravy. Add lemon juice, simmer 5 minutes.
      language: en
      source_region_ids:
      - vera-r0014-step-6a
      - vera-r0014-step-6b
      step_number: 6
    - segment_id: step-7
      text_verbatim: Slice meat, pour the gravy over it or serve separately.
      language: en
      source_region_ids:
      - vera-r0014-step-6b
      step_number: 7
    - segment_id: step-8
      text_verbatim: Serve with dumplings, noodles, vegetables.
      language: en
      source_region_ids:
      - vera-r0014-step-6b
      step_number: 8
