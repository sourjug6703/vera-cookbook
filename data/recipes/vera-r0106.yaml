  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: On a floured board sift together flour and sugar, make a well in center. Thoroughly
        blend all remaining ingredients and place in well. Gradually mixing in flour, knead with the palms
        of your hands until smooth. Form a neat ball. Let dough rest at least 1 hour in a cool place,
        or refrigerate overnight. Divide dough into equal pieces, the size of a ping-pong ball. Form pencil-thin
        strands and shape them into pretzels. Place on a greased cookie sheet, brush with beaten egg and
        sprinkle with crystal sugar. Bake at 350F 10-12 minutes or until golden.
      language: en
      source_region_ids:
      - vera-r0106-text-2
      step_number: 1
