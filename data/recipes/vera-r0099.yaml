  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 4·1/2 cups flour
      language: en
      source_region_ids:
      - vera-r0099-listgroup-1
    - segment_id: ingredient-2
      text_verbatim: 8 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0099-listgroup-1
    - segment_id: ingredient-3
      text_verbatim: 2 tablespoons sugar
      language: en
      source_region_ids:
      - vera-r0099-listgroup-1
    - segment_id: ingredient-4
      text_verbatim: 1 whole egg, 1 egg yolk
      language: en
      source_region_ids:
      - vera-r0099-listgroup-1
    - segment_id: ingredient-5
      text_verbatim: 2/3 cup milk
      language: en
      source_region_ids:
      - vera-r0099-listgroup-1
    - segment_id: ingredient-6
      text_verbatim: 2 lbs. plums, apricots, cherries or other fruits
      language: en
      source_region_ids:
      - vera-r0099-listgroup-1
  - section_id: ingredients-2
    ingredients:
    - segment_id: ingredient-7
      text_verbatim: 3/4 cup bread crumbs
      language: en
      source_region_ids:
      - vera-r0099-listgroup-4
    - segment_id: ingredient-8
      text_verbatim: 3 tablespoons sugar
      language: en
      source_region_ids:
      - vera-r0099-listgroup-4
    - segment_id: ingredient-9
      text_verbatim: 4 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0099-listgroup-4
    label:
      segment_id: label-3
      text_verbatim: 'Topping:'
      language: en
      source_region_ids:
      - vera-r0099-sectionheader-3
  - section_id: ingredients-3
    ingredients:
    - segment_id: ingredient-10
      text_verbatim: (1) Sugar mixed with a little cinnamon (2) Ground poppy seeds mixed with sugar (3)
        Grated farmers cheese (4) Cream or sour cream can substitute the hot butter
      language: en
      source_region_ids:
      - vera-r0099-listgroup-6
    label:
      segment_id: label-5
      text_verbatim: Topping variations
      language: en
      source_region_ids:
      - vera-r0099-sectionheader-5
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: In a bowl cream the butter, the egg, the egg yolk and sugar, using wire whisk or
        electric mixer at low speed. Add flour and lukewarm milk. Knead the dough until it no longer sticks
        to the bowl. Turn it over on a floured pastry board and roll it out to 1/2" thickness. Cut in
        squares 2 × 2". Place one plum, or other fruit pitted or not, in the center of each square. Enclose
        the dumplings by pressing the four corners firmly together and round them in the palm of your
        hand. Boil in lightly salted water for 6 - 7 minutes. Drain. Sprinkle with browned bread crumbs,
        sugar and melted hot butter.
      language: en
      source_region_ids:
      - vera-r0099-text-2
      step_number: 1
    - segment_id: step-2
      text_verbatim: These dumplings can be prepared ahead of time and reheated in double boiler.
      language: en
      source_region_ids:
      - vera-r0099-text-7
      step_number: 2
    - segment_id: step-3
      text_verbatim: Serve warm as a dessert or a meal.
      language: en
      source_region_ids:
      - vera-r0099-text-8
      step_number: 3
