  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Cook chicken and soup vegetables in lightly salted boiling water. When cool enough
        to handle, dice the chicken, discard soup vegetables, reserve the broth. While the chicken cooks,
        heat 2 tablespoons butter in a skillet and sauté the mushrooms over medium heat (about 4 minutes)
        – must not be too soft. Remove from heat and reserve. Cook cauliflower in lightly salted boiling
        water – do not overcook, must be tender, not mushy. Drain and separate in rosettes. Reserve. In
        a large skillet melt the remaining 2 tablespoons butter, add 3 tablespoons flour and stir over
        low/medium heat until golden brown. Add 1·1/2 cups of the reserved chicken broth and simmer, uncovered,
        until the mixture thickens, 5·10 minutes. Add juice of 1 lemon, diced chicken, simmer 2 minutes.
        Blend in egg yolks, mushrooms and cauliflower rosettes. Season to taste with salt, pepper, more
        lemon juice. If the ragoût is too thick, add a little more chicken broth. Serve as is with boiled
        potatoes, lettuce.
      language: en
      source_region_ids:
      - vera-r0026-step-main
      step_number: 1
  - section_id: instructions-au-gratin
    steps:
    - segment_id: step-2
      text_verbatim: Transfer the mixture into a buttered gratin dish, or casserole, top with grated Parmesan
        and bread crumbs. Sprinkle with melted butter. Bake in hot oven (400F), 10·15 minutes, or until
        the top is golden brown. Serve with french bread, bread sticks, lettuce.
      language: en
      source_region_ids:
      - vera-r0026-step-au-gratin
      step_number: 2
    label:
      segment_id: variant-label
      text_verbatim: 'or serve au gratin:'
      language: en
      source_region_ids:
      - vera-r0026-variant-label
