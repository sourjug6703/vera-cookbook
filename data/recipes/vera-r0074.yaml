  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 6 oz. ground or chopped walnuts
      language: en
      source_region_ids:
      - vera-r0074-listgroup-2
    - segment_id: ingredient-2
      text_verbatim: 2/3 cup maple syrup
      language: en
      source_region_ids:
      - vera-r0074-listgroup-2
    - segment_id: ingredient-3
      text_verbatim: 3/4 cup sponge crumbs
      language: en
      source_region_ids:
      - vera-r0074-listgroup-2
    - segment_id: ingredient-4
      text_verbatim: grated rind of 1 lemon
      language: en
      source_region_ids:
      - vera-r0074-listgroup-2
    - segment_id: ingredient-5
      text_verbatim: 1 teaspoon vanilla sugar
      language: en
      source_region_ids:
      - vera-r0074-listgroup-2
    - segment_id: ingredient-6
      text_verbatim: 2 tablespoons heavy cream
      language: en
      source_region_ids:
      - vera-r0074-listgroup-2
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Pour the maple syrup in a saucepan and bring over medium heat. When hot, but not
        boiling, remove from heat, add the walnuts, vanilla sugar, lemon rind and heavy cream and as much
        of the sponge crumbs as needed to thicken the mixture. Mix well.
      language: en
      source_region_ids:
      - vera-r0074-text-1
      step_number: 1
