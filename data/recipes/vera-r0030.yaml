    - segment_id: ingredient-3
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0030-ingredients-main
    - segment_id: ingredient-4
      text_verbatim: 3/4 cup chicken stock
      language: en
      source_region_ids:
      - vera-r0030-ingredients-main
  - section_id: ingredients-stuffing
    ingredients:
    - segment_id: ingredient-5
      text_verbatim: 4 and 2 tablespoons butter (2. tbsp for braising the liver)
      language: en
      source_region_ids:
      - vera-r0030-ingredients-stuffing
    - segment_id: ingredient-6
      text_verbatim: 2 egg yolks
      language: en
      source_region_ids:
      - vera-r0030-ingredients-stuffing
    - segment_id: ingredient-7
      text_verbatim: 1 egg white
      language: en
      source_region_ids:
      - vera-r0030-ingredients-stuffing
    - segment_id: ingredient-8
      text_verbatim: 2 hard baked rolls
      language: en
      source_region_ids:
      - vera-r0030-ingredients-stuffing
    - segment_id: ingredient-9
      text_verbatim: 1/2 cup milk
      language: en
      source_region_ids:
      - vera-r0030-ingredients-stuffing
    - segment_id: ingredient-10
      text_verbatim: liver from three pigeons, chopped
      language: en
      source_region_ids:
      - vera-r0030-ingredients-stuffing
    - segment_id: ingredient-11
      text_verbatim: parsley
      language: en
      source_region_ids:
      - vera-r0030-ingredients-stuffing
    - segment_id: ingredient-12
      text_verbatim: 1/2 cup bread crumbs
      language: en
      source_region_ids:
      - vera-r0030-ingredients-stuffing
    - segment_id: ingredient-13
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0030-ingredients-stuffing
    label:
      segment_id: label-stuffing
      text_verbatim: 'Stuffing:'
      language: en
      source_region_ids:
      - vera-r0030-stuffing-label
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Soak the rolls in milk, squeeze off excess, shred them. Cream the butter and the
        egg yolks, add the shredded rolls, the liver sautéed in butter, salt, snipped parsley, bread crumbs.
        Add stiffly whipped egg white.
      language: en
      source_region_ids:
      - vera-r0030-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Carefully loosen the skin of the breasts and fill the pockets with stuffing. Enclose
        with stitches.
      language: en
      source_region_ids:
      - vera-r0030-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Salt the pigeons. Place them in a roasting pan with melted butter, breasts down,
        roast at 350F for 20 minutes.
      language: en
      source_region_ids:
      - vera-r0030-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Baste with melted butter, juices from the pan and a little chicken stock.
      language: en
      source_region_ids:
      - vera-r0030-step-4
      step_number: 4
    - segment_id: step-5
      text_verbatim: Turn pigeons breasts up and finish roasting in the same manner.
      language: en
      source_region_ids:
      - vera-r0030-step-5
      step_number: 5
    - segment_id: step-6
      text_verbatim: To serve, cut the pigeons in halves, sprinkle with pan drippings and snipped parsley.
        (Remove the stitches, of course).
      language: en
      source_region_ids:
      - vera-r0030-step-6
      step_number: 6
    - segment_id: step-7
      text_verbatim: Serve with potatoes, green peas, salad, etc.
      language: en
      source_region_ids:
      - vera-r0030-step-7
      step_number: 7
    label:
      segment_id: label-prepare-stuffing
      text_verbatim: 'Prepare stuffing first:'
      language: en
      source_region_ids:
      - vera-r0030-instruction-label
