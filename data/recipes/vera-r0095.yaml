  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 6 hard baked rolls, italian or french, sliced 1/3" thick
      language: en
      source_region_ids:
      - vera-r0095-listgroup-2
    - segment_id: ingredient-2
      text_verbatim: 1 quart milk
      language: en
      source_region_ids:
      - vera-r0095-listgroup-2
    - segment_id: ingredient-3
      text_verbatim: 2 eggs
      language: en
      source_region_ids:
      - vera-r0095-listgroup-2
    - segment_id: ingredient-4
      text_verbatim: 1/3 cup sugar
      language: en
      source_region_ids:
      - vera-r0095-listgroup-2
    - segment_id: ingredient-5
      text_verbatim: dash of salt
      language: en
      source_region_ids:
      - vera-r0095-listgroup-2
    - segment_id: ingredient-6
      text_verbatim: 3 large apples, Granny Smith type, peeled, thinly sliced
      language: en
      source_region_ids:
      - vera-r0095-listgroup-2
    - segment_id: ingredient-7
      text_verbatim: 1/3 cup golden raisins
      language: en
      source_region_ids:
      - vera-r0095-listgroup-2
    - segment_id: ingredient-8
      text_verbatim: 2 tablespoons sugar mixed with 1/2 teaspoon cinnamon
      language: en
      source_region_ids:
      - vera-r0095-listgroup-2
    - segment_id: ingredient-9
      text_verbatim: 4 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0095-listgroup-2
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Beat lightly milk, eggs, sugar, salt. Soak bread slices in the mixture. Squeeze off
        excess and arrange bread in a single layer in a generously buttered ovenproof casserole. Follow
        with a layer of apples. Spread raisins and cinnamon/sugar evenly over apples. Top with a layer
        of bread slices. Preheat oven to 350F. Bake 30-40 minutes until top is golden brown. Dust with
        sugar. Serve hot or cooled.
      language: en
      source_region_ids:
      - vera-r0095-text-1
      step_number: 1
