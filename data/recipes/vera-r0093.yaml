  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 2 cups flour
      language: en
      source_region_ids:
      - vera-r0093-listgroup-2
    - segment_id: ingredient-2
      text_verbatim: 1 teaspoon baking powder
      language: en
      source_region_ids:
      - vera-r0093-listgroup-2
    - segment_id: ingredient-3
      text_verbatim: 1/3 cup sugar
      language: en
      source_region_ids:
      - vera-r0093-listgroup-2
    - segment_id: ingredient-4
      text_verbatim: 6 tablespoons butter, softened
      language: en
      source_region_ids:
      - vera-r0093-listgroup-2
    - segment_id: ingredient-5
      text_verbatim: 2/3 cup milk
      language: en
      source_region_ids:
      - vera-r0093-listgroup-2
    - segment_id: ingredient-6
      text_verbatim: 1 egg yolk
      language: en
      source_region_ids:
      - vera-r0093-listgroup-2
    - segment_id: ingredient-7
      text_verbatim: grated rind of 1 lemon
      language: en
      source_region_ids:
      - vera-r0093-listgroup-2
    - segment_id: ingredient-8
      text_verbatim: pinch of salt
      language: en
      source_region_ids:
      - vera-r0093-listgroup-2
    - segment_id: ingredient-9
      text_verbatim: grease for oven tray
      language: en
      source_region_ids:
      - vera-r0093-listgroup-2
    - segment_id: ingredient-10
      text_verbatim: 2 tablespoons sugar mixed with vanilla sugar
      language: en
      source_region_ids:
      - vera-r0093-listgroup-2
  - section_id: ingredients-2
    ingredients:
    - segment_id: ingredient-11
      text_verbatim: 3 medium apples, Granny Smith, peeled, cored, thinly sliced or grated
      language: en
      source_region_ids:
      - vera-r0093-listgroup-7
    - segment_id: ingredient-12
      text_verbatim: 1/3 cup golden raisins
      language: en
      source_region_ids:
      - vera-r0093-listgroup-7
    - segment_id: ingredient-13
      text_verbatim: 3 tablespoons sugar mixed with 1/2 teaspoon cinnamon
      language: en
      source_region_ids:
      - vera-r0093-listgroup-7
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Blend baking powder and flour. Add sugar, egg yolk, lemon rind, salt, milk and butter.
        Mix thoroughly and knead until smooth, about 10 minutes.
      language: en
      source_region_ids:
      - vera-r0093-text-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: On a greased oven tray roll dough out to 1/3" thickness, leaving the edges a little
        higher. Mix apples, raisins, sugar-cinnamon and spread evenly over dough. Bake at 350F, 20-25
        minutes, until border is golden brown. Place pie on a wire rack to cool, dust with sugar mixed
        with vanilla sugar. Cut into squares.
      language: en
      source_region_ids:
      - vera-r0093-text-3
      step_number: 2
    - segment_id: step-3
      text_verbatim: Instead of one oblong pie, you can make two smaller round pies.
      language: en
      source_region_ids:
      - vera-r0093-text-4
      step_number: 3
    - segment_id: step-4
      text_verbatim: 'Filling:'
      language: en
      source_region_ids:
      - vera-r0093-text-6
      step_number: 4
