  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Prepare the bird as indicated in “roast turkey”. Turn the neck into the body cavity
        to block the passage between the neck and the body. The stuffing will stay in the neck cavity
        while roasting. Lightly fill neck cavity with stuffing. Do not pack · stuffing will expand while
        cooking. Fasten neck skin with stitches or skewer. Roast turkey as shown above.
      language: en
      source_region_ids:
      - vera-r0029-step-main
      step_number: 1
  - section_id: instructions-giblets
    steps:
    - segment_id: step-2
      text_verbatim: Soak the rolls in milk or water, squeeze off excess liquid, shred them. Rinse and
        finely chop the giblets.
      language: en
      source_region_ids:
      - vera-r0029-giblets-step-1
      step_number: 2
    - segment_id: step-3
      text_verbatim: In a bowl cream butter, eggs, add the chopped onion, thyme, marjoram, shredded rolls,
        giblets, bread crumbs. Salt the mixture and mix thoroughly.
      language: en
      source_region_ids:
      - vera-r0029-giblets-step-2
      step_number: 3
    label:
      segment_id: instruction-label-giblets
      text_verbatim: 'Giblets stuffing:'
      language: en
      source_region_ids:
      - vera-r0029-giblets-label
  - section_id: instructions-chestnuts
    steps:
    - segment_id: step-4
      text_verbatim: Simmer chestnuts in water for 10·15 minutes. When the shells crack, peel and chop
        them coarsely.
      language: en
      source_region_ids:
      - vera-r0029-chestnuts-step-1
      step_number: 4
    - segment_id: step-5
      text_verbatim: Break the rolls, soak them in milk, squeeze off excess, shred them. In a bowl cream
        butter, one whole egg and three egg yolks. Add the shredded rolls, nutmeg, sugar and coarsely
        chopped chestnuts. Salt the mixture; Fold in half of the bread crumbs and three stiffly whipped
        egg whites.
      language: en
      source_region_ids:
      - vera-r0029-chestnuts-step-2
      step_number: 5
    - segment_id: step-6
      text_verbatim: Turn the stuffing into a fluted tube pan or a flan ring, buttered and dusted with
        bread crumbs. Bake in a bain-marie at 350F for 1·1/2 hours. When done, let it stand 5 minutes,
        then invert on a serving dish. Slice it like a cake.
      language: en
      source_region_ids:
      - vera-r0029-chestnuts-step-3a
      - vera-r0029-chestnuts-step-3b
      step_number: 6
    - segment_id: step-7
      text_verbatim: Serve with apricot or pear compote, cranberries, etc.
      language: en
      source_region_ids:
      - vera-r0029-chestnuts-step-4
      step_number: 7
    label:
      segment_id: instruction-label-chestnuts
      text_verbatim: 'Chestnuts stuffing:'
      language: en
      source_region_ids:
      - vera-r0029-chestnuts-label
  - section_id: instructions-almond
    steps:
    - segment_id: step-8
      text_verbatim: Break the rolls and soak them in milk. Squeeze off excess, shred and strain them.
      language: en
      source_region_ids:
      - vera-r0029-almond-step-1
      step_number: 8
    - segment_id: step-9
      text_verbatim: In a bowl cream butter, egg yolks and sugar. Combine all ingredients. Fold in three
        stiffly beaten egg whites.
      language: en
      source_region_ids:
      - vera-r0029-almond-step-2
      step_number: 9
    - segment_id: step-10
      text_verbatim: Bake and serve in the same manner as chestnut stuffing.
      language: en
      source_region_ids:
      - vera-r0029-almond-step-3
      step_number: 10
    label:
      segment_id: instruction-label-almond
      text_verbatim: 'Almond stuffing:'
      language: en
      source_region_ids:
      - vera-r0029-almond-label
  - section_id: instructions-raisins
    steps:
    - segment_id: step-11
      text_verbatim: Same as almond stuffing, replacing half of the almonds with 3/4 cup golden raisins.
      language: en
      source_region_ids:
      - vera-r0029-raisins-step
      step_number: 11
    label:
      segment_id: instruction-label-raisins
      text_verbatim: 'Raisins stuffing:'
      language: en
      source_region_ids:
      - vera-r0029-raisins-label
