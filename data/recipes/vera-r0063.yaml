  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 5 medium potatoes, boiled, cooled, peeled and diced
      language: en
      source_region_ids:
      - vera-r0063-listgroup-1
    - segment_id: ingredient-2
      text_verbatim: 2 medium onions, finely chopped
      language: en
      source_region_ids:
      - vera-r0063-listgroup-1
    - segment_id: ingredient-3
      text_verbatim: 5 slices ham cut in thin strips
      language: en
      source_region_ids:
      - vera-r0063-listgroup-1
    - segment_id: ingredient-4
      text_verbatim: 7 pickled cucumbers, peeled, diced, squeezed dry
      language: en
      source_region_ids:
      - vera-r0063-listgroup-1
    - segment_id: ingredient-5
      text_verbatim: 2 large green apples, Granny Smith, peeled, cored, diced
      language: en
      source_region_ids:
      - vera-r0063-listgroup-1
    - segment_id: ingredient-6
      text_verbatim: 2/3 cup Hellmann's mayonnaise mixed with 1 tablespoon Dijon mustard
      language: en
      source_region_ids:
      - vera-r0063-listgroup-1
    - segment_id: ingredient-7
      text_verbatim: 2 teaspoons vinegar
      language: en
      source_region_ids:
      - vera-r0063-listgroup-1
    - segment_id: ingredient-8
      text_verbatim: 2 teaspoons white wine Worcestershire sauce
      language: en
      source_region_ids:
      - vera-r0063-listgroup-1
    - segment_id: ingredient-9
      text_verbatim: white pepper
      language: en
      source_region_ids:
      - vera-r0063-listgroup-1
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Place potatoes in a large bowl, sprinkle with vinegar, Worcestershire sauce, pepper.
        Add onions, ham, apples. Add pickles last, making sure they are squeezed dry. Lightly toss together
        all ingredients. With a spatula thoroughly but carefully blend in mayonnaise/mustard mixture.
        Chill to blend flavors, at least several hours. To serve, spoon salad in a bowl lined with lettuce.
        Serve with roasts, chicken, meatloaf.
      language: en
      source_region_ids:
      - vera-r0063-text-2
      step_number: 1
