      - vera-r0094-listgroup-1
    - segment_id: ingredient-2
      text_verbatim: 1 teaspoon baking powder
      language: en
      source_region_ids:
      - vera-r0094-listgroup-1
    - segment_id: ingredient-3
      text_verbatim: 2 medium potatoes, boiled, mashed
      language: en
      source_region_ids:
      - vera-r0094-listgroup-1
    - segment_id: ingredient-4
      text_verbatim: 4 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0094-listgroup-1
    - segment_id: ingredient-5
      text_verbatim: 1/3 cup sugar
      language: en
      source_region_ids:
      - vera-r0094-listgroup-1
    - segment_id: ingredient-6
      text_verbatim: 1 egg
      language: en
      source_region_ids:
      - vera-r0094-listgroup-1
    - segment_id: ingredient-7
      text_verbatim: grease for baking dish
      language: en
      source_region_ids:
      - vera-r0094-listgroup-1
  - section_id: ingredients-2
    ingredients:
    - segment_id: ingredient-8
      text_verbatim: 1/2 cup hazelnuts or walnuts, ground or chopped
      language: en
      source_region_ids:
      - vera-r0094-listgroup-4
    - segment_id: ingredient-9
      text_verbatim: 3 medium apples, Granny Smith, peeled, thinly sliced parboiled
      language: en
      source_region_ids:
      - vera-r0094-listgroup-4
    - segment_id: ingredient-10
      text_verbatim: 2/3 cup sugar
      language: en
