      segment_id: label-3
      text_verbatim: 'Filling:'
      language: en
      source_region_ids:
      - vera-r0094-sectionheader-3
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Blend baking powder into flour. Add all ingredients and mix thoroughly. Knead about
        10 minutes, until dough is smooth and dry. On a floured surface roll dough out to 1/3" thickness,
        cut in two halves. Place one half in a buttered baking dish, evenly spread apple mixture. Cover
        with other half of dough. Preheat oven to 375F, bake 30 minutes or until golden on top. Cut in
        squares, lightly dust with sugar.
      language: en
      source_region_ids:
      - vera-r0094-text-2
      step_number: 1
