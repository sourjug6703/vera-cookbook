transcription:
  yield_time_lines:
  - segment_id: yield-1
    text_verbatim: 'Serves 6 – Preparation time: 3 hours'
    language: en
    source_region_ids:
    - vera-r0013-yield
  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 3·4 lbs. center cut pork roast – (ask the butcher to saw across the rib bones of
        the roast, at the base of the backbone – separating the ribs from the backbone. It will ease the
        carving).
      language: en
      source_region_ids:
      - vera-r0013-ingredients
    - segment_id: ingredient-2
      text_verbatim: 2 cups chicken stock
      language: en
      source_region_ids:
      - vera-r0013-ingredients
    - segment_id: ingredient-3
      text_verbatim: 2 teaspoons caraway seeds
      language: en
      source_region_ids:
      - vera-r0013-ingredients
    - segment_id: ingredient-4
      text_verbatim: 3 cloves garlic, pressed
      language: en
      source_region_ids:
      - vera-r0013-ingredients
    - segment_id: ingredient-5
      text_verbatim: 2 bay leaves
      language: en
      source_region_ids:
      - vera-r0013-ingredients
    - segment_id: ingredient-6
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0013-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: In a saucepan heat the chicken stock, caraway seeds, bay leaves and garlic.
      language: en
      source_region_ids:
      - vera-r0013-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Rinse and pat dry the meat and rub it with salt and pepper. Place it, skin down,
        on a rack in an open roasting pan. Pour half of the liquid from the saucepan over the meat and
        roast at 350F for 1 hour, basting frequently with the juices from the pan and the liquid from
        the saucepan. Turn the meat and continue roasting for 1·1/2 hours, until the top is golden brown
        and the meat tender. Allow 35 minutes per pound.
      language: en
      source_region_ids:
      - vera-r0013-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: When done let it rest 5 minutes, carve.
      language: en
      source_region_ids:
      - vera-r0013-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Skim fat from the pan drippings, strain some over the roast, serve the rest in a
        saucedish.
      language: en
      source_region_ids:
      - vera-r0013-step-4
      step_number: 4
    - segment_id: step-5
      text_verbatim: Serve with dumplings, potato dumplings, boiled potatoes and sauerkraut.
      language: en
      source_region_ids:
      - vera-r0013-step-5
      step_number: 5
