  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1 goose, 10 lbs.
      language: en
      source_region_ids:
      - vera-r0031-ingredients
    - segment_id: ingredient-2
      text_verbatim: 4·5 medium apples
      language: en
      source_region_ids:
      - vera-r0031-ingredients
    - segment_id: ingredient-3
      text_verbatim: salt, caraway seeds
      language: en
      source_region_ids:
      - vera-r0031-ingredients
    - segment_id: ingredient-4
      text_verbatim: water
      language: en
      source_region_ids:
      - vera-r0031-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      step_number: 1
      text_verbatim: Rinse goose, pat dry. Rinse the apples-do not peel them. Rub the goose inside and
        out with salt and caraway seeds. Fill body cavity with apples.
      language: en
      source_region_ids:
      - vera-r0031-step-1
    - segment_id: step-2
      step_number: 2
      text_verbatim: Place goose in a roasting pan with a little hot water at the bottom.
      language: en
      source_region_ids:
      - vera-r0031-step-2
    - segment_id: step-3
      step_number: 3
      text_verbatim: Roast at 350F, first breast side down for 1·1/2 hrs, basting with water and pan drippings.
        When golden brown on top, turn goose breast side up. Continue roasting for 1-1/2 hours. While
        roasting, prick the skin with a fork over the fatty areas to release fat. (Just the skin, not
        the meat. If the juice from the meat runs out, the goose will become dry.) Total roasting time
        is approximately 20 minutes per pound. During the last 15 minutes of roasting, raise oven temperature
        to 400F and stop basting to achieve a crunchy skin. Remove apples and slice goose. Skim fat from
        pan juices and pour into a gravy boat to accompany goose. Serve with dumplings, potato dumplings,
        cabbage, red cabbage, sauerkraut.
      language: en
      source_region_ids:
      - vera-r0031-step-3a
      - vera-r0031-step-3b
