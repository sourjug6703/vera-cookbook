  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 2 quarts water
      language: en
      source_region_ids:
      - vera-r0065-listgroup-2
    - segment_id: ingredient-2
      text_verbatim: 1 small chicken, 2 lbs., quartered
      language: en
      source_region_ids:
      - vera-r0065-listgroup-2
    - segment_id: ingredient-3
      text_verbatim: 2 beef soup bones
      language: en
      source_region_ids:
      - vera-r0065-listgroup-2
    - segment_id: ingredient-4
      text_verbatim: soup greens (carrot, celery, parsley)
      language: en
      source_region_ids:
      - vera-r0065-listgroup-2
    - segment_id: ingredient-5
      text_verbatim: 1 medium onion, quartered
      language: en
      source_region_ids:
      - vera-r0065-listgroup-2
    - segment_id: ingredient-6
      text_verbatim: 1/3 teaspoon ground allspice
      language: en
      source_region_ids:
      - vera-r0065-listgroup-2
    - segment_id: ingredient-7
      text_verbatim: 1 egg yolk
      language: en
      source_region_ids:
      - vera-r0065-listgroup-2
    - segment_id: ingredient-8
      text_verbatim: 1/2 cup heavy cream
      language: en
      source_region_ids:
      - vera-r0065-listgroup-2
    - segment_id: ingredient-9
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0065-listgroup-2
    - segment_id: ingredient-10
      text_verbatim: 2 tablespoons butter and 3 tablespoons flour for the roux
      language: en
      source_region_ids:
      - vera-r0065-listgroup-2
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Place water, chicken, bones, soup greens, onion, salt in a large saucepan. Bring
        to boiling. Simmer, covered, 45 minutes or until chicken is tender.
      language: en
      source_region_ids:
      - vera-r0065-text-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Remove chicken when cool, discard skin and bones, puree chicken meat. Reserve.
      language: en
      source_region_ids:
      - vera-r0065-text-3
      step_number: 2
    - segment_id: step-3
      text_verbatim: In a separate saucepan stir flour into melted butter and cook until bubbly and golden
        brown. Gradually add the broth from the chicken, bones, allspice and pepper. Cook 10 minutes over
        medium heat. Strain. Stir in puréed chicken. Lightly beat egg yolk and cream and blend mixture
        into soup. Season with salt and pepper. Heat through. Do not boil after egg yolk/cream addition.
      language: en
      source_region_ids:
      - vera-r0065-text-4
      step_number: 3
