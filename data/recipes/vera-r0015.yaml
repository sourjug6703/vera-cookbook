transcription:
  yield_time_lines:
  - segment_id: yield-1
    text_verbatim: 'Serves 6 – Preparation time: 45 minutes'
    language: en
    source_region_ids:
    - vera-r0015-yield
  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 6 pork chops
      language: en
      source_region_ids:
      - vera-r0015-ingredients
    - segment_id: ingredient-2
      text_verbatim: 1/2 cup flour
      language: en
      source_region_ids:
      - vera-r0015-ingredients
    - segment_id: ingredient-3
      text_verbatim: 1/2 cup vegetable oil
      language: en
      source_region_ids:
      - vera-r0015-ingredients
    - segment_id: ingredient-4
      text_verbatim: 2 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0015-ingredients
    - segment_id: ingredient-5
      text_verbatim: 1 cup chicken stock
      language: en
      source_region_ids:
      - vera-r0015-ingredients
    - segment_id: ingredient-6
      text_verbatim: 1 small onion
      language: en
      source_region_ids:
      - vera-r0015-ingredients
    - segment_id: ingredient-7
      text_verbatim: 2 teaspoons caraway seeds
      language: en
      source_region_ids:
      - vera-r0015-ingredients
    - segment_id: ingredient-8
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0015-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Pound the pork chops lightly·they should not be more than 1/2" thick. Make a few
        short cuts on the edges to prevent curling, salt them on both sides and dust with flour on one
        side. Brown chops in hot oil, floured side first.
      language: en
      source_region_ids:
      - vera-r0015-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: In a large skillet combine the butter and finely chopped onion and set over medium
        heat.
      language: en
      source_region_ids:
      - vera-r0015-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: When the onion becomes translucent, add caraway seeds and some of the chicken stock.
        Add the pork chops and simmer about 30 minutes or until they are tender.
      language: en
      source_region_ids:
      - vera-r0015-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Remove the chops, bring the liquid to boil, blend in flour and chicken stock and
        simmer until the sauce thickens. The sauce should be medium thick. Strain.
      language: en
      source_region_ids:
      - vera-r0015-step-4
      step_number: 4
    - segment_id: step-5
      text_verbatim: Return pork chops in the sauce, simmer until heated through.
      language: en
      source_region_ids:
      - vera-r0015-step-5
      step_number: 5
    - segment_id: step-6
      text_verbatim: Serve with boiled potatoes, rice, salad.
      language: en
      source_region_ids:
      - vera-r0015-step-5
      step_number: 6
