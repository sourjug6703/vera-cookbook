  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Rinse the meat and pat it dry with a paper towel. Using the handle of a wooden spoon,
        make an opening in the narrower end of the veal breast to form a cavity for stuffing. Most supermarkets
        sell the veal breast ready to be stuffed.
      language: en
      source_region_ids:
      - vera-r0008-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Salt the meat and lightly fill the cavity with stuffing. Enclose it with stitches,
        or use a skewer. Lay the stuffed veal breast in a roasting pan with rack, skin down. Pour some
        of the melted butter on top and roast at 350F for 45 minutes. Turn it and roast 45 minutes to
        1 hour, or until golden on top.
      language: en
      source_region_ids:
      - vera-r0008-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Baste occasionally with melted butter and pan drippings.
      language: en
      source_region_ids:
      - vera-r0008-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Prick the stuffed cavity with fork several times to let out the steam. (The steam
        would push out the stuffing while slicing it). Remove the stitches or skewer.
      language: en
      source_region_ids:
      - vera-r0008-step-4
      step_number: 4
    - segment_id: step-5
      text_verbatim: Let it stand 5 minutes. Slice and sprinkle with juices from the pan. Serve with boiled
        potatoes, vegetables, salad, compote.
      language: en
      source_region_ids:
      - vera-r0008-step-5
      step_number: 5
  - section_id: instructions-egg-stuffing
    steps:
    - segment_id: step-6
      text_verbatim: In a frying pan combine melted butter and lightly beaten eggs. Scramble until the
        egg whites stiffen. Blend in ham and green peas. Salt.
      language: en
      source_region_ids:
      - vera-r0008-egg-step
      step_number: 6
    label:
      segment_id: label-instruction-egg
      text_verbatim: 'Egg stuffing:'
      language: en
      source_region_ids:
      - vera-r0008-egg-title
  - section_id: instructions-bread-stuffing
    steps:
    - segment_id: step-7
      text_verbatim: Soak the rolls in milk, squeeze off excess, shred them. In a bowl cream the butter,
        whisk in the egg and the egg yolk. Add all remaining ingredients, leaving the bread crumbs to
        be added last. If the stuffing is thick enough, do not use up all bread crumbs. This stuffing
        may also be used for roasted stuffed chicken, pigeon, etc.
      language: en
      source_region_ids:
      - vera-r0008-bread-step
      step_number: 7
    label:
      segment_id: label-instruction-bread
      text_verbatim: 'Bread stuffing:'
      language: en
      source_region_ids:
      - vera-r0008-bread-title
  - section_id: instructions-liver-stuffing
    steps:
    - segment_id: step-8
      text_verbatim: Soak the rolls in milk, squeeze off excess, shred them. Grind the liver, or mash
        it with a knife. Cream the butter, and blend in thoroughly all ingredients.
      language: en
      source_region_ids:
      - vera-r0008-liver-step
      step_number: 8
    label:
      segment_id: label-instruction-liver
      text_verbatim: 'Liver stuffing:'
      language: en
      source_region_ids:
      - vera-r0008-liver-title
