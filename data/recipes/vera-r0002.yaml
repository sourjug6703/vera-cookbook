  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      step_number: 1
      text_verbatim: Cut the tenderloin into 1” thick slices. Pound each slice with the palm of your hand
        and lard with half slice bacon each. Salt and pepper them lightly and fry in hot oil about 2·1/2
        minutes on each side. Place them in a casserole, keep them warm.
      language: en
      source_region_ids:
      - vera-r0002-step-1
    - segment_id: step-2
      step_number: 2
      text_verbatim: In a saucepan combine melted butter, onion, pickles, anchovies, parsley, capers,
        lemon rind, marjoram and thyme and brown all. Add flour, brown a little more. Add stock or water,
        sour cream. Simmer for five minutes, strain and pour over the meat slices. Simmer until heated
        through.
      language: en
      source_region_ids:
      - vera-r0002-step-2
    - segment_id: step-3
      step_number: 3
      text_verbatim: Serve with dumplings, gnocchi, rice, noodles.
      language: en
      source_region_ids:
      - vera-r0002-step-3
