    - segment_id: ingredient-6
      text_verbatim: 2 pickled cucumbers (sour), sliced
      language: en
      source_region_ids:
      - vera-r0002-ingredients
    - segment_id: ingredient-7
      text_verbatim: 2 canned fillets of anchovies, chopped
      language: en
      source_region_ids:
      - vera-r0002-ingredients
    - segment_id: ingredient-8
      text_verbatim: 3 teaspoons capers
      language: en
      source_region_ids:
      - vera-r0002-ingredients
    - segment_id: ingredient-9
