  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 6 veal chops
      language: en
      source_region_ids:
      - vera-r0009-ingredients
    - segment_id: ingredient-2
      text_verbatim: 1/2 cup flour
      language: en
      source_region_ids:
      - vera-r0009-ingredients
    - segment_id: ingredient-3
      text_verbatim: 1/2 cup vegetable oil
      language: en
      source_region_ids:
      - vera-r0009-ingredients
    - segment_id: ingredient-4
      text_verbatim: 2 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0009-ingredients
    - segment_id: ingredient-5
      text_verbatim: 1 cup chicken stock
      language: en
      source_region_ids:
      - vera-r0009-ingredients
    - segment_id: ingredient-6
      text_verbatim: 1 small onion
      language: en
      source_region_ids:
      - vera-r0009-ingredients
    - segment_id: ingredient-7
      text_verbatim: 1 teaspoon caraway seeds
      language: en
      source_region_ids:
      - vera-r0009-ingredients
    - segment_id: ingredient-8
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0009-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Pound the veal chops lightly-they should not be more than 1/2” thick. Make a few
        short cuts on the edges to prevent curling, salt them on both sides, and dust with flour on one
        side. Brown chops in hot oil on both sides, floured side first. In a skillet combine the butter
        and finely chopped onion and set over medium heat.
      language: en
      source_region_ids:
      - vera-r0009-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: When the onion becomes translucent add the caraway seeds, some of the chicken stock
        and the veal chops and simmer about 30 minutes or until the chops are tender.
      language: en
      source_region_ids:
      - vera-r0009-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Remove the veal chops. Bring the liquid to boil, blend in flour and remaining stock,
        and boil until the sauce thickens (about 5 minutes). Strain the sauce over the veal chops, simmer
        5 minutes. Serve with noodles, rice, salad.
      language: en
      source_region_ids:
      - vera-r0009-step-3
      step_number: 3
