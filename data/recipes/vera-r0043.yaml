  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Rinse and wipe the pheasant inside and out. Lard the breast and thighs with bacon
        strips. Roast pheasant as indicated in “Roast pheasant”. In a saucepan blend pan juices, cream
        and horseradish. Cook for 5 minutes over medium heat. Add cognac and lemon juice. Season to taste
        with salt and pepper. Strain.
      language: en
      source_region_ids:
      - vera-r0043-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Pour some gravy over the pheasant cut in 4 portions. Serve remaining gravy separately.
        Serve with rice, vegetables.
      language: en
      source_region_ids:
      - vera-r0043-step-2
      step_number: 2
