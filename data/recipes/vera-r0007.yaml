  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 3·4 lbs. leg of veal or top round, boned
      language: en
      source_region_ids:
      - vera-r0007-ingredients-a
    - segment_id: ingredient-2
      text_verbatim: 4 slices bacon
      language: en
      source_region_ids:
      - vera-r0007-ingredients-a
    - segment_id: ingredient-3
      text_verbatim: 1/2 cup cognac
      language: en
      source_region_ids:
      - vera-r0007-ingredients-a
    - segment_id: ingredient-4
      text_verbatim: 6 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0007-ingredients-a
    - segment_id: ingredient-5
      text_verbatim: 2·1/2 cups white table wine
      language: en
      source_region_ids:
      - vera-r0007-ingredients-a
    - segment_id: ingredient-6
      text_verbatim: 1 cup chicken stock
      language: en
      source_region_ids:
      - vera-r0007-ingredients-a
    - segment_id: ingredient-7
      text_verbatim: 1 medium size onion
      language: en
      source_region_ids:
      - vera-r0007-ingredients-a
    - segment_id: ingredient-8
      text_verbatim: 2 carrots
      language: en
      source_region_ids:
      - vera-r0007-ingredients-a
    - segment_id: ingredient-9
      text_verbatim: snipped parsley, thyme, bay leaves
      language: en
      source_region_ids:
      - vera-r0007-ingredients-b
    - segment_id: ingredient-10
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0007-ingredients-b
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Lard the veal with strips of bacon. Rub it with salt and pepper. In a casserole combine
        the butter, chopped onion and the roast. Brown it lightly. Pour the cognac over and ignite it.
        When the flame dies down add the wine, sliced carrots, thyme, snipped parsley, crushed bay leaves,
        some of the chicken stock, and roast at 350F for 2 hours, basting occasionally with pan juices
        and chicken stock. Slice the roast. Strain pan juices into a saucepan, add 1/2 tablespoon butter
        and more chicken stock if needed; bring to boil. Serve sauce over sliced meat or on side. Serve
        with vegetables, noodles, boiled potatoes.
      language: en
      source_region_ids:
      - vera-r0007-step-1a
      - vera-r0007-step-1b
      step_number: 1
