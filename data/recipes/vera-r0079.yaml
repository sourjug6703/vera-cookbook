    steps:
    - segment_id: step-1
      step_number: 1
      text_verbatim: In a saucepan cream egg yolks, sugar mixed with vanilla sugar, corn starch. Gradually
        add hot milk or cream, stirring constantly. Set over low heat, bring to boiling, stirring steadily
