  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1 duckling, 5-6 lbs.
      language: en
      source_region_ids:
      - vera-r0033-ingredients
    - segment_id: ingredient-2
      text_verbatim: 5 slices ham, cut in stripes
      language: en
      source_region_ids:
      - vera-r0033-ingredients
    - segment_id: ingredient-3
      text_verbatim: 8 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0033-ingredients
    - segment_id: ingredient-4
      text_verbatim: 1 cup Madeira wine
      language: en
      source_region_ids:
      - vera-r0033-ingredients
    - segment_id: ingredient-5
      text_verbatim: 1 cup chicken stock
      language: en
      source_region_ids:
      - vera-r0033-ingredients
    - segment_id: ingredient-6
      text_verbatim: 3 tablespoons flour
      language: en
      source_region_ids:
      - vera-r0033-ingredients
    - segment_id: ingredient-7
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0033-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Rinse duckling, pat dry. Sprinkle with salt and pepper inside and out. Melt butter
        in a roasting pan, add ham and duckling. Brown it quickly on both sides under the broiler. Lower
        oven temperature to 350F. Pour Madeira wine over duckling. Add some of the chicken stock, salt
        and pepper, and cover with buttered waxpaper. Roast 1 to 1·1/2 hours, occasionally adding the
        remaining chicken stock.
      language: en
      source_region_ids:
      - vera-r0033-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Transfer duckling to a heated platter. Skim fat from pan drippings and strain into
        a saucepan. Add flour and slowly cook over low heat until the mixture thickens.
      language: en
      source_region_ids:
      - vera-r0033-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Quarter duckling, serve with the sauce, boiled potatoes, vegetables.
      language: en
      source_region_ids:
      - vera-r0033-step-3
      step_number: 3
