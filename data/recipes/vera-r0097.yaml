  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: In a bowl cream the butter, sugar, whole egg, egg yolks, lemon rind and vanilla sugar.
        Beat at medium speed until fluffy. Add the milk, raisins and half of the flour, mix thoroughly.
        In the end fold in stiffly whipped egg whites and the remaining flour mixed with baking powder.
        Pour the batter in a buttered and floured fluted tube pan and bake for one hour at 350F. Test
        for doneness with a tester or toothpick. Turn the cake out onto a cake rack, dust lightly with
        powdered sugar, cool and slice.
      language: en
      source_region_ids:
      - vera-r0097-text-2
      step_number: 1
