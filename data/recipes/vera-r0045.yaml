  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Arrange carp steaks in a single layer in a well oiled baking pan. Season with caraway
        seeds, salt and pepper. Bake at 350F 25·30 minutes, or until fish flakes easily when tested with
        a fork. In a saucepan heat butter until lightly browned. Pour over fish. Garnish with lemon wedges.
        Serve with potatoes, vegetables, salad.
      language: en
      source_region_ids:
      - vera-r0045-step-1
