transcription:
  yield_time_lines:
  - segment_id: yield-1
    text_verbatim: 'Serves 6 – Preparation time: 2 hours'
    language: en
    source_region_ids:
    - vera-r0001-yield
  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 4 lbs. beef tenderloin
      language: en
      source_region_ids:
      - vera-r0001-ingredients
    - segment_id: ingredient-2
      text_verbatim: 3 slices bacon
      language: en
      source_region_ids:
      - vera-r0001-ingredients
    - segment_id: ingredient-3
      text_verbatim: 1/2 cup vegetable oil
      language: en
      source_region_ids:
      - vera-r0001-ingredients
    - segment_id: ingredient-4
      text_verbatim: 2 cups sliced soup greens (carrots, parsnips, celery root)
      language: en
      source_region_ids:
      - vera-r0001-ingredients
    - segment_id: ingredient-5
      text_verbatim: 1 medium onion, sliced
      language: en
      source_region_ids:
      - vera-r0001-ingredients
    - segment_id: ingredient-6
      text_verbatim: few grains allspice, whole black pepper, thyme, bay leaves, nutmeg
      language: en
      source_region_ids:
      - vera-r0001-ingredients
    - segment_id: ingredient-7
      text_verbatim: 2 tablespoons flour
      language: en
      source_region_ids:
      - vera-r0001-ingredients
    - segment_id: ingredient-8
      text_verbatim: 1 cup beef stock
      language: en
      source_region_ids:
      - vera-r0001-ingredients
    - segment_id: ingredient-9
      text_verbatim: juice of one lemon
      language: en
      source_region_ids:
      - vera-r0001-ingredients
    - segment_id: ingredient-10
      text_verbatim: 1·1/2 cups sour cream
      language: en
      source_region_ids:
      - vera-r0001-ingredients
    - segment_id: ingredient-11
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0001-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      step_number: 1
      text_verbatim: Tenderloin must be aged and all the fat trimmed off. Cut small slits along the grain
        of the meat and stuff them with thin strips of bacon. Salt and pepper the meat and set aside.
      language: en
      source_region_ids:
      - vera-r0001-step-1
    - segment_id: step-2
      step_number: 2
      text_verbatim: In a large frying pan combine the oil, half of the sliced soup greens and the onion;
        place the roast on top and brown on all sides.
      language: en
      source_region_ids:
      - vera-r0001-step-2
    - segment_id: step-3
      step_number: 3
      text_verbatim: In the meantime preheat the oven to 350F. Transfer the roast and the vegetables into
        a roasting pan, add the remaining vegetables and spices. Roast 40-45 minutes, basting with beef
        stock and juices from the pan. Remove the roast, keep it warm. Pour the pan drippings into a large
        stewpan, skim the fat, set pan over medium heat and deglaze, using stock or water. Add the flour,
        simmer five minutes. Place the roast in the sauce, add the lemon juice and simmer until the meat
        becomes tender on the outside (20 minutes).
      language: en
      source_region_ids:
      - vera-r0001-step-3a
      - vera-r0001-step-3b
    - segment_id: step-4
      step_number: 4
      text_verbatim: Strain the sauce, discard the spices, mash the vegetables and mix them into the sauce.
        Blend in the sour cream and simmer for a few minutes. The sauce should be medium thick.
      language: en
      source_region_ids:
      - vera-r0001-step-4
    - segment_id: step-5
      step_number: 5
      text_verbatim: Slice the roast, pour some sauce over it and serve the remainder in a sauce dish.
      language: en
      source_region_ids:
      - vera-r0001-step-5
    - segment_id: step-6
      step_number: 6
      text_verbatim: It is important that you make enough sauce, adding beef stock and sour cream. Taste
        it and add salt, pepper, lemon juice – if needed. The taste should be mildly piquant. The typical
        accompaniment is crouton or yeast dumplings, or noodles.
      language: en
      source_region_ids:
      - vera-r0001-step-6a
      - vera-r0001-step-6b
  notes:
  - segment_id: note-1
    text_verbatim: Alternative – Lard the tenderloin, grease a roasting pan with oil, cover the bottom
      of the pan with the vegetables, lay the roast on top, add more vegetables, spices and lemon juice.
      Add the remaining oil, cover and marinate overnight. Next day prepare the roast as indicated above.
    language: en
    source_region_ids:
    - vera-r0001-alternative
  - segment_id: note-2
    text_verbatim: If planning to prepare a larger quantity, for example
      a whole tenderloin, increase all ingredients accordingly. Instead of browning the roast by frying,
      roast it on all sides in a hot oven (475F), then lower the temperature to 350F and proceed as shown
      above.
    language: en
    source_region_ids:
    - vera-r0001-tip
