  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Pound the veal chops. Make a few short cuts on the edges to prevent curling, salt
        them on both sides. Dip each in milk, dredge in flour shaking off excess, then dip in beaten eggs
        and coat with bread crumbs.
      language: en
      source_region_ids:
      - vera-r0010-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Fry in hot oil in a covered pan for 5 minutes, turn them and finish frying uncovered.
        Drain on paper towel. Serve with potato salad, mashed potatoes, green vegetables, salad.
      language: en
      source_region_ids:
      - vera-r0010-step-2
      step_number: 2
