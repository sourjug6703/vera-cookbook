      source_region_ids:
      - vera-r0091-listgroup-1
    - segment_id: ingredient-7
      text_verbatim: 2·1/2 teaspoons baking powder
      language: en
      source_region_ids:
      - vera-r0091-listgroup-1
    - segment_id: ingredient-8
      text_verbatim: 2/3 cup milk
      language: en
