      text_verbatim: 1 lb. cherries (preferably Morello cherries)
      language: en
      source_region_ids:
      - vera-r0091-listgroup-1
    - segment_id: ingredient-10
      text_verbatim: butter or margarine and flour for baking dish
      language: en
