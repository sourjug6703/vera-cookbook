  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 3 lbs. potatoes, peeled, rinsed, quartered
      language: en
      source_region_ids:
      - vera-r0059-ingredients
    - segment_id: ingredient-2
      text_verbatim: 1·1/2 cups flour
      language: en
      source_region_ids:
      - vera-r0059-ingredients
    - segment_id: ingredient-3
      text_verbatim: 5 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0059-ingredients
    - segment_id: ingredient-4
      text_verbatim: 1 medium onion, finely chopped
      language: en
      source_region_ids:
      - vera-r0059-ingredients
    - segment_id: ingredient-5
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0059-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Parboil potatoes in lightly salted water. Drain some of the water, leaving potatoes
        barely covered. Stir in flour and simmer over low heat about 10 minutes or until potatoes flake
        when tested with a fork. Drain excess water, if any, salt the mixture and mash it thoroughly.
        Mixture will be rather thick.
      language: en
      source_region_ids:
      - vera-r0059-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Meanwhile, brown onion in butter.
      language: en
      source_region_ids:
      - vera-r0059-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Dip a tablespoon in hot butter and scoop gnocchi onto a warmed serving dish. Sprinkle
        with browned onion and butter. Serve as a side dish with meats, or as a meal.
      language: en
      source_region_ids:
      - vera-r0059-step-3
      step_number: 3
  notes:
  - segment_id: note-1
    text_verbatim: Alternative – Substitute ground poppy seeds mixed with powdered sugar for browned onion.
      Sprinkle with hot butter.
    language: en
    source_region_ids:
    - vera-r0059-alternative
