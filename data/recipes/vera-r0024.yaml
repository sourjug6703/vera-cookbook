  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Rinse and pat dry chicken pieces, salt them lightly. Dredge each piece in flour,
        shake off excess, dip in beaten eggs with a little salt added and coat with bread crumbs. Fry
        in hot oil until golden, about 5 minutes each side. Drain on paper towel.
      language: en
      source_region_ids:
      - vera-r0024-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Serve on lettuce-lined platter, garnish with lemon wedges and parsley.
      language: en
      source_region_ids:
      - vera-r0024-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Serve with potato salad, green salad, mashed potatoes, vegetables.
      language: en
      source_region_ids:
      - vera-r0024-step-3
      step_number: 3
