  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Pull off 12 large leaves from the cabbage head. Parboil them in salted water, place
        each on a napkin and flatten it with rolling pin or hand. Soak roll in milk, squeeze off excess
        and shred it. In a mixing bowl combine ground meat, shredded roll, 1 chopped onion, minced parsely,
        marjoram, garlic, salt and pepper. Mix thoroughly and spread evenly on the cabbage leaves. Roll
        them tightly, fasten each with a string or wooden pick. In a large skillet sauté onion in butter,
        add the stuffed cabbage rolls, simmer 30·40 minutes, adding occasionally some of the chicken stock.
        Lift rolls onto a serving dish, sprinkle with juices from the pan, serve with rice or potatoes.
      language: en
      source_region_ids:
      - vera-r0053-step-1
      step_number: 1
