    - vera-r0087-text-12
  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1 lb. flour
      language: en
      source_region_ids:
      - vera-r0087-listgroup-1
    - segment_id: ingredient-2
      text_verbatim: 1 cup milk
      language: en
      source_region_ids:
      - vera-r0087-listgroup-1
    - segment_id: ingredient-3
      text_verbatim: 1/3 cup sugar
      language: en
      source_region_ids:
      - vera-r0087-listgroup-1
    - segment_id: ingredient-4
      text_verbatim: 1 oz. fresh yeast
      language: en
      source_region_ids:
      - vera-r0087-listgroup-1
    - segment_id: ingredient-5
      text_verbatim: 6 egg yolks
      language: en
      source_region_ids:
      - vera-r0087-listgroup-1
    - segment_id: ingredient-6
      text_verbatim: 6 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0087-listgroup-1
    - segment_id: ingredient-7
      text_verbatim: 1/2 cup golden raisins
      language: en
      source_region_ids:
      - vera-r0087-listgroup-1
    - segment_id: ingredient-8
      text_verbatim: grated rind of 1 lemon
      language: en
      source_region_ids:
      - vera-r0087-listgroup-1
    - segment_id: ingredient-9
      text_verbatim: dash of salt
      language: en
      source_region_ids:
      - vera-r0087-listgroup-1
    - segment_id: ingredient-10
      text_verbatim: 1 beaten egg for brushing
      language: en
      source_region_ids:
      - vera-r0087-listgroup-1
    - segment_id: ingredient-11
      text_verbatim: 3 tablespoons sugar mixed with vanilla sugar for dusting
      language: en
      source_region_ids:
      - vera-r0087-listgroup-1
  - section_id: ingredients-2
    ingredients:
    - segment_id: ingredient-12
      text_verbatim: 1/3 cup slivered almonds to sprinkle over loaf before baking
      language: en
      source_region_ids:
      - vera-r0087-listgroup-8
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: 'Leavening: In a bowl stir yeast and 2 teaspoons sugar until dissolved. Add 1/2 cup
        flour and 1/3 cup lukewarm milk. Knead into a ball, dust with flour, let rise 20-30 minutes, until
        doubled in bulk.'
      language: en
      source_region_ids:
      - vera-r0087-text-2
      step_number: 1
    - segment_id: step-2
      text_verbatim: In a separate bowl combine remaining flour, sugar, salt, lemon rind. Make a well
        in center. Put egg yolks and risen leavening in the well. Gradually adding remaining lukewarm
        milk, mix thoroughly. Add raisins and melted butter, knead dough until smooth, dry and elastic.
        Dust with flour, let rise 30 minutes.
      language: en
      source_region_ids:
      - vera-r0087-text-3
      step_number: 2
    - segment_id: step-3
      text_verbatim: Punch dough down, let rise again 30 minutes.
      language: en
      source_region_ids:
      - vera-r0087-text-4
      step_number: 3
    - segment_id: step-4
      text_verbatim: Turn dough over onto a lightly floured pastry board, divide in two halves.
      language: en
      source_region_ids:
      - vera-r0087-text-5
      step_number: 4
    - segment_id: step-5
      text_verbatim: Divide one half into 3 identical sections. Form 3 ropes 13" long. Braid them, pinch
        together both ends. Place on oven tray lined with buttered wax paper. Make a shallow indentation
        in center lengthwise,
      language: en
      source_region_ids:
      - vera-r0087-text-6
      step_number: 5
    - segment_id: step-6
      text_verbatim: 'Optional:'
      language: en
      source_region_ids:
      - vera-r0087-text-7
      step_number: 6
    - segment_id: step-7
      text_verbatim: then brush depression lightly with a beaten egg white. Divide remaining dough into
        5 identical sections. Form 5 ropes 13" long. Braid 3 ropes and place on top of the thicker braid.
        Again make indentation in center and brush with beaten egg white. Braid last two ropes, place
        on top of second layer. Press each end firmly together. Let loaf rise 30 minutes. Brush with beaten
        egg.
      language: en
      source_region_ids:
      - vera-r0087-text-9
      step_number: 7
    - segment_id: step-8
      text_verbatim: 'Optional: sprinkle with slivered almonds.'
      language: en
      source_region_ids:
      - vera-r0087-text-10
      step_number: 8
    - segment_id: step-9
      text_verbatim: Preheat oven to 375F. Bake 10 minutes. Reduce oven temperature to 350F, bake 20-25
        minutes, check with wooden pick for doneness. Dust with sugar mixed with vanilla sugar while hot.
        Cool at room temperature at least 1 hour. Slice.
      language: en
      source_region_ids:
      - vera-r0087-text-11
      step_number: 9
