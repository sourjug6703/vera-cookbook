  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: Hindquarters of 1 hare, 4·5 lbs., cleaned, membrane removed
      language: en
      source_region_ids:
      - vera-r0036-ingredients
    - segment_id: ingredient-2
      text_verbatim: 3 slices bacon, cut in short strips (1")
      language: en
      source_region_ids:
      - vera-r0036-ingredients
    - segment_id: ingredient-3
      text_verbatim: 1 medium onion, finely chopped
      language: en
      source_region_ids:
      - vera-r0036-ingredients
    - segment_id: ingredient-4
      text_verbatim: 8 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0036-ingredients
    - segment_id: ingredient-5
      text_verbatim: 1·2 cups beef stock
      language: en
      source_region_ids:
      - vera-r0036-ingredients
    - segment_id: ingredient-6
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0036-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Rinse, pat dry hare. Lard meaty side with bacon strips, sprinkle with salt and pepper.
        Melt butter in a roasting pan, add onion and the hare. Roast at 350F for 45 minutes, larded side
        down. Turn hare larded side up and roast 30·40 minutes or until tender. Baste frequently with
        beef stock and juices from the pan. Cut hare in serving portions. Serve with pan juices, fried
        potatoes, noodles, vegetables.
      language: en
      source_region_ids:
      - vera-r0036-step-1
      step_number: 1
