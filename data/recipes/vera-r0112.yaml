    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 2 cups flour
      language: en
      source_region_ids:
      - vera-r0112-listgroup-1
    - segment_id: ingredient-2
      text_verbatim: 1/3 cup sugar mixed with 1 teaspoon vanilla sugar
      language: en
      source_region_ids:
      - vera-r0112-listgroup-1
    - segment_id: ingredient-3
      text_verbatim: 1 stick butter
      language: en
      source_region_ids:
      - vera-r0112-listgroup-1
    - segment_id: ingredient-4
      text_verbatim: 2 tablespoons milk
      language: en
      source_region_ids:
      - vera-r0112-listgroup-1
    - segment_id: ingredient-5
      text_verbatim: grated rind of 1 lemon
      language: en
      source_region_ids:
      - vera-r0112-listgroup-1
    - segment_id: ingredient-6
      text_verbatim: red raspberry or red currant preserve
      language: en
      source_region_ids:
      - vera-r0112-listgroup-1
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: On a floured pastry board knead all ingredients into a ball using the palms of your
        hands, not the fingers. The dough will be smooth and will not crumble. You can let it rest for
        a few hours, overnight or more. You can use it right away also.
      language: en
      source_region_ids:
      - vera-r0112-text-2
      step_number: 1
    - segment_id: step-2
      text_verbatim: With a roller pin roll the dough out as thin as possible. (1/8"). Cut it into 1-1/4"
        round cakes, using a cookie cutter or a glass. Separate half of the round cakes and cut out a
        small round hole in the center, the size of a thimble. Use a cookie cutter or a thimble. Place
        the round cakes on a clean, dry cookie sheet and bake at 350F for 15 minutes, or until they are
        pink/golden. Remove from oven and cool. Before serving put 1/2 teaspoon of red raspberry or red
        currant seedless preserve in the center of each plain round, top it with one "holed" round. The
        red color is important for the look of the cookies and the sour flavor of raspberry or currant
        compliments them well. Unfilled cookies can be stored for weeks in an airtight container.
      language: en
      source_region_ids:
      - vera-r0112-text-3
      step_number: 2
