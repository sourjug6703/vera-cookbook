transcription:
  yield_time_lines:
  - segment_id: yield-1
    text_verbatim: 'Serves 6 – Preparation time: 2 hours'
    language: en
    source_region_ids:
    - vera-r0005-yield
  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 3·4 lbs. boneless beef stew meat (bottom round, rump, chuck), cut in 1·1/2” cubes
      language: en
      source_region_ids:
      - vera-r0005-ingredients
    - segment_id: ingredient-2
      text_verbatim: 2·3 cups beef stock or water
      language: en
      source_region_ids:
      - vera-r0005-ingredients
    - segment_id: ingredient-3
      text_verbatim: 1 large onion, thinly sliced
      language: en
      source_region_ids:
      - vera-r0005-ingredients
    - segment_id: ingredient-4
      text_verbatim: 3 slices bacon cut in short strips
      language: en
      source_region_ids:
      - vera-r0005-ingredients
    - segment_id: ingredient-5
      text_verbatim: 2 tablespoons vegetable oil
      language: en
      source_region_ids:
      - vera-r0005-ingredients
    - segment_id: ingredient-6
      text_verbatim: 3 cloves garlic, pressed or chopped
      language: en
      source_region_ids:
      - vera-r0005-ingredients
    - segment_id: ingredient-7
      text_verbatim: 2 tablespoons paprika
      language: en
      source_region_ids:
      - vera-r0005-ingredients
    - segment_id: ingredient-8
      text_verbatim: 3 tablespoons flour
      language: en
      source_region_ids:
      - vera-r0005-ingredients
    - segment_id: ingredient-9
      text_verbatim: 1/2 teaspoon each of caraway seeds and marjoram
      language: en
      source_region_ids:
      - vera-r0005-ingredients
    - segment_id: ingredient-10
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0005-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: 'Heat oil in a large stewpan. Add bacon and onion. Cook slowly, stirring and turning
        frequently until bacon is lightly browned and onion is translucent. Add beef. Sprinkle evenly
        over the meat: caraway seeds, marjoram, paprika, garlic. Cover, simmer one hour over low heat
        adding occasionally 2·3 tablespoons beef stock or water, if needed. Liquid in the pan should be
        just enough so that the onion and the meat do not burn or stick to the pan.'
      language: en
      source_region_ids:
      - vera-r0005-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: When meat is half done, uncover pan and let cooking liquid nearly evaporate. Sprinkle
        flour over meat and braise 2·3 minutes. Add enough beef stock or water to cover the meat. Simmer
        30 minutes or until meat is tender. Should the sauce be too thick, add some more beef stock or
        water.
      language: en
      source_region_ids:
      - vera-r0005-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Taste sauce, season with salt and pepper. Lift meat onto a warmed deep serving dish.
        Strain sauce and pour over meat. Serve with boiled potatoes, rice, salad.
      language: en
      source_region_ids:
      - vera-r0005-step-3
      step_number: 3
  notes:
  - segment_id: note-1
    text_verbatim: Alternative 1 – Prepare beef goulash as shown above. Peel and slice 4 pickled cucumbers,
      add to the goulash, heat through, serve.
    language: en
    source_region_ids:
    - vera-r0005-alternative-1
  - segment_id: note-2
    text_verbatim: Alternative 2 – Turn the goulash over into a deep serving dish, sprinkle with shredded
      ham and grated Parmesan cheese. Serve with white rice.
    language: en
    source_region_ids:
    - vera-r0005-alternative-2
