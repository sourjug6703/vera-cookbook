  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Scald rabbit with hot water, pat dry. Pound each piece lightly, sprinkle with salt.
        Dredge each in flour shaking off excess, dip in mixture of beaten eggs and milk, coat with bread
        crumbs. Fry in hot oil until golden, about 5 minutes each side. Drain on paper towel. Serve with
        salad, vegetables, potatoes.
      language: en
      source_region_ids:
      - vera-r0035-step-1
