  yield_time_lines:
  - segment_id: yield-1
    text_verbatim: 'Serves 10 – Preparation time: 2 hours 30 minutes'
    language: en
    source_region_ids:
    - vera-r0083-text-8
  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 4 cups flour
      language: en
      source_region_ids:
      - vera-r0083-listgroup-2
    - segment_id: ingredient-2
      text_verbatim: 1-1/2 oz. fresh yeast
      language: en
      source_region_ids:
      - vera-r0083-listgroup-2
    - segment_id: ingredient-3
      text_verbatim: 1-1/2 cups milk
      language: en
      source_region_ids:
      - vera-r0083-listgroup-2
    - segment_id: ingredient-4
      text_verbatim: 3 egg yolks
      language: en
      source_region_ids:
      - vera-r0083-listgroup-2
    - segment_id: ingredient-5
      text_verbatim: 4 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0083-listgroup-2
    - segment_id: ingredient-6
      text_verbatim: 1/3 cups sugar
      language: en
      source_region_ids:
      - vera-r0083-listgroup-2
    - segment_id: ingredient-7
      text_verbatim: 1 tablespoon rum
      language: en
      source_region_ids:
      - vera-r0083-listgroup-2
    - segment_id: ingredient-8
      text_verbatim: grated rind of 1 lemon
      language: en
      source_region_ids:
      - vera-r0083-listgroup-2
    - segment_id: ingredient-9
      text_verbatim: dash of salt
      language: en
      source_region_ids:
      - vera-r0083-listgroup-2
    - segment_id: ingredient-10
      text_verbatim: 1-1/2 cups oil for frying
      language: en
      source_region_ids:
      - vera-r0083-listgroup-2
  - section_id: ingredients-2
    ingredients:
    - segment_id: ingredient-11
      text_verbatim: 1 cup plum or blueberry jam
      language: en
      source_region_ids:
      - vera-r0083-listgroup-7
    - segment_id: ingredient-12
      text_verbatim: 1/2 cup crumbled farmer's cheese
      language: en
      source_region_ids:
      - vera-r0083-listgroup-7
    - segment_id: ingredient-13
      text_verbatim: 1/2 cup sour cream
      language: en
      source_region_ids:
      - vera-r0083-listgroup-7
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Prepare dough in the same manner as in Czech doughnuts, Roll it out to 1/3" thickness.
        Cut out 3" round cakes. Let rise 30 minutes, in a warm place.
      language: en
      source_region_ids:
      - vera-r0083-text-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Just before frying make an indentation with teaspoon or finger in center of each
        cake. For frying, follow directions in Czech doughnuts recipe.
      language: en
      source_region_ids:
      - vera-r0083-text-3
      step_number: 2
    - segment_id: step-3
      text_verbatim: Cool, sprinkle with sugar.
      language: en
      source_region_ids:
      - vera-r0083-text-4
      step_number: 3
    - segment_id: step-4
      text_verbatim: 'Optional: Spread jam over each depression, sprinkle with crumbled farmer''s cheese,
        dot with sour cream.'
      language: en
      source_region_ids:
      - vera-r0083-text-5
      step_number: 4
    - segment_id: step-5
      text_verbatim: 'Optional:'
      language: en
      source_region_ids:
      - vera-r0083-text-6
      step_number: 5
