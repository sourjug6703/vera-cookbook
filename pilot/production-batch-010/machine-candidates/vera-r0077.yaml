  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1 cup ground or pounded poppy seeds
      language: en
      source_region_ids:
      - vera-r0077-listgroup-2
    - segment_id: ingredient-2
      text_verbatim: 1 cup milk
      language: en
      source_region_ids:
      - vera-r0077-listgroup-2
    - segment_id: ingredient-3
      text_verbatim: 2/3 cup sugar
      language: en
      source_region_ids:
      - vera-r0077-listgroup-2
    - segment_id: ingredient-4
      text_verbatim: 4 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0077-listgroup-2
    - segment_id: ingredient-5
      text_verbatim: 2 tablespoons golden raisins
      language: en
      source_region_ids:
      - vera-r0077-listgroup-2
    - segment_id: ingredient-6
      text_verbatim: 1/4 teaspoon cinnamon
      language: en
      source_region_ids:
      - vera-r0077-listgroup-2
    - segment_id: ingredient-7
      text_verbatim: grated rind of 1 lemon
      language: en
      source_region_ids:
      - vera-r0077-listgroup-2
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: In a saucepan combine poppy seeds and milk. Cook over medium/low heat, stirring often,
        until poppy seeds are mashed, 10-15 minutes. Add all remaining ingredients. Mix thoroughly. Cool.
      language: en
      source_region_ids:
      - vera-r0077-text-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: ⇒ A thick fruit preserve may also be used to fill "Buchty" and "Koláčky".
      language: en
      source_region_ids:
      - vera-r0077-text-4
      step_number: 2
