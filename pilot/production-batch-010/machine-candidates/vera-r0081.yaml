  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Dissolve the yeast by mixing it with a teaspoon of sugar. Add three tablespoons of
        flour and 1/4 cup lukewarm milk; knead the leavening into a small ball. Let it rise 20 minutes,
        it should double in size.
      language: en
      source_region_ids:
      - vera-r0081-text-3
      step_number: 1
    - segment_id: step-2
      text_verbatim: Place the remaining flour in a bowl, add eggs, lemon rind, remaining sugar, salt
        and milk, mix well. Finally add melted or softened butter. Knead the dough until it becames smooth
        and dry and no longer sticks to the bowl. Let it rise 30 minutes.
      language: en
      source_region_ids:
      - vera-r0081-text-4
      step_number: 2
    - segment_id: step-3
      text_verbatim: Turn the dough onto a floured pastry board and roll it out into 1/8" thick rectangle.
        Cover evenly with poppy seed filling and roll it into a long narrow loaf (16-17" long). Place
        loaf on a greased baking sheet and let rise 10 minutes. Brush with lightly beaten egg yolk and
        bake 20-25 minutes in 35OF oven. When cooled, cut in 3/4" slices and serve.
      language: en
      source_region_ids:
      - vera-r0081-text-5
      step_number: 3
