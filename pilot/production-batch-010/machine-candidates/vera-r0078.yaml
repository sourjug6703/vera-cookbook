  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Prepare dough in the same manner as in Bohemian muffins. Roll it out to 1/3" thickness.
        Using a cookie cutter or a glass 1" in diameter cut out round cakes and lay them tightly together
        in a buttered baking pan. Brush sides and top with melted butter. Let rise 30 minutes in a warm
        place. Preheat oven to 350F, bake 20-25 minutes or until golden brown on top.
      language: en
      source_region_ids:
      - vera-r0078-text-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Serve warm with vanilla sauce or wine froth.
      language: en
      source_region_ids:
      - vera-r0078-text-3
      step_number: 2
