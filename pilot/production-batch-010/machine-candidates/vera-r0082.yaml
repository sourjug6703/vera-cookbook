  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 3 cups flour
      language: en
      source_region_ids:
      - vera-r0082-listgroup-2
    - segment_id: ingredient-2
      text_verbatim: 1 oz. fresh yeast
      language: en
      source_region_ids:
      - vera-r0082-listgroup-2
    - segment_id: ingredient-3
      text_verbatim: 6 egg yolks
      language: en
      source_region_ids:
      - vera-r0082-listgroup-2
    - segment_id: ingredient-4
      text_verbatim: 3/4 cup heavy cream
      language: en
      source_region_ids:
      - vera-r0082-listgroup-2
    - segment_id: ingredient-5
      text_verbatim: 3/4 cup milk
      language: en
      source_region_ids:
      - vera-r0082-listgroup-2
    - segment_id: ingredient-6
      text_verbatim: 1/3 cup sugar mixed with vanilla sugar
      language: en
      source_region_ids:
      - vera-r0082-listgroup-2
    - segment_id: ingredient-7
      text_verbatim: 1 tablespoon rum
      language: en
      source_region_ids:
      - vera-r0082-listgroup-2
    - segment_id: ingredient-8
      text_verbatim: 1 tablespoon orange juice
      language: en
      source_region_ids:
      - vera-r0082-listgroup-2
    - segment_id: ingredient-9
      text_verbatim: pinch of salt
      language: en
      source_region_ids:
      - vera-r0082-listgroup-2
    - segment_id: ingredient-10
      text_verbatim: 3/4 cup thick fruit preserve
      language: en
      source_region_ids:
      - vera-r0082-listgroup-2
    - segment_id: ingredient-11
      text_verbatim: 2 cups oil for frying
      language: en
      source_region_ids:
      - vera-r0082-listgroup-2
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: 'Leavening: In a bowl stir yeast with 2 teaspoons sugar until liquefied. Add 1 cup
        flour and 3/4 cup milk. Mix thoroughly. Knead into a smooth neat ball. Dust with flour, cover
        with a napkin and let rise 20 minutes. It should double in bulk.'
      language: en
      source_region_ids:
      - vera-r0082-text-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: In a separate bowl cream egg yolks and vanilla sugar. Gradually adding heavy cream
        beat at low speed until foamy. Blend in remaining flour, salt, rum, orange juice and risen leavening.
        Mix thoroughly. Knead into a smooth, dry, elastic dough. Let rise 30 minutes.
      language: en
      source_region_ids:
      - vera-r0082-text-3
      step_number: 2
    - segment_id: step-3
      text_verbatim: Punch dough down, turn onto a floured pastry board and roll out to 1/3" thickness.
      language: en
      source_region_ids:
      - vera-r0082-text-4
      step_number: 3
    - segment_id: step-4
      text_verbatim: Using a cookie cutter or a small cup, cut out round cakes, about 2-1/2" in diameter.
      language: en
      source_region_ids:
      - vera-r0082-text-5
      step_number: 4
    - segment_id: step-5
      text_verbatim: Drop fruit preserve by teaspoonfuls in center of half of round cakes. Top each with
        a plain round cake. Press borders firmly together. Be sure they are well sealed to prevent the
        filling from leaking out. With a smaller round cutter cut out the final shape of the doughnuts.
        Put doughnuts on lightly floured board, cover with a large napkin, let rest 20 minutes. Fry in
        hot oil, starting with top side down, in a covered frying pan. When bottom is golden brown turn
        them over and finish frying, uncovered. Drain on a sieve or paper towel. When cooled, sprinkle
        with sugar.
      language: en
      source_region_ids:
      - vera-r0082-text-6
      step_number: 5
