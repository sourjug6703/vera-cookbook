    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 8 oz. ricotta
      language: en
      source_region_ids:
      - vera-r0073-listgroup-1
    - segment_id: ingredient-2
      text_verbatim: 1/3 cup sugar
      language: en
      source_region_ids:
      - vera-r0073-listgroup-1
    - segment_id: ingredient-3
      text_verbatim: 2 egg yolks
      language: en
      source_region_ids:
      - vera-r0073-listgroup-1
    - segment_id: ingredient-4
      text_verbatim: grated rind of 1 lemon
      language: en
      source_region_ids:
      - vera-r0073-listgroup-1
    - segment_id: ingredient-5
      text_verbatim: 2-3 tablespoons sponge crumbs
      language: en
      source_region_ids:
      - vera-r0073-listgroup-1
    - segment_id: ingredient-6
      text_verbatim: 1 tablespoon rum
      language: en
      source_region_ids:
      - vera-r0073-listgroup-1
    - segment_id: ingredient-7
      text_verbatim: 3 tablespoons golden raisins
      language: en
      source_region_ids:
      - vera-r0073-listgroup-1
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: In a bowl cream the sugar and the egg yolks. Add ricotta, lemon rind, sponge crumbs,
        rum and raisins - mix well. The sponge crumbs are added to thicken the filling. You can add a
        little more or less, to achieve the right consistency. If the filling is not thick enough, is
        runny, it would run out while baking and jeopardize the good look of the finished product.
      language: en
      source_region_ids:
      - vera-r0073-text-2
      step_number: 1
