        evenly with poppy seed filling and roll it into a long narrow loaf (16-17" long). Place loaf on
        a greased baking sheet and let rise 10 minutes. Brush with lightly beaten egg yolk and bake 20-25
        minutes in 35OF oven. When cooled, cut in 3/4" slices and serve.
