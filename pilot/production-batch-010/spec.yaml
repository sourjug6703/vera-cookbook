  instruction_sections:
  - section_id: instructions-main
    items:
    - text: Prepare dough in the same manner as in Czech doughnuts, Roll it out to 1/3" thickness. Cut
        out 3" round cakes. Let rise 30 minutes, in a warm place.
      region_keys:
      - text-1
    - text: Just before frying make an indentation with teaspoon or finger in center of each cake. For
        frying, follow directions in Czech doughnuts recipe.
      region_keys:
      - text-3
    - text: Cool, sprinkle with sugar.
      region_keys:
      - text-4
    - text: 'Optional: Spread jam over each depression, sprinkle with crumbled farmer''s cheese, dot with
        sour cream.'
      region_keys:
      - text-5
    - text: 'Optional:'
      region_keys:
      - text-6
