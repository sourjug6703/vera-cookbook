  instruction_sections:
  - section_id: instructions-main
    items:
    - text: 'Leavening: In a bowl stir yeast with 2 teaspoons sugar until liquefied. Add 1 cup flour and
        3/4 cup milk. Mix thoroughly. Knead into a smooth neat ball. Dust with flour, cover with a napkin
        and let rise 20 minutes. It should double in bulk.'
      region_keys:
      - text-1
    - text: In a separate bowl cream egg yolks and vanilla sugar. Gradually adding heavy cream beat at
        low speed until foamy. Blend in remaining flour, salt, rum, orange juice and risen leavening.
        Mix thoroughly. Knead into a smooth, dry, elastic dough. Let rise 30 minutes.
      region_keys:
      - text-3
    - text: Punch dough down, turn onto a floured pastry board and roll out to 1/3" thickness.
      region_keys:
      - text-4
    - text: Using a cookie cutter or a small cup, cut out round cakes, about 2-1/2" in diameter.
      region_keys:
      - text-5
    - text: Drop fruit preserve by teaspoonfuls in center of half of round cakes. Top each with a plain
        round cake. Press borders firmly together. Be sure they are well sealed to prevent the filling
        from leaking out. With a smaller round cutter cut out the final shape of the doughnuts. Put doughnuts
        on lightly floured board, cover with a large napkin, let rest 20 minutes. Fry in hot oil, starting
        with top side down, in a covered frying pan. When bottom is golden brown turn them over and finish
        frying, uncovered. Drain on a sieve or paper towel. When cooled, sprinkle with sugar.
      region_keys:
      - text-6
