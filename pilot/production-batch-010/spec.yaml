  instruction_sections:
  - section_id: instructions-main
    items:
    - text: Dissolve the yeast by mixing it with a teaspoon of sugar. Add three tablespoons of flour and
        1/4 cup lukewarm milk; knead the leavening into a small ball. Let it rise 20 minutes, it should
        double in size.
      region_keys:
      - text-3
    - text: Place the remaining flour in a bowl, add eggs, lemon rind, remaining sugar, salt and milk,
        mix well. Finally add melted or softened butter. Knead the dough until it becames smooth and dry
        and no longer sticks to the bowl. Let it rise 30 minutes.
      region_keys:
      - text-4
