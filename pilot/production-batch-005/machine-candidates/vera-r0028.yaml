  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1 turkey, 15 lbs.
      language: en
      source_region_ids:
      - vera-r0028-ingredients
    - segment_id: ingredient-2
      text_verbatim: 8 tablespoons (1 stick) butter
      language: en
      source_region_ids:
      - vera-r0028-ingredients
    - segment_id: ingredient-3
      text_verbatim: 2 cups chicken broth
      language: en
      source_region_ids:
      - vera-r0028-ingredients
    - segment_id: ingredient-4
      text_verbatim: 2 slices bacon
      language: en
      source_region_ids:
      - vera-r0028-ingredients
    - segment_id: ingredient-5
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0028-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Rinse turkey with cold water, and pat dry inside and out with paper towel.
      language: en
      source_region_ids:
      - vera-r0028-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Rub the body and neck cavities with salt and butter. Brush skin with butter.
      language: en
      source_region_ids:
      - vera-r0028-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Preheat oven to 350F.
      language: en
      source_region_ids:
      - vera-r0028-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Pour one cup chicken broth in a roasting pan. Place the bird in the pan, breast down.
        Roast, uncovered 1·1/2 hours, basting occasionally with butter, chicken broth and pan drippings.
      language: en
      source_region_ids:
      - vera-r0028-step-4
      step_number: 4
    - segment_id: step-5
      text_verbatim: Turn turkey breast up, place 2 slices bacon on top and roast 1·1/2 – 2 hours, basting
        with the remaining butter, chicken broth and juices from the pan.
      language: en
      source_region_ids:
      - vera-r0028-step-5
      step_number: 5
    - segment_id: step-6
      text_verbatim: When done, transfer the bird on a heated platter. Strain the pan drippings, discarding
        all fat, and pour some over the turkey. Serve the remaining juice in a saucedish. For easier carving
        allow turkey to stand 10·15 minutes.
      language: en
      source_region_ids:
      - vera-r0028-step-6
      step_number: 6
    - segment_id: step-7
      text_verbatim: Serve with potatoes, salad, vegetables, compote.
      language: en
      source_region_ids:
      - vera-r0028-step-7
      step_number: 7
