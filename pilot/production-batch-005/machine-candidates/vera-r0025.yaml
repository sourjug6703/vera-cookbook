  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1 chicken, 4·5 lbs., cut up into small serving portions or
      language: en
      source_region_ids:
      - vera-r0025-ingredients
    - segment_id: ingredient-2
      text_verbatim: 12 chicken thighs
      language: en
      source_region_ids:
      - vera-r0025-ingredients
    - segment_id: ingredient-3
      text_verbatim: 6 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0025-ingredients
    - segment_id: ingredient-4
      text_verbatim: 1 medium onion, finely chopped
      language: en
      source_region_ids:
      - vera-r0025-ingredients
    - segment_id: ingredient-5
      text_verbatim: 2 tablespoons vinegar
      language: en
      source_region_ids:
      - vera-r0025-ingredients
    - segment_id: ingredient-6
      text_verbatim: 3 tablespoons paprika
      language: en
      source_region_ids:
      - vera-r0025-ingredients
    - segment_id: ingredient-7
      text_verbatim: 1 cup chicken broth
      language: en
      source_region_ids:
      - vera-r0025-ingredients
    - segment_id: ingredient-8
      text_verbatim: 1·1/2 cups sour cream
      language: en
      source_region_ids:
      - vera-r0025-ingredients
    - segment_id: ingredient-9
      text_verbatim: 2 tablespoons flour
      language: en
      source_region_ids:
      - vera-r0025-ingredients
    - segment_id: ingredient-10
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0025-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: In a large heavy skillet sauté onion in butter until translucent. Stir in paprika
        and vinegar. Lay chicken pieces on top, cover, and simmer until almost tender, about 20 minutes.
        Gradually add chicken broth, if needed. Cooking liquid should be just enough that onion and chicken
        do not burn.
      language: en
      source_region_ids:
      - vera-r0025-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Using a slotted spoon remove chicken pieces.
      language: en
      source_region_ids:
      - vera-r0025-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Blend flour and sour cream, stir into liquid in pan, and add remaining chicken broth.
        Simmer for 5 minutes, stirring often.
      language: en
      source_region_ids:
      - vera-r0025-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Return chicken to pan, simmer until tender but not overcooked, 5·10 minutes.
      language: en
      source_region_ids:
      - vera-r0025-step-4
      step_number: 4
    - segment_id: step-5
      text_verbatim: Season to taste with salt and pepper. Sauce should be medium thick and mildly piquant.
      language: en
      source_region_ids:
      - vera-r0025-step-5
      step_number: 5
    - segment_id: step-6
      text_verbatim: Serve with rice, noodles, gnocchi, salad.
      language: en
      source_region_ids:
      - vera-r0025-step-6
      step_number: 6
