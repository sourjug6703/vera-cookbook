transcription:
  yield_time_lines:
  - segment_id: yield-1
    text_verbatim: 'Serves 6 – Preparation time: 2 hours 30 minutes'
    language: en
    source_region_ids:
    - vera-r0020-yield
  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 3·4 lbs. lamb leg, boned, skinned (4·5 lbs. with bone)
      language: en
      source_region_ids:
      - vera-r0020-ingredients
    - segment_id: ingredient-2
      text_verbatim: 1/3 cup vegetable oil
      language: en
      source_region_ids:
      - vera-r0020-ingredients
    - segment_id: ingredient-3
      text_verbatim: 5 slices bacon
      language: en
      source_region_ids:
      - vera-r0020-ingredients
    - segment_id: ingredient-4
      text_verbatim: 1/2 teaspoon each of ginger and ground nutmeg
      language: en
      source_region_ids:
      - vera-r0020-ingredients
    - segment_id: ingredient-5
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0020-ingredients
    - segment_id: ingredient-6
      text_verbatim: 1 parsnip, 3 carrots, 1 celery root,
      language: en
      source_region_ids:
      - vera-r0020-ingredients
    - segment_id: ingredient-7
      text_verbatim: 1 medium onion
      language: en
      source_region_ids:
      - vera-r0020-ingredients
    - segment_id: ingredient-8
      text_verbatim: 3 bay leaves, whole allspice, whole black pepper
      language: en
      source_region_ids:
      - vera-r0020-ingredients
    - segment_id: ingredient-9
      text_verbatim: 3 tablespoons flour
      language: en
      source_region_ids:
      - vera-r0020-ingredients
    - segment_id: ingredient-10
      text_verbatim: juice of 1 lemon
      language: en
      source_region_ids:
      - vera-r0020-ingredients
    - segment_id: ingredient-11
      text_verbatim: 1/4 cup cranberry juice, unsweetened
      language: en
      source_region_ids:
      - vera-r0020-ingredients
    - segment_id: ingredient-12
      text_verbatim: 1 cup dry red wine
      language: en
      source_region_ids:
      - vera-r0020-ingredients
    - segment_id: ingredient-13
      text_verbatim: 1·2 cups chicken stock
      language: en
      source_region_ids:
      - vera-r0020-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Slice thinly parsnip, carrots, celery root and onion.
      language: en
      source_region_ids:
      - vera-r0020-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Cut the bacon into short strips.
      language: en
      source_region_ids:
      - vera-r0020-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Trim off excess fat from the meat, lard it with bacon (= make small slits in roast
        and push a strip of bacon into each slit).
      language: en
      source_region_ids:
      - vera-r0020-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Mix salt, pepper, ginger, nutmeg. Rub over lamb.
      language: en
      source_region_ids:
      - vera-r0020-step-4
      step_number: 4
    - segment_id: step-5
      text_verbatim: Heat the oil in a large stewpot, add the sliced vegetables, cook five minutes.
      language: en
      source_region_ids:
      - vera-r0020-step-5
      step_number: 5
    - segment_id: step-6
      text_verbatim: Place the lamb in the pot, brown it lightly, sprinkle with the remaining spices.
      language: en
      source_region_ids:
      - vera-r0020-step-6
      step_number: 6
    - segment_id: step-7
      text_verbatim: Cover and simmer 1 hour, gradually adding chicken stock.
      language: en
      source_region_ids:
      - vera-r0020-step-7
      step_number: 7
    - segment_id: step-8
      text_verbatim: Remove the lamb.
      language: en
      source_region_ids:
      - vera-r0020-step-8
      step_number: 8
    - segment_id: step-9
      text_verbatim: Spoon fat from the juices, stir in flour and cook until lightly browned.
      language: en
      source_region_ids:
      - vera-r0020-step-9
      step_number: 9
    - segment_id: step-10
      text_verbatim: Blend in lemon juice, cranberry juice, wine, chicken stock.
      language: en
      source_region_ids:
      - vera-r0020-step-10
      step_number: 10
    - segment_id: step-11
      text_verbatim: Return lamb to the mixture, cover and simmer until tender for about 1 hour.
      language: en
      source_region_ids:
      - vera-r0020-step-11
      step_number: 11
    - segment_id: step-12
      text_verbatim: Place lamb on a warm serving platter, garnish with mint, cranberries, snipped parsley,
        chestnuts.
      language: en
      source_region_ids:
      - vera-r0020-step-12
      step_number: 12
    - segment_id: step-13
      text_verbatim: Strain the sauce, heat thoroughly, serve in a saucedish.
      language: en
      source_region_ids:
      - vera-r0020-step-13
      step_number: 13
    - segment_id: step-14
      text_verbatim: Serve with rice, noodles, vegetables, potatoes.
      language: en
      source_region_ids:
      - vera-r0020-step-14
      step_number: 14
