  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1 roasting chicken, 4·5 lbs.
      language: en
      source_region_ids:
      - vera-r0023-ingredients
    - segment_id: ingredient-2
      text_verbatim: 4 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0023-ingredients
    - segment_id: ingredient-3
      text_verbatim: 2 slices bacon
      language: en
      source_region_ids:
      - vera-r0023-ingredients
    - segment_id: ingredient-4
      text_verbatim: 1·1/2 cups chicken stock
      language: en
      source_region_ids:
      - vera-r0023-ingredients
    - segment_id: ingredient-5
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0023-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Rinse and pat dry the chicken; season with salt and pepper. Place it on rack in a
        shallow roasting pan, breast down. Melt the butter and sprinkle some over the chicken. Pour half
        of the chicken stock into a roasting pan. Cook 30 minutes in 350F oven.
      language: en
      source_region_ids:
      - vera-r0023-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Turn chicken breast up, lay bacon slices on top and continue baking 30·40 minutes
        until golden brown on top. Baste occasionally with the remaining butter and chicken stock, juices
        from the pan, or water.
      language: en
      source_region_ids:
      - vera-r0023-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Let stand 5 minutes before cutting into serving portions.
      language: en
      source_region_ids:
      - vera-r0023-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Serve with mashed potatoes, vegetables, salad, compote, mushrooms.
      language: en
      source_region_ids:
      - vera-r0023-step-4
      step_number: 4
