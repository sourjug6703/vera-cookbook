    - vera-r0019-yield
  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 3 lbs. boned pork shoulder, cut in 1·1/2" cubes
      language: en
      source_region_ids:
      - vera-r0019-ingredients
    - segment_id: ingredient-2
      text_verbatim: 4 tablespoons vegetable oil
      language: en
      source_region_ids:
      - vera-r0019-ingredients
    - segment_id: ingredient-3
      text_verbatim: 1 large onion, finely chopped
      language: en
      source_region_ids:
      - vera-r0019-ingredients
    - segment_id: ingredient-4
      text_verbatim: 2 tablespoons paprika
      language: en
      source_region_ids:
      - vera-r0019-ingredients
    - segment_id: ingredient-5
      text_verbatim: 1 teaspoon caraway seeds
      language: en
      source_region_ids:
      - vera-r0019-ingredients
    - segment_id: ingredient-6
      text_verbatim: 2 tablespoons vinegar
      language: en
      source_region_ids:
      - vera-r0019-ingredients
    - segment_id: ingredient-7
      text_verbatim: 1 lb. sauerkraut
      language: en
      source_region_ids:
      - vera-r0019-ingredients
    - segment_id: ingredient-8
      text_verbatim: 1 cup heavy cream
      language: en
      source_region_ids:
      - vera-r0019-ingredients
    - segment_id: ingredient-9
      text_verbatim: 1 large raw potato, peeled, grated or finely sliced,
      language: en
      source_region_ids:
      - vera-r0019-ingredients
    - segment_id: ingredient-10
      text_verbatim: salt and pepper,
      language: en
      source_region_ids:
      - vera-r0019-ingredients
    - segment_id: ingredient-11
      text_verbatim: water
      language: en
      source_region_ids:
      - vera-r0019-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Sauté onion in oil until translucent. Sprinkle paprika evenly over onion, add pork,
        vinegar, caraway seeds, salt and pepper, 1/4 cup water. Cover and simmer until meat is almost
        tender, about 1 hr. 15 minutes. Occasionally add 1·2 tablespoons water, just enough to keep moisture
        in the stew. Stir and turn pork after each addition.
      language: en
      source_region_ids:
      - vera-r0019-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Stir sauerkraut into the goulash, blend in cream and potato. Simmer 10·15 minutes,
        or until meat is tender. Add salt, pepper and more paprika if desired.
      language: en
      source_region_ids:
      - vera-r0019-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Serve with crouton dumplings, boiled potatoes.
      language: en
      source_region_ids:
      - vera-r0019-step-3
      step_number: 3
