        items:
          - {text: "1 turkey, 15 lbs.", region_keys: [ingredients]}
          - {text: "8 tablespoons (1 stick) butter", region_keys: [ingredients]}
          - {text: "2 cups chicken broth", region_keys: [ingredients]}
          - {text: "2 slices bacon", region_keys: [ingredients]}
          - {text: "salt", region_keys: [ingredients]}
    instruction_sections:
      - section_id: instructions-main
        items:
          - {text: "Rinse turkey with cold water, and pat dry inside and out with paper towel.", region_keys: [step-1]}
          - {text: "Rub the body and neck cavities with salt and butter. Brush skin with butter.", region_keys: [step-2]}
          - {text: "Preheat oven to 350F.", region_keys: [step-3]}
          - {text: "Pour one cup chicken broth in a roasting pan. Place the bird in the pan, breast down. Roast, uncovered 1·1/2 hours, basting occasionally with butter, chicken broth and pan drippings.", region_keys: [step-4]}
          - {text: "Turn turkey breast up, place 2 slices bacon on top and roast 1·1/2 – 2 hours, basting with the remaining butter, chicken broth and juices from the pan.", region_keys: [step-5]}
          - {text: "When done, transfer the bird on a heated platter. Strain the pan drippings, discarding all fat, and pour some over the turkey. Serve the remaining juice in a saucedish. For easier carving allow turkey to stand 10·15 minutes.", region_keys: [step-6]}
