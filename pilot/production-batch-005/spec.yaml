          - {text: "1 cup dry red wine", region_keys: [ingredients]}
          - {text: "1·2 cups chicken stock", region_keys: [ingredients]}
    instruction_sections:
      - section_id: instructions-main
        items:
          - {text: "Slice thinly parsnip, carrots, celery root and onion.", region_keys: [step-1]}
          - {text: "Cut the bacon into short strips.", region_keys: [step-2]}
          - {text: "Trim off excess fat from the meat, lard it with bacon (= make small slits in roast and push a strip of bacon into each slit).", region_keys: [step-3]}
