      - {key: yield-au-gratin, role: yield-time, pdf_page: 20, block_ids: [/page/19/Text/8]}
    ingredient_sections:
      - section_id: ingredients-main
        items:
          - {text: "2 lbs. chicken breast, boned, skin removed", region_keys: [ingredients-main]}
          - {text: "soup vegetables (carrot, parsley, onion, celery)", region_keys: [ingredients-main]}
          - {text: "salt and pepper", region_keys: [ingredients-main]}
          - {text: "1 cup sliced fresh mushrooms", region_keys: [ingredients-main]}
          - {text: "2 tablespoons butter", region_keys: [ingredients-main]}
          - {text: "1 small cauliflower", region_keys: [ingredients-main]}
          - {text: "juice of 1·2 lemons", region_keys: [ingredients-main]}
          - {text: "2 egg yolks", region_keys: [ingredients-main]}
          - {text: "2 tablespoons butter and 3 tablespoons flour for the roux.", region_keys: [ingredients-main]}
      - section_id: ingredients-au-gratin
        items:
          - {text: "4 tablespoons butter", region_keys: [ingredients-au-gratin]}
          - {text: "chicken ragoût", region_keys: [ingredients-au-gratin]}
          - {text: "1/2 cup grated Parmesan", region_keys: [ingredients-au-gratin]}
          - {text: "1/2 cup bread crumbs", region_keys: [ingredients-au-gratin]}
    instruction_sections:
      - section_id: instructions-main
        items:
          - {text: "Cook chicken and soup vegetables in lightly salted boiling water. When cool enough to handle, dice the chicken, discard soup vegetables, reserve the broth. While the chicken cooks, heat 2 tablespoons butter in a skillet and sauté the mushrooms over medium heat (about 4 minutes) – must not be too soft. Remove from heat and reserve. Cook cauliflower in lightly salted boiling water – do not overcook, must be tender, not mushy. Drain and separate in rosettes. Reserve. In a large skillet melt the remaining 2 tablespoons butter, add 3 tablespoons flour and stir over low/medium heat until golden brown. Add 1·1/2 cups of the reserved chicken broth and simmer, uncovered, until the mixture thickens, 5·10 minutes. Add juice of 1 lemon, diced chicken, simmer 2 minutes. Blend in egg yolks, mushrooms and cauliflower rosettes. Season to taste with salt, pepper, more lemon juice. If the ragoût is too thick, add a little more chicken broth. Serve as is with boiled potatoes, lettuce.", region_keys: [step-main]}
      - section_id: instructions-au-gratin
