          - {text: "1/3 cup vegetable oil", region_keys: [ingredients]}
          - {text: "5 slices bacon", region_keys: [ingredients]}
          - {text: "1/2 teaspoon each of ginger and ground nutmeg", region_keys: [ingredients]}
          - {text: "salt and pepper", region_keys: [ingredients]}
          - {text: "1 parsnip, 3 carrots, 1 celery root,", region_keys: [ingredients]}
