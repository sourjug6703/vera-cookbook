          - {text: "Cover and simmer 1 hour, gradually adding chicken stock.", region_keys: [step-7]}
          - {text: "Remove the lamb.", region_keys: [step-8]}
          - {text: "Spoon fat from the juices, stir in flour and cook until lightly browned.", region_keys: [step-9]}
          - {text: "Blend in lemon juice, cranberry juice, wine, chicken stock.", region_keys: [step-10]}
          - {text: "Return lamb to the mixture, cover and simmer until tender for about 1 hour.", region_keys: [step-11]}
          - {text: "Place lamb on a warm serving platter, garnish with mint, cranberries, snipped parsley, chestnuts.", region_keys: [step-12]}
          - {text: "Strain the sauce, heat thoroughly, serve in a saucedish.", region_keys: [step-13]}
          - {text: "Serve with rice, noodles, vegetables, potatoes.", region_keys: [step-14]}
