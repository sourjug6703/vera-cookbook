          - {text: "Simmer, covered, for 1·1/2 hours, or until rabbit is tender, adding chicken stock when needed.", region_keys: [step-3]}
          - {text: "Using a slotted spoon, lift rabbit pieces from liquid and place in a casserole.", region_keys: [step-4]}
