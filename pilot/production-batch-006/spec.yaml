      - section_id: ingredients-chestnuts
        label: {segment_id: label-chestnuts, text: "Chestnuts stuffing:", region_key: chestnuts-label}
        items:
          - {text: "1 lb. chestnuts", region_keys: [chestnuts-ingredients]}
          - {text: "10 tablespoons butter", region_keys: [chestnuts-ingredients]}
