      - {key: yield, role: yield-time, pdf_page: 28, block_ids: [/page/27/Text/13]}
    ingredient_sections:
      - section_id: ingredients-main
        items:
          - {text: "Hindquarters of 1 hare, 4·5 lbs., cleaned, membrane removed", region_keys: [ingredients]}
          - {text: "3 slices bacon cut in short strips", region_keys: [ingredients]}
          - {text: "1 medium onion, finely chopped", region_keys: [ingredients]}
          - {text: "carrot, celery, parsnip – sliced", region_keys: [ingredients]}
          - {text: "5 grains each of black peppercorn, whole allspice, juniper berries", region_keys: [ingredients]}
          - {text: "thyme, bay leaf, ground nutmeg", region_keys: [ingredients]}
          - {text: "6 tablespoons butter", region_keys: [ingredients]}
          - {text: "1·1/2 cups beef stock", region_keys: [ingredients]}
          - {text: "1·1/2 cups heavy cream", region_keys: [ingredients]}
          - {text: "juice of 1·2 lemons", region_keys: [ingredients]}
          - {text: "3 tablespoons flour", region_keys: [ingredients]}
          - {text: "salt and pepper", region_keys: [ingredients]}
    instruction_sections:
      - section_id: instructions-main
        items:
          - {text: "Rinse the hare, pat dry. Rub with crushed juniper berries, sprinkle with salt, lard with bacon strips.", region_keys: [step-1]}
          - {text: "Melt butter in a heavy skillet, add onion and vegetables, and sauté over medium heat.", region_keys: [step-2]}
          - {text: "When onion is translucent, add hare and brown evenly on all sides.", region_keys: [step-3]}
          - {text: "Transfer all into a roaster. Add spices and some of the beef stock.", region_keys: [step-4]}
          - {text: "Roast 1 hour at 350F larded side down, then turn hare larded side up and continue roasting until tender, about 1 hour. Baste frequently with pan juices and beef stock.", region_keys: [step-5]}
          - {text: "Remove hare to carving board.", region_keys: [step-6]}
          - {text: "Make sauce by combining pan juices with flour. Simmer 5 minutes, stirring constantly. Add juice of 1 lemon and cream. Simmer a little more. Season to taste with salt, pepper and more lemon juice, if needed. Strain.", region_keys: [step-7]}
          - {text: "To serve, slice hare and place slices on a warmed platter. Pour sauce over top.", region_keys: [step-8]}
          - {text: "Serve remaining sauce in a gravy boat.", region_keys: [step-9]}
          - {text: "Serve with rice, noodles, vegetables.", region_keys: [step-10]}
    yield_time_lines:
      - {text: "Serves 6 – Preparation time: 2 hours 30 minutes", region_keys: [yield]}
