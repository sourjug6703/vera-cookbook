          - {text: "5 hard baked rolls", region_keys: [chestnuts-ingredients]}
          - {text: "2 cups milk", region_keys: [chestnuts-ingredients]}
          - {text: "1/2 cup bread crumbs", region_keys: [chestnuts-ingredients]}
          - {text: "dash of ground nutmeg", region_keys: [chestnuts-ingredients]}
          - {text: "1/2 teaspoon sugar", region_keys: [chestnuts-ingredients]}
          - {text: "salt", region_keys: [chestnuts-ingredients]}
      - section_id: ingredients-almond
        label: {segment_id: label-almond, text: "Almond stuffing:", region_key: almond-label}
        items:
          - {text: "5 oz. chopped or sliced almonds", region_keys: [almond-ingredients]}
          - {text: "8 tablespoons butter", region_keys: [almond-ingredients]}
          - {text: "4 egg yolks, 3 egg whites", region_keys: [almond-ingredients]}
          - {text: "5 hard baked rolls", region_keys: [almond-ingredients]}
          - {text: "2 cups milk", region_keys: [almond-ingredients]}
          - {text: "1/4 cup sugar", region_keys: [almond-ingredients]}
          - {text: "1/4 cup bread crumbs", region_keys: [almond-ingredients]}
          - {text: "salt", region_keys: [almond-ingredients]}
    instruction_sections:
      - section_id: instructions-main
        items:
          - {text: "Prepare the bird as indicated in “roast turkey”. Turn the neck into the body cavity to block the passage between the neck and the body. The stuffing will stay in the neck cavity while roasting. Lightly fill neck cavity with stuffing. Do not pack · stuffing will expand while cooking. Fasten neck skin with stitches or skewer. Roast turkey as shown above.", region_keys: [step-main]}
      - section_id: instructions-giblets
        label: {segment_id: instruction-label-giblets, text: "Giblets stuffing:", region_key: giblets-label}
        items:
          - {text: "Soak the rolls in milk or water, squeeze off excess liquid, shred them. Rinse and finely chop the giblets.", region_keys: [giblets-step-1]}
          - {text: "In a bowl cream butter, eggs, add the chopped onion, thyme, marjoram, shredded rolls, giblets, bread crumbs. Salt the mixture and mix thoroughly.", region_keys: [giblets-step-2]}
      - section_id: instructions-chestnuts
        label: {segment_id: instruction-label-chestnuts, text: "Chestnuts stuffing:", region_key: chestnuts-label}
        items:
          - {text: "Simmer chestnuts in water for 10·15 minutes. When the shells crack, peel and chop them coarsely.", region_keys: [chestnuts-step-1]}
          - {text: "Break the rolls, soak them in milk, squeeze off excess, shred them. In a bowl cream butter, one whole egg and three egg yolks. Add the shredded rolls, nutmeg, sugar and coarsely chopped chestnuts. Salt the mixture; Fold in half of the bread crumbs and three stiffly whipped egg whites.", region_keys: [chestnuts-step-2]}
          - {text: "Turn the stuffing into a fluted tube pan or a flan ring, buttered and dusted with bread crumbs. Bake in a bain-marie at 350F for 1·1/2 hours. When done, let it stand 5 minutes, then invert on a serving dish. Slice it like a cake.", region_keys: [chestnuts-step-3a, chestnuts-step-3b]}
          - {text: "Serve with apricot or pear compote, cranberries, etc.", region_keys: [chestnuts-step-4]}
      - section_id: instructions-almond
        label: {segment_id: instruction-label-almond, text: "Almond stuffing:", region_key: almond-label}
        items:
          - {text: "Break the rolls and soak them in milk. Squeeze off excess, shred and strain them.", region_keys: [almond-step-1]}
          - {text: "In a bowl cream butter, egg yolks and sugar. Combine all ingredients. Fold in three stiffly beaten egg whites.", region_keys: [almond-step-2]}
          - {text: "Bake and serve in the same manner as chestnut stuffing.", region_keys: [almond-step-3]}
      - section_id: instructions-raisins
        label: {segment_id: instruction-label-raisins, text: "Raisins stuffing:", region_key: raisins-label}
        items:
          - {text: "Same as almond stuffing, replacing half of the almonds with 3/4 cup golden raisins.", region_keys: [raisins-step]}
    yield_time_lines:
