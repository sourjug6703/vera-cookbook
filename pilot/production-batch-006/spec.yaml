          - {text: "6 tablespoons butter", region_keys: [ingredients-main]}
          - {text: "salt", region_keys: [ingredients-main]}
          - {text: "3/4 cup chicken stock", region_keys: [ingredients-main]}
      - section_id: ingredients-stuffing
        label: {segment_id: label-stuffing, text: "Stuffing:", region_key: stuffing-label}
        items:
          - {text: "4 and 2 tablespoons butter (2. tbsp for braising the liver)", region_keys: [ingredients-stuffing]}
          - {text: "2 egg yolks", region_keys: [ingredients-stuffing]}
          - {text: "1 egg white", region_keys: [ingredients-stuffing]}
          - {text: "2 hard baked rolls", region_keys: [ingredients-stuffing]}
          - {text: "1/2 cup milk", region_keys: [ingredients-stuffing]}
          - {text: "liver from three pigeons, chopped", region_keys: [ingredients-stuffing]}
