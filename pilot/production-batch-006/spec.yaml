        items:
          - {text: "1 cup sliced carrots", region_keys: [marinade-ingredients]}
          - {text: "1 cup sliced onions", region_keys: [marinade-ingredients]}
          - {text: "1 cup sliced shallots", region_keys: [marinade-ingredients]}
          - {text: "3 cloves garlic, crushed", region_keys: [marinade-ingredients]}
          - {text: "10 black peppercorns", region_keys: [marinade-ingredients]}
          - {text: "3 bay leaves", region_keys: [marinade-ingredients]}
          - {text: "thyme", region_keys: [marinade-ingredients]}
          - {text: "1/4 cup cognac", region_keys: [marinade-ingredients]}
          - {text: "3 cups red wine", region_keys: [marinade-ingredients]}
          - {text: "1·1/2 cups vegetable oil", region_keys: [marinade-ingredients]}
      - section_id: ingredients-hare-and-sauce
        label: {segment_id: label-hare-and-sauce, text: "Hare and sauce:", region_key: hare-sauce-label}
        items:
          - {text: "Front part of 1 hare, 4·5 lbs.", region_keys: [hare-sauce-ingredients]}
          - {text: "4 tablespoons butter", region_keys: [hare-sauce-ingredients]}
          - {text: "3 oz. bacon, diced", region_keys: [hare-sauce-ingredients]}
          - {text: "1 medium onion, chopped", region_keys: [hare-sauce-ingredients]}
          - {text: "3 tablespoons vinegar", region_keys: [hare-sauce-ingredients]}
          - {text: "1·1/2 cups beef stock", region_keys: [hare-sauce-ingredients]}
          - {text: "1 cup red wine", region_keys: [hare-sauce-ingredients]}
          - {text: "grated rind of 1 lemon", region_keys: [hare-sauce-ingredients]}
          - {text: "5 grains each of black peppercorns and whole allspice", region_keys: [hare-sauce-ingredients]}
          - {text: "2 bay leaves, thyme", region_keys: [hare-sauce-ingredients]}
          - {text: "4 tablespoons flour", region_keys: [hare-sauce-ingredients]}
          - {text: "2 tablespoons brown sugar", region_keys: [hare-sauce-ingredients]}
          - {text: "1/4 cup cranberry sauce", region_keys: [hare-sauce-ingredients]}
          - {text: "salt and pepper", region_keys: [hare-sauce-ingredients]}
    instruction_sections:
      - section_id: instructions-main
        label: {segment_id: label-to-marinate, text: "To marinate:", region_key: instruction-label}
        items:
          - {text: "Place hare in a large crock. Add all dry ingredients, top with cognac, add wine.", region_keys: [step-1]}
          - {text: "Add oil to seal air out. The hare must be submerged in the marinade. Soak hare overnight, or even better 2·3 days.", region_keys: [step-2]}
          - {text: "Remove and wipe dry with a cloth.", region_keys: [step-3]}
          - {text: "Heat butter in a 4 quart top·of·range casserole. Add bacon and onion and cook until soft. Add all spices and lemon rind. Sprinkle hare with salt and vinegar, put into casserole, and brown lightly on all sides.", region_keys: [step-4]}
          - {text: "Reduce heat. Add some of the beef stock.", region_keys: [step-5]}
          - {text: "Cover tightly and simmer 1·1·1/2 hours, or until meat is tender when pierced with a fork. Add beef stock occasionally.", region_keys: [step-6]}
          - {text: "Transfer hare to a heated platter.", region_keys: [step-7]}
          - {text: "Skim off fat from the cooking liquid, stir in the flour and continue cooking to a rich brown. Add the remaining beef stock and the wine.", region_keys: [step-8]}
          - {text: "Cook until sauce thickens. Strain, blend in sugar and cranberry sauce. Season to taste with salt and pepper. Bring to boil, stirring constantly.", region_keys: [step-9]}
          - {text: "Slice hare, pour hot sauce over top.", region_keys: [step-10]}
          - {text: "Serve with noodles, gnocchi, dumplings.", region_keys: [step-11]}
    yield_time_lines:
      - {text: "Serves 6 – Preparation time: 2 hours,plus marinating", region_keys: [yield]}
    notes: []
    cross_references: []
    status: source_checked
    open_issues: []
