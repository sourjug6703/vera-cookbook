      - {key: step-6, role: instruction, pdf_page: 26, block_ids: [/page/25/Text/11]}
      - {key: yield, role: yield-time, pdf_page: 26, block_ids: [/page/25/Text/12]}
    ingredient_sections:
      - section_id: ingredients-main
        items:
          - {text: "1 rabbit, 4·5 lbs., skinned, cleaned, cut in pieces", region_keys: [ingredients]}
          - {text: "3 slices bacon, cut in strips", region_keys: [ingredients]}
          - {text: "1/3 cup vegetable oil", region_keys: [ingredients]}
          - {text: "1 small onion, finely chopped", region_keys: [ingredients]}
          - {text: "3 tablespoons paprika", region_keys: [ingredients]}
          - {text: "6 grains each of whole allspice and black peppercorns", region_keys: [ingredients]}
