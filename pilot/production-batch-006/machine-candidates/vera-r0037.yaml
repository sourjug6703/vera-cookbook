transcription:
  yield_time_lines:
  - segment_id: yield-1
    text_verbatim: 'Serves 6 – Preparation time: 2 hours 30 minutes'
    language: en
    source_region_ids:
    - vera-r0037-yield
  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: Hindquarters of 1 hare, 4·5 lbs., cleaned, membrane removed
      language: en
      source_region_ids:
      - vera-r0037-ingredients
    - segment_id: ingredient-2
      text_verbatim: 3 slices bacon cut in short strips
      language: en
      source_region_ids:
      - vera-r0037-ingredients
    - segment_id: ingredient-3
      text_verbatim: 1 medium onion, finely chopped
      language: en
      source_region_ids:
      - vera-r0037-ingredients
    - segment_id: ingredient-4
      text_verbatim: carrot, celery, parsnip – sliced
      language: en
      source_region_ids:
      - vera-r0037-ingredients
    - segment_id: ingredient-5
      text_verbatim: 5 grains each of black peppercorn, whole allspice, juniper berries
      language: en
      source_region_ids:
      - vera-r0037-ingredients
    - segment_id: ingredient-6
      text_verbatim: thyme, bay leaf, ground nutmeg
      language: en
      source_region_ids:
      - vera-r0037-ingredients
    - segment_id: ingredient-7
      text_verbatim: 6 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0037-ingredients
    - segment_id: ingredient-8
      text_verbatim: 1·1/2 cups beef stock
      language: en
      source_region_ids:
      - vera-r0037-ingredients
    - segment_id: ingredient-9
      text_verbatim: 1·1/2 cups heavy cream
      language: en
      source_region_ids:
      - vera-r0037-ingredients
    - segment_id: ingredient-10
      text_verbatim: juice of 1·2 lemons
      language: en
      source_region_ids:
      - vera-r0037-ingredients
    - segment_id: ingredient-11
      text_verbatim: 3 tablespoons flour
      language: en
      source_region_ids:
      - vera-r0037-ingredients
    - segment_id: ingredient-12
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0037-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Rinse the hare, pat dry. Rub with crushed juniper berries, sprinkle with salt, lard
        with bacon strips.
      language: en
      source_region_ids:
      - vera-r0037-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Melt butter in a heavy skillet, add onion and vegetables, and sauté over medium heat.
      language: en
      source_region_ids:
      - vera-r0037-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: When onion is translucent, add hare and brown evenly on all sides.
      language: en
      source_region_ids:
      - vera-r0037-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Transfer all into a roaster. Add spices and some of the beef stock.
      language: en
      source_region_ids:
      - vera-r0037-step-4
      step_number: 4
    - segment_id: step-5
      text_verbatim: Roast 1 hour at 350F larded side down, then turn hare larded side up and continue
        roasting until tender, about 1 hour. Baste frequently with pan juices and beef stock.
      language: en
      source_region_ids:
      - vera-r0037-step-5
      step_number: 5
    - segment_id: step-6
      text_verbatim: Remove hare to carving board.
      language: en
      source_region_ids:
      - vera-r0037-step-6
      step_number: 6
    - segment_id: step-7
      text_verbatim: Make sauce by combining pan juices with flour. Simmer 5 minutes, stirring constantly.
        Add juice of 1 lemon and cream. Simmer a little more. Season to taste with salt, pepper and more
        lemon juice, if needed. Strain.
      language: en
      source_region_ids:
      - vera-r0037-step-7
      step_number: 7
    - segment_id: step-8
      text_verbatim: To serve, slice hare and place slices on a warmed platter. Pour sauce over top.
      language: en
      source_region_ids:
      - vera-r0037-step-8
      step_number: 8
    - segment_id: step-9
      text_verbatim: Serve remaining sauce in a gravy boat.
      language: en
      source_region_ids:
      - vera-r0037-step-9
      step_number: 9
    - segment_id: step-10
      text_verbatim: Serve with rice, noodles, vegetables.
      language: en
      source_region_ids:
      - vera-r0037-step-10
      step_number: 10
