  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1 rabbit, 4·5 lbs., skinned, cleaned, cut in pieces
      language: en
      source_region_ids:
      - vera-r0034-ingredients
    - segment_id: ingredient-2
      text_verbatim: 3 slices bacon, cut in strips
      language: en
      source_region_ids:
      - vera-r0034-ingredients
    - segment_id: ingredient-3
      text_verbatim: 1/3 cup vegetable oil
      language: en
      source_region_ids:
      - vera-r0034-ingredients
    - segment_id: ingredient-4
      text_verbatim: 1 small onion, finely chopped
      language: en
      source_region_ids:
      - vera-r0034-ingredients
    - segment_id: ingredient-5
      text_verbatim: 3 tablespoons paprika
      language: en
      source_region_ids:
      - vera-r0034-ingredients
    - segment_id: ingredient-6
      text_verbatim: 6 grains each of whole allspice and black peppercorns
      language: en
      source_region_ids:
      - vera-r0034-ingredients
    - segment_id: ingredient-7
      text_verbatim: thyme, 2 bay leaves
      language: en
      source_region_ids:
      - vera-r0034-ingredients
    - segment_id: ingredient-8
      text_verbatim: 3 tablespoons flour
      language: en
      source_region_ids:
      - vera-r0034-ingredients
    - segment_id: ingredient-9
      text_verbatim: 2 cups chicken stock
      language: en
      source_region_ids:
      - vera-r0034-ingredients
    - segment_id: ingredient-10
      text_verbatim: 1·1/2 cups sour cream
      language: en
      source_region_ids:
      - vera-r0034-ingredients
    - segment_id: ingredient-11
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0034-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Rinse, pat dry rabbit pieces. Sprinkle with salt and lard each with bacon strips.
      language: en
      source_region_ids:
      - vera-r0034-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Heat oil in a large pan; add onion and cook until translucent. Add paprika, whole
        allspice, black peppercorns, thyme, bay leaves and rabbit pieces.
      language: en
      source_region_ids:
      - vera-r0034-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Simmer, covered, for 1·1/2 hours, or until rabbit is tender, adding chicken stock
        when needed.
      language: en
      source_region_ids:
      - vera-r0034-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Using a slotted spoon, lift rabbit pieces from liquid and place in a casserole.
      language: en
      source_region_ids:
      - vera-r0034-step-4
      step_number: 4
    - segment_id: step-5
      text_verbatim: Stir flour into the liquid and simmer uncovered for 5 minutes. Add remaining chicken
        stock and sour cream and cook, stirring as necessary, until sauce is reduced to desired consistency,
        about 5 minutes. Strain sauce over rabbit. Simmer until heated through.
      language: en
      source_region_ids:
      - vera-r0034-step-5
      step_number: 5
    - segment_id: step-6
      text_verbatim: Serve with gnocchi, dumplings, noodles.
      language: en
      source_region_ids:
      - vera-r0034-step-6
      step_number: 6
