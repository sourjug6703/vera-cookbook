  - section_id: ingredients-hare-and-sauce
    ingredients:
    - segment_id: ingredient-11
      text_verbatim: Front part of 1 hare, 4·5 lbs.
      language: en
      source_region_ids:
      - vera-r0038-hare-sauce-ingredients
    - segment_id: ingredient-12
      text_verbatim: 4 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0038-hare-sauce-ingredients
    - segment_id: ingredient-13
      text_verbatim: 3 oz. bacon, diced
      language: en
      source_region_ids:
      - vera-r0038-hare-sauce-ingredients
    - segment_id: ingredient-14
      text_verbatim: 1 medium onion, chopped
      language: en
      source_region_ids:
      - vera-r0038-hare-sauce-ingredients
    - segment_id: ingredient-15
      text_verbatim: 3 tablespoons vinegar
      language: en
      source_region_ids:
      - vera-r0038-hare-sauce-ingredients
    - segment_id: ingredient-16
      text_verbatim: 1·1/2 cups beef stock
      language: en
      source_region_ids:
      - vera-r0038-hare-sauce-ingredients
    - segment_id: ingredient-17
      text_verbatim: 1 cup red wine
      language: en
      source_region_ids:
      - vera-r0038-hare-sauce-ingredients
    - segment_id: ingredient-18
      text_verbatim: grated rind of 1 lemon
      language: en
      source_region_ids:
      - vera-r0038-hare-sauce-ingredients
    - segment_id: ingredient-19
      text_verbatim: 5 grains each of black peppercorns and whole allspice
      language: en
      source_region_ids:
      - vera-r0038-hare-sauce-ingredients
    - segment_id: ingredient-20
      text_verbatim: 2 bay leaves, thyme
      language: en
      source_region_ids:
      - vera-r0038-hare-sauce-ingredients
    - segment_id: ingredient-21
      text_verbatim: 4 tablespoons flour
      language: en
      source_region_ids:
      - vera-r0038-hare-sauce-ingredients
    - segment_id: ingredient-22
      text_verbatim: 2 tablespoons brown sugar
      language: en
      source_region_ids:
      - vera-r0038-hare-sauce-ingredients
    - segment_id: ingredient-23
      text_verbatim: 1/4 cup cranberry sauce
      language: en
      source_region_ids:
      - vera-r0038-hare-sauce-ingredients
    - segment_id: ingredient-24
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0038-hare-sauce-ingredients
    label:
      segment_id: label-hare-and-sauce
      text_verbatim: 'Hare and sauce:'
