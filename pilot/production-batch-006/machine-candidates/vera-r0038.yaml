      - vera-r0038-hare-sauce-label
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Place hare in a large crock. Add all dry ingredients, top with cognac, add wine.
      language: en
      source_region_ids:
      - vera-r0038-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Add oil to seal air out. The hare must be submerged in the marinade. Soak hare overnight,
        or even better 2·3 days.
      language: en
      source_region_ids:
      - vera-r0038-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Remove and wipe dry with a cloth.
      language: en
      source_region_ids:
      - vera-r0038-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Heat butter in a 4 quart top·of·range casserole. Add bacon and onion and cook until
        soft. Add all spices and lemon rind. Sprinkle hare with salt and vinegar, put into casserole,
        and brown lightly on all sides.
      language: en
      source_region_ids:
      - vera-r0038-step-4
      step_number: 4
    - segment_id: step-5
      text_verbatim: Reduce heat. Add some of the beef stock.
      language: en
      source_region_ids:
      - vera-r0038-step-5
      step_number: 5
    - segment_id: step-6
      text_verbatim: Cover tightly and simmer 1·1·1/2 hours, or until meat is tender when pierced with
        a fork. Add beef stock occasionally.
      language: en
      source_region_ids:
      - vera-r0038-step-6
      step_number: 6
    - segment_id: step-7
      text_verbatim: Transfer hare to a heated platter.
      language: en
      source_region_ids:
      - vera-r0038-step-7
      step_number: 7
    - segment_id: step-8
      text_verbatim: Skim off fat from the cooking liquid, stir in the flour and continue cooking to a
        rich brown. Add the remaining beef stock and the wine.
      language: en
      source_region_ids:
      - vera-r0038-step-8
      step_number: 8
    - segment_id: step-9
      text_verbatim: Cook until sauce thickens. Strain, blend in sugar and cranberry sauce. Season to
        taste with salt and pepper. Bring to boil, stirring constantly.
      language: en
      source_region_ids:
      - vera-r0038-step-9
      step_number: 9
    - segment_id: step-10
      text_verbatim: Slice hare, pour hot sauce over top.
      language: en
      source_region_ids:
      - vera-r0038-step-10
      step_number: 10
    - segment_id: step-11
      text_verbatim: Serve with noodles, gnocchi, dumplings.
      language: en
      source_region_ids:
      - vera-r0038-step-11
      step_number: 11
    label:
      segment_id: label-to-marinate
      text_verbatim: 'To marinate:'
      language: en
      source_region_ids:
      - vera-r0038-instruction-label
