  instruction_sections:
  - section_id: instructions-main
    items:
    - text: 'Leavening: in a bowl stir yeast with 2 teaspoons sugar until liquefied. Add 3/4 cup flour
        and 3/4 cup lukewarm milk. Mix thoroughly, knead, form a ball. Dust lightly with flour, cover
        with a napkin. Let rise 30 minutes, or until doubled in bulk.'
      region_keys:
      - text-1
    - text: Place all remaining ingredients and the risen leavening on a floured pastry board, knead with
        the palms of your hands, until dough feels smooth, dry and elastic. Sprinkle with flour, cover
        with napkin, let rise 40 minutes.
      region_keys:
      - text-3
    - text: Punch dough down, shape into a loaf and transfer into a buttered and floured loaf pan. Let
        rise 15 minutes. Preheat oven to 350F, bake 30 minutes, or until top is golden.
      region_keys:
      - text-4
    - text: 'Next day: Cut loaf into 1/3" thick slices. Dredge each slice in sugar mixed with vanilla
        sugar, shake off excess. Put them on a clean dry baking sheet, brown lightly on both sides in
        250-300F oven.'
      region_keys:
      - text-5
    - text: Biscuits keep fresh for many weeks in an airtight tin.
      region_keys:
      - text-6
