  - section_id: instructions-main
    items:
    - text: Prepare the dough exactly as for Easter braid. After it has risen twice, turn it out onto
        a floured pastry board and divide in three identical sections. Roll and stretch each section into
        a rope 25" long. Press together both ends of each rope twist it so that it will be braided and
        make a loop at the end. Place a raw egg in each loop. Place braids on an oven tray lined with
        buttered wax paper, let them rise 20 minutes. Brush with lightly beaten egg and bake 30 minutes
        in 350 F preheated oven.
      region_keys:
