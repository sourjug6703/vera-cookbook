    items:
    - text: Beat two egg whites and half of the sugar until stiff, set aside. In a bowl combine the butter,
        the egg yolks and the remaining sugar and beat until creamy and fluffy. Add lemon rind, vanilla
        sugar and milk, mix well. Fold in the beaten egg whites by spoonfuls, mixing gently after each
        addition. Fold in the flour mixed with baking powder. Pour the batter into a buttered and floured
        baking dish – fill no more than half full. Spread the cherries evenly over the batter and bake
        at 375F for 30 minutes, or until golden on top. Remove from oven, cool, cut into squares, dust
        with sugar.
