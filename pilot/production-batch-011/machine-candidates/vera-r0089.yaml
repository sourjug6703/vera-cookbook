    steps:
    - segment_id: step-1
      text_verbatim: 'Mix sugar and water well and cover the cake evenly. If the icing is too thick, add
        water. It should be somewhat thick, not too runny. For variety: replace 3 teaspoons of water with
        3 teaspoons of lemon juice, coffee, rum or any other juice to add taste and color. The cake must
        be warm while frosting it in order to achieve a glossy look. Using hot water or milk you will
        get a fondant-like look.'
