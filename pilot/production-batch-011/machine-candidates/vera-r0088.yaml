    - vera-r0088-text-4
  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1-1/4 cups flour
      language: en
      source_region_ids:
      - vera-r0088-listgroup-1
    - segment_id: ingredient-2
      text_verbatim: 1 whole egg
      language: en
      source_region_ids:
      - vera-r0088-listgroup-1
    - segment_id: ingredient-3
      text_verbatim: 6 egg yolks
      language: en
      source_region_ids:
      - vera-r0088-listgroup-1
    - segment_id: ingredient-4
      text_verbatim: 2/3 cup sugar
      language: en
      source_region_ids:
      - vera-r0088-listgroup-1
    - segment_id: ingredient-5
      text_verbatim: 1 teaspoon baking powder
      language: en
      source_region_ids:
      - vera-r0088-listgroup-1
    - segment_id: ingredient-6
      text_verbatim: 1/2 cup diced dried apricots, other dry fruit can substitute
      language: en
      source_region_ids:
      - vera-r0088-listgroup-1
    - segment_id: ingredient-7
      text_verbatim: 1/4 cup slivered almonds
      language: en
      source_region_ids:
      - vera-r0088-listgroup-1
    - segment_id: ingredient-8
      text_verbatim: 1/2 cup golden raisins
      language: en
      source_region_ids:
      - vera-r0088-listgroup-1
    - segment_id: ingredient-9
      text_verbatim: 4 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0088-listgroup-1
    - segment_id: ingredient-10
      text_verbatim: grated rind of one lemon
      language: en
      source_region_ids:
      - vera-r0088-listgroup-1
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: In a saucepan combine the egg yolks, the egg, sugar and lemon rind and set over medium/low
        heat. Beat until the mixture is lukewarm. Remove from heat and continue beating until cool and
        creamy. Fold in the flour mixed with baking powder, dried apricots, almonds, raisins. Lastly,
        add melted butter. Turn the batter into a buttered oblong loaf pan lined with wax paper. Bake
        30 minutes at 350F. Test for doneness with a cake tester or toothpick. Inserting it in the center,
        it should come out clean. Let stand for 5 minutes before turning the bread out onto a cake rack.
        Dust lightly with sugar. Cool and slice.
      language: en
      source_region_ids:
      - vera-r0088-text-2
      step_number: 1
    - segment_id: step-2
      text_verbatim: 'Optional: Spread apricot jelly very thinly over the bread and top with sugar icing.
        When cooled, or when the icing hardens (approximately 2 hours), slice.'
      language: en
      source_region_ids:
      - vera-r0088-text-3
      step_number: 2
