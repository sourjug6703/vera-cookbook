  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: 'Leavening: In a bowl stir the yeast and 2 teaspoons sugar until the yeast dissolves.
        Add 1/2 cup flour and one third of the milk and knead it into a ball. Sprinkle with flour and
        set aside to rise, in a warm, draft free area. It will double in bulk within 20 minutes.'
      language: en
      source_region_ids:
      - vera-r0085-text-2
      step_number: 1
    - segment_id: step-2
      text_verbatim: In a separate bowl combine the remaining flour, sugar, salt and lemon rind. Make
        a well in the center and place the risen leavening, egg yolks and whole egg in it. Gradually adding
        the remaining milk, mix well. Lastly add raisins and melted butter and knead with a wooden spoon,
        or with hands, until dough is smooth and no longer sticks to the bowl. Set aside, dust with flour
        and let rise 30 minutes. Punch dough down, let rise 30 minutes again.
      language: en
      source_region_ids:
      - vera-r0085-text-3
      step_number: 2
    - segment_id: step-3
      text_verbatim: After the dough has risen at the second time, turn it over a floured pastry board
        and divide in two halves. Shape each into a ball. Place on a baking tray lined with buttered wax
        paper. Let rise 30 minutes. Brush with lightly beaten egg. With a sharp knife slit the top of
        each bread cross-wise. Let rise 10 minutes. Preheat oven to 350°F. Sprinkle with slivered almonds
        and bake 30-35 minutes or until breads are golden brown. Dust with sugar and cool at room temperature.
      language: en
      source_region_ids:
      - vera-r0085-text-4
      step_number: 3
