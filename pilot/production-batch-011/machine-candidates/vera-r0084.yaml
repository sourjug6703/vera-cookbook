      - vera-r0084-listgroup-2
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: 'Leavening: in a bowl stir yeast with 2 teaspoons sugar until liquefied. Add 3/4
        cup flour and 3/4 cup lukewarm milk. Mix thoroughly, knead, form a ball. Dust lightly with flour,
        cover with a napkin. Let rise 30 minutes, or until doubled in bulk.'
      language: en
      source_region_ids:
      - vera-r0084-text-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Place all remaining ingredients and the risen leavening on a floured pastry board,
        knead with the palms of your hands, until dough feels smooth, dry and elastic. Sprinkle with flour,
        cover with napkin, let rise 40 minutes.
      language: en
      source_region_ids:
      - vera-r0084-text-3
      step_number: 2
    - segment_id: step-3
      text_verbatim: Punch dough down, shape into a loaf and transfer into a buttered and floured loaf
        pan. Let rise 15 minutes. Preheat oven to 350F, bake 30 minutes, or until top is golden.
      language: en
      source_region_ids:
      - vera-r0084-text-4
      step_number: 3
    - segment_id: step-4
      text_verbatim: 'Next day: Cut loaf into 1/3" thick slices. Dredge each slice in sugar mixed with
        vanilla sugar, shake off excess. Put them on a clean dry baking sheet, brown lightly on both sides
        in 250-300F oven.'
      language: en
      source_region_ids:
      - vera-r0084-text-5
      step_number: 4
    - segment_id: step-5
      text_verbatim: Biscuits keep fresh for many weeks in an airtight tin.
      language: en
      source_region_ids:
      - vera-r0084-text-6
      step_number: 5
