      - vera-r0084-listgroup-2
    - segment_id: ingredient-4
      text_verbatim: 2/3 cup sugar
      language: en
      source_region_ids:
      - vera-r0084-listgroup-2
    - segment_id: ingredient-5
      text_verbatim: 3 egg yolks
      language: en
      source_region_ids:
      - vera-r0084-listgroup-2
    - segment_id: ingredient-6
      text_verbatim: 10 tablespoons melted butter
