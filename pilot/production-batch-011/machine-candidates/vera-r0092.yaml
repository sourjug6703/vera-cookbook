    steps:
    - segment_id: step-1
      text_verbatim: In a bowl combine all dry ingredients, mix them, add the lemon rind and the milk.
        Mix thoroughly and pour the batter into a greased and floured baking dish. Bake in preheated 350F
        oven about 45 minutes. Cool, cut into squares and dust with sugar.
