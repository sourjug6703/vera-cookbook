  yield_time_lines:
  - segment_id: yield-1
    text_verbatim: 'Serves 8 – Preparation time: 1 hour'
    language: en
    source_region_ids:
    - vera-r0090-text-6
  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1 cup flour
      language: en
      source_region_ids:
      - vera-r0090-listgroup-1
    - segment_id: ingredient-2
      text_verbatim: 1 cup sugar
      language: en
      source_region_ids:
      - vera-r0090-listgroup-1
    - segment_id: ingredient-3
      text_verbatim: 1 cup ground walnuts
      language: en
      source_region_ids:
      - vera-r0090-listgroup-1
    - segment_id: ingredient-4
      text_verbatim: 3/4 cup sponge crumbs, or bread crumbs
      language: en
      source_region_ids:
      - vera-r0090-listgroup-1
    - segment_id: ingredient-5
      text_verbatim: 2 eggs, whole
      language: en
      source_region_ids:
      - vera-r0090-listgroup-1
    - segment_id: ingredient-6
      text_verbatim: 1/2 teaspoon cinnamon
      language: en
      source_region_ids:
      - vera-r0090-listgroup-1
    - segment_id: ingredient-7
      text_verbatim: 1/4 cup golden raisins
      language: en
      source_region_ids:
      - vera-r0090-listgroup-1
    - segment_id: ingredient-8
      text_verbatim: 2 teaspoons baking powder
      language: en
      source_region_ids:
      - vera-r0090-listgroup-1
    - segment_id: ingredient-9
      text_verbatim: butter and flour for baking pan
      language: en
      source_region_ids:
      - vera-r0090-listgroup-1
    - segment_id: ingredient-10
      text_verbatim: 10 walnut or pecan halves for decorating
      language: en
      source_region_ids:
      - vera-r0090-listgroup-1
    - segment_id: ingredient-11
      text_verbatim: 3/4 cup sugar icing
      language: en
      source_region_ids:
      - vera-r0090-listgroup-1
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Beat the whole eggs until they are foamy, adding the sugar gradually. Stir in all
        ingredients, leaving the flour mixed with baking powder to be added last. Turn the batter into
        a buttered and floured loaf pan and bake at 350F 40-45 minutes, or until the toothpick comes out
        clean. When done, invert the bread onto a cake rack, cover with icing and decorate with walnut
        or pecan halves.
      language: en
      source_region_ids:
      - vera-r0090-text-2
      step_number: 1
    - segment_id: step-2
      text_verbatim: 'Sugar icing: Same as used on fruit cake.'
      language: en
      source_region_ids:
      - vera-r0090-text-3
      step_number: 2
    - segment_id: step-3
      text_verbatim: 'Note:'
      language: en
      source_region_ids:
      - vera-r0090-text-4
      step_number: 3
    - segment_id: step-4
      text_verbatim: Instead of icing and decorating with nuts, just dust it with sugar mixed with a pinch
        of cinnamon.
      language: en
      source_region_ids:
      - vera-r0090-text-5
      step_number: 4
