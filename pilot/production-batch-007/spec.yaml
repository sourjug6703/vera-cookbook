      - section_id: instructions-main
        items:
          - {text: "Trim excess fat from the cutlets, pound them lightly, rub with juniper berries, sprinkle with salt and pepper, drizzle with cognac and olive oil. Cover, marinate at least 1 hour.", region_keys: [step-1]}
