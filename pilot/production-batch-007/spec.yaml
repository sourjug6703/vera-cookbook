          - {text: "Drain fish, arrange on a heated serving platter, keep it warm. Strain the broth from the fish, reserve 2 cups for dill sauce. Meanwhile, prepare the sauce. Melt butter in a saucepan, blend in flour, stir and cook until golden. Add onion, parsley, fish broth, vinegar, sugar, salt. Cook, uncovered, until sauce thickens. Strain. Blend in the cream and chopped dill. Heat through, do not boil. Pour hot butter over trouts, garnish with parsley. Hand sauce separately.", region_keys: [steps]}
