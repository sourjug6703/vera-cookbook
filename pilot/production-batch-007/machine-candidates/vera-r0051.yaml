  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Cook noodles in lightly salted water, drain and splash with cold water. In a bowl
        cream butter, egg yolks, lemon rind. Combine mixture with noodles and ham. Blend thoroughly. Fold
        in 3 stiffly beaten egg whites. Put into buttered and bread crumbs coated casserole. Pour the
        cream evenly over top and bake uncovered at 350F 35·40 minutes or until golden brown on top. Serve
        straight from oven, with green salad or tomato salad.
      language: en
      source_region_ids:
      - vera-r0051-step-1
