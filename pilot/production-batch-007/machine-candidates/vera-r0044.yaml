  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Rinse quails, pat dry. Sprinkle with salt and pepper inside and outside. Place 1/2
        slice bacon inside each. Heat butter in a flameproof casserole, add quails. Roast 40·50 minutes
        at 350F. Baste often with pan drippings, chicken broth or water. Serve dish straight from the
        oven with quails cut in halves. Garnish with fresh parsley sprigs, red cabbage, cranberry sauce,
        poached halves of apples. Serve with rice, lentils.
      language: en
      source_region_ids:
      - vera-r0044-step-1a
