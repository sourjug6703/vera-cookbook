  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Heat the wine, water, onion, lemon juice, bay leaves and peppercorns. Simmer 10 minutes.
        Add the trouts and simmer gently for 15 minutes, without boiling.
      language: en
      source_region_ids:
      - vera-r0050-steps
      step_number: 1
    - segment_id: step-2
      text_verbatim: Drain fish, arrange on a heated serving platter, keep it warm. Strain the broth from
        the fish, reserve 2 cups for dill sauce. Meanwhile, prepare the sauce. Melt butter in a saucepan,
        blend in flour, stir and cook until golden. Add onion, parsley, fish broth, vinegar, sugar, salt.
        Cook, uncovered, until sauce thickens. Strain. Blend in the cream and chopped dill. Heat through,
        do not boil. Pour hot butter over trouts, garnish with parsley. Hand sauce separately.
      language: en
      source_region_ids:
      - vera-r0050-steps
      step_number: 2
