  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Soak fish 30 minutes in lightly salted milk. Dredge each piece in flour, dip in beaten
        eggs, coat with bread crumbs. Fry in hot oil until golden, about 4 minutes each side. Drain on
        paper towel. Serve on lettuce lined platter, garnish with lemon wedges and parsley sprigs. Serve
        with potato salad, green salad, vegetables.
      language: en
