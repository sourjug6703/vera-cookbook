  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1 pike, 4 lbs., cleaned, with head and tail left on
      language: en
      source_region_ids:
      - vera-r0049-ingredients
    - segment_id: ingredient-2
      text_verbatim: 2 bacon slices cut in thin strips
      language: en
      source_region_ids:
      - vera-r0049-ingredients
    - segment_id: ingredient-3
      text_verbatim: 6 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0049-ingredients
    - segment_id: ingredient-4
      text_verbatim: 1 medium onion, finely chopped
      language: en
      source_region_ids:
      - vera-r0049-ingredients
    - segment_id: ingredient-5
      text_verbatim: 4 medium potatoes, parboiled, sliced
      language: en
      source_region_ids:
      - vera-r0049-ingredients
    - segment_id: ingredient-6
      text_verbatim: juice of 1 lemon
      language: en
      source_region_ids:
      - vera-r0049-ingredients
    - segment_id: ingredient-7
      text_verbatim: 2 teaspoons paprika
      language: en
      source_region_ids:
      - vera-r0049-ingredients
    - segment_id: ingredient-8
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0049-ingredients
    - segment_id: ingredient-9
      text_verbatim: 1 pint sour cream
      language: en
      source_region_ids:
      - vera-r0049-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Sauté onion in butter.
      language: en
      source_region_ids:
      - vera-r0049-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Meanwhile, sprinkle pike with salt, paprika and lemon juice. Lard with strips of
        bacon. Lay fish in a lightly greased baking pan. Arrange potato slices on sides of fish and up,
        towards the edge of the pan. Sprinkle some salt over potatoes.
      language: en
      source_region_ids:
      - vera-r0049-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Pour the butter onion mixture over fish. Top with sour cream. Bake at 350F, 30·40
        minutes.
      language: en
      source_region_ids:
      - vera-r0049-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Serve with tomato salad, vegetables.
      language: en
      source_region_ids:
      - vera-r0049-step-4
      step_number: 4
