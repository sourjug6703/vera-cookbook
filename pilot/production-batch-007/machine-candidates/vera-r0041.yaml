    text_verbatim: 'Serves 6 – Preparation time: 20 minutes, plus marinating'
    language: en
    source_region_ids:
    - vera-r0041-yield
  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 12 young venison cutlets, or medallions, 3 oz. ea.
      language: en
      source_region_ids:
      - vera-r0041-ingredients
    - segment_id: ingredient-2
      text_verbatim: 12 juniper berries, crushed
      language: en
      source_region_ids:
      - vera-r0041-ingredients
    - segment_id: ingredient-3
      text_verbatim: 4 tablespoons cognac
      language: en
      source_region_ids:
      - vera-r0041-ingredients
    - segment_id: ingredient-4
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0041-ingredients
    - segment_id: ingredient-5
      text_verbatim: 1·1/2 cups sour cream
      language: en
      source_region_ids:
      - vera-r0041-ingredients
    - segment_id: ingredient-6
      text_verbatim: 1/2 cup chicken broth
      language: en
      source_region_ids:
      - vera-r0041-ingredients
    - segment_id: ingredient-7
      text_verbatim: 3/4 cup olive oil
      language: en
      source_region_ids:
      - vera-r0041-ingredients
    - segment_id: ingredient-8
      text_verbatim: 4 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0041-ingredients
    - segment_id: ingredient-9
      text_verbatim: 1 small onion, finely chopped
      language: en
      source_region_ids:
      - vera-r0041-ingredients
    - segment_id: ingredient-10
      text_verbatim: 1 lb. fresh mushrooms, sliced lengthwise
      language: en
      source_region_ids:
      - vera-r0041-ingredients
    - segment_id: ingredient-11
      text_verbatim: snipped parsley
      language: en
      source_region_ids:
      - vera-r0041-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Trim excess fat from the cutlets, pound them lightly, rub with juniper berries, sprinkle
        with salt and pepper, drizzle with cognac and olive oil. Cover, marinate at least 1 hour.
      language: en
      source_region_ids:
      - vera-r0041-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Meanwhile melt butter in a large skillet, sauté onion and mushrooms. Season with
        salt and pepper. Reserve.
      language: en
      source_region_ids:
      - vera-r0041-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Drain and wipe the cutlets, reserve marinade. Heat remaining oil in a heavy frying
        pan, fry venison over high heat, about 3 minutes each side. Remove cutlets, keep them warm. Deglaze
        pan with marinade. Add chicken broth and sour cream, simmer 5 minutes. Taste for salt and pepper.
      language: en
      source_region_ids:
      - vera-r0041-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Coat the cutlets, or medallions, with the sauce. Garnish with mushrooms, snipped
        parsley, poached halves of apples, serve with noodles, rice.
      language: en
      source_region_ids:
      - vera-r0041-step-4
      step_number: 4
