  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 4 medium potatoes, boiled, mashed, cooled
      language: en
      source_region_ids:
      - vera-r0102-listgroup-3
    - segment_id: ingredient-2
      text_verbatim: 1-1/2 cups flour
      language: en
      source_region_ids:
      - vera-r0102-listgroup-3
    - segment_id: ingredient-3
      text_verbatim: 1 egg
      language: en
      source_region_ids:
      - vera-r0102-listgroup-3
    - segment_id: ingredient-4
      text_verbatim: 2 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0102-listgroup-3
    - segment_id: ingredient-5
      text_verbatim: dash of salt
      language: en
      source_region_ids:
      - vera-r0102-listgroup-3
    - segment_id: ingredient-6
      text_verbatim: 1 egg white for brushing
      language: en
      source_region_ids:
      - vera-r0102-listgroup-3
    label:
      segment_id: label-2
      text_verbatim: 'Dough:'
      language: en
      source_region_ids:
      - vera-r0102-sectionheader-2
  - section_id: ingredients-2
    ingredients:
    - segment_id: ingredient-7
      text_verbatim: 3 tablespoons vegetable oil
      language: en
      source_region_ids:
      - vera-r0102-listgroup-7
    - segment_id: ingredient-8
      text_verbatim: 1 small onion, finely chopped
      language: en
      source_region_ids:
      - vera-r0102-listgroup-7
    - segment_id: ingredient-9
      text_verbatim: 1 tablespoon sugar
      language: en
      source_region_ids:
      - vera-r0102-listgroup-7
    - segment_id: ingredient-10
      text_verbatim: 2 cups shredded cabbage
      language: en
      source_region_ids:
      - vera-r0102-listgroup-7
    - segment_id: ingredient-11
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0102-listgroup-7
    label:
      segment_id: label-6
      text_verbatim: 'Stuffing:'
      language: en
      source_region_ids:
      - vera-r0102-sectionheader-6
  - section_id: ingredients-3
    ingredients:
    - segment_id: ingredient-12
      text_verbatim: 3/4 cup bread crumbs
      language: en
      source_region_ids:
      - vera-r0102-listgroup-12
    - segment_id: ingredient-13
      text_verbatim: 4 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0102-listgroup-12
    - segment_id: ingredient-14
      text_verbatim: 3 tablespoons sugar
      language: en
      source_region_ids:
      - vera-r0102-listgroup-12
    label:
      segment_id: label-10
      text_verbatim: 'Topping:'
      language: en
      source_region_ids:
      - vera-r0102-sectionheader-10
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: 'Make stuffing: Sauté onion in oil until translucent. Stir in sugar. Add cabbage,
        salt and pepper, cook 10-15 minutes, until cabbage is tender. Do not overcook. Properly cooked
        cabbage should be crisp.'
      language: en
      source_region_ids:
      - vera-r0102-text-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Combine dough ingredients and knead until smooth, for about 10 minutes.
      language: en
      source_region_ids:
      - vera-r0102-text-4
      step_number: 2
    - segment_id: step-3
      text_verbatim: On a floured surface roll dough out to 1/4" thickness. Cut out 2-1/2" squares. Drop
        a spoonful of cabbage in center of each square. Brush edges with egg white, fold squares to form
        a triangle. Press edges firmly together.
      language: en
      source_region_ids:
      - vera-r0102-text-5
      step_number: 3
    - segment_id: step-4
      text_verbatim: Boil slowly in lightly salted water for 5 minutes.
      language: en
      source_region_ids:
      - vera-r0102-text-8
      step_number: 4
    - segment_id: step-5
      text_verbatim: Drain, dredge in bread crumbs browned in butter, sprinkle with sugar.
      language: en
      source_region_ids:
      - vera-r0102-text-9
      step_number: 5
