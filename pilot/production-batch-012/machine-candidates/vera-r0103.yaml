    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 2 cups flour
      language: en
      source_region_ids:
      - vera-r0103-listgroup-1
    - segment_id: ingredient-2
      text_verbatim: 1/4 cup sugar
      language: en
      source_region_ids:
      - vera-r0103-listgroup-1
    - segment_id: ingredient-3
      text_verbatim: 1·1/3 cups milk
      language: en
      source_region_ids:
      - vera-r0103-listgroup-1
    - segment_id: ingredient-4
      text_verbatim: 1/2 oz. fresh yeast
      language: en
      source_region_ids:
      - vera-r0103-listgroup-1
    - segment_id: ingredient-5
      text_verbatim: 2 eggs, separated
      language: en
      source_region_ids:
      - vera-r0103-listgroup-1
    - segment_id: ingredient-6
      text_verbatim: 1/4 teaspoon ground nutmeg
      language: en
      source_region_ids:
      - vera-r0103-listgroup-1
    - segment_id: ingredient-7
      text_verbatim: dash of salt
      language: en
      source_region_ids:
      - vera-r0103-listgroup-1
    - segment_id: ingredient-8
      text_verbatim: 'grease for griddle Topping:'
      language: en
      source_region_ids:
      - vera-r0103-listgroup-1
    - segment_id: ingredient-9
      text_verbatim: 2 tablespoons sugar mixed with 1/2 teaspoon cinnamon
      language: en
      source_region_ids:
      - vera-r0103-listgroup-1
    - segment_id: ingredient-10
      text_verbatim: '4 tablespoons melted butter Optional:'
      language: en
      source_region_ids:
      - vera-r0103-listgroup-1
    - segment_id: ingredient-11
      text_verbatim: 1/2 cup each of fruit jam and sour cream
      language: en
      source_region_ids:
      - vera-r0103-listgroup-1
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: In a large bowl stir yeast and 2 teaspoons sugar until dissolved. Gradually add lukewarm
        milk, flour, salt, remaining sugar, nutmeg, and egg yolks. Mix thoroughly, let rise in a warm
        place 30 minutes or until doubled in bulk. Gently fold in stiffly whipped egg whites. Let rise
        15 minutes.
      language: en
      source_region_ids:
      - vera-r0103-text-2
      step_number: 1
    - segment_id: step-2
      text_verbatim: Lightly grease griddle, and set over medium heat. After 4·5 minutes griddle should
        be hot enough for baking. Pour batter onto griddle by scoopfuls, about 3·1/2" in diameter, leaving
        at least 1" between cakes. Turn pancakes as they become puffy and full of bubbles on top.
      language: en
      source_region_ids:
      - vera-r0103-text-3
      step_number: 2
    - segment_id: step-3
      text_verbatim: Brush each with melted butter, sprinkle with sugar mixed with cinnamon.
      language: en
      source_region_ids:
      - vera-r0103-text-4
      step_number: 3
    - segment_id: step-4
      text_verbatim: 'Optional: Spread fruit jam over pancakes and dot with sour cream. Serve hot.'
      language: en
      source_region_ids:
      - vera-r0103-text-5
      step_number: 4
