  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: In a bowl blend flour, salt, milk, mixing constantly (use wire whisk or electric
        mixer at low speed). Add egg, rum and sugar. Mix well.
      language: en
      source_region_ids:
      - vera-r0101-text-3
      step_number: 1
    - segment_id: step-2
      text_verbatim: In a bowl thoroughly blend egg yolks and wine. Gradually add flour, salt, sugar and
        oil. (use wire whisk or electric mixer at low speed). Gently fold in stiffly whipped egg whites.
      language: en
      source_region_ids:
      - vera-r0101-text-6
      step_number: 2
    - segment_id: step-3
      text_verbatim: Peel and core the apples. Cut them in round slices (approx 1/3" thick), dip each
        in the batter and deep fry until golden brown. Drain on a paper towel, dust with sugar and serve.
        Or serve with apricot sauce.
      language: en
      source_region_ids:
      - vera-r0101-text-10
      step_number: 3
    - segment_id: step-4
      text_verbatim: In a saucepan combine the wine, lemon rind, apricot preserve and sugar. Set over
        medium heat and bring to boil stirring constantly. Boil for 1 minute. Add the cornstarch dissolved
        in water and boil one minute more. Pass the sauce through a sieve. Serve warm with warm desserts
        and cold with cold desserts.
      language: en
      source_region_ids:
      - vera-r0101-text-15
      step_number: 4
    - segment_id: step-5
      text_verbatim: Peel and pit the plums or peaches. Cut in halves or sections, dip in the batter and
