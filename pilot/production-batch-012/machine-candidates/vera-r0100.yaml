  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Boil the potatoes, peel and purée them while hot. When cooled add the flour, salt,
        butter and egg and knead the dough until smooth. Turn the dough over on a floured pastry board
        and continue as indicated above.
      language: en
