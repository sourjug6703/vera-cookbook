  instruction_sections:
  - section_id: instructions-main
    items:
    - text: Place the flour on a pastry board and make a well in the center. Pour lukewarm water in the
        well. Add salt, softened butter and the egg. With the palm of your hands knead all ingredients
        into a ball. Let it rest in a warm place for 30 minutes.
      region_keys:
      - text-1
    - text: Turn the dough over a floured cloth napkin, flatten it a little with a rolling pin and brush
        with melted hot butter. Then stretch it with hands into a thin oblong shape. Cover two thirds
        with bread crumbs browned in butter.
      region_keys:
      - text-4
    - text: Peel the apples, slice them thinly and spread them evenly over the bread crumbs. Top with
        sugar mixed with cinnamon and raisins. Brush the edges of the dough with melted butter. With the
        help of the napkin roll the dough with the filling into a loaf. Put the loaf on a greased baking
        sheet and brush it with butter. Bake 30 minutes at 375F. When done, slice it and dust with sugar.
        May be served warm, or cooled. Can be reheated.
      region_keys:
      - text-7
