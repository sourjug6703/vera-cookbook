    - text: dash of salt
      region_keys:
      - listgroup-3
    - text: 1 egg white for brushing
      region_keys:
      - listgroup-3
  - section_id: ingredients-2
    label:
      segment_id: label-6
      text: 'Stuffing:'
      region_key: sectionheader-6
    items:
    - text: 3 tablespoons vegetable oil
      region_keys:
      - listgroup-7
    - text: 1 small onion, finely chopped
      region_keys:
      - listgroup-7
    - text: 1 tablespoon sugar
      region_keys:
      - listgroup-7
    - text: 2 cups shredded cabbage
      region_keys:
      - listgroup-7
    - text: salt and pepper
      region_keys:
