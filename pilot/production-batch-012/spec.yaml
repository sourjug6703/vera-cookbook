  ingredient_sections:
  - section_id: ingredients-1
    label:
      segment_id: label-2
      text: 'Dough:'
      region_key: sectionheader-2
    items:
    - text: 4 medium potatoes, boiled, mashed, cooled
      region_keys:
      - listgroup-3
    - text: 1-1/2 cups flour
      region_keys:
      - listgroup-3
    - text: 1 egg
      region_keys:
      - listgroup-3
    - text: 2 tablespoons butter
      region_keys:
