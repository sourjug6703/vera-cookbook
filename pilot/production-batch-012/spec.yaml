  instruction_sections:
  - section_id: instructions-main
    items:
    - text: 'Make stuffing: Sauté onion in oil until translucent. Stir in sugar. Add cabbage, salt and
        pepper, cook 10-15 minutes, until cabbage is tender. Do not overcook. Properly cooked cabbage
        should be crisp.'
      region_keys:
      - text-1
    - text: Combine dough ingredients and knead until smooth, for about 10 minutes.
      region_keys:
      - text-4
    - text: On a floured surface roll dough out to 1/4" thickness. Cut out 2-1/2" squares. Drop a spoonful
        of cabbage in center of each square. Brush edges with egg white, fold squares to form a triangle.
        Press edges firmly together.
      region_keys:
      - text-5
    - text: Boil slowly in lightly salted water for 5 minutes.
      region_keys:
      - text-8
    - text: Drain, dredge in bread crumbs browned in butter, sprinkle with sugar.
      region_keys:
      - text-9
