    - text: 1/4 cup sugar
      region_keys:
      - listgroup-1
    - text: 1·1/3 cups milk
      region_keys:
      - listgroup-1
    - text: 1/2 oz. fresh yeast
      region_keys:
      - listgroup-1
    - text: 2 eggs, separated
      region_keys:
      - listgroup-1
    - text: 1/4 teaspoon ground nutmeg
      region_keys:
      - listgroup-1
    - text: dash of salt
      region_keys:
      - listgroup-1
    - text: 'grease for griddle Topping:'
      region_keys:
      - listgroup-1
    - text: 2 tablespoons sugar mixed with 1/2 teaspoon cinnamon
      region_keys:
      - listgroup-1
    - text: '4 tablespoons melted butter Optional:'
      region_keys:
      - listgroup-1
    - text: 1/2 cup each of fruit jam and sour cream
      region_keys:
      - listgroup-1
  instruction_sections:
  - section_id: instructions-main
    items:
    - text: In a large bowl stir yeast and 2 teaspoons sugar until dissolved. Gradually add lukewarm milk,
        flour, salt, remaining sugar, nutmeg, and egg yolks. Mix thoroughly, let rise in a warm place
        30 minutes or until doubled in bulk. Gently fold in stiffly whipped egg whites. Let rise 15 minutes.
      region_keys:
      - text-2
    - text: Lightly grease griddle, and set over medium heat. After 4·5 minutes griddle should be hot
        enough for baking. Pour batter onto griddle by scoopfuls, about 3·1/2" in diameter, leaving at
        least 1" between cakes. Turn pancakes as they become puffy and full of bubbles on top.
      region_keys:
      - text-3
    - text: Brush each with melted butter, sprinkle with sugar mixed with cinnamon.
      region_keys:
      - text-4
    - text: 'Optional: Spread fruit jam over pancakes and dot with sour cream. Serve hot.'
      region_keys:
      - text-5
