  instruction_sections:
  - section_id: instructions-main
    items:
    - text: In a bowl blend flour, salt, milk, mixing constantly (use wire whisk or electric mixer at
        low speed). Add egg, rum and sugar. Mix well.
      region_keys:
      - text-3
    - text: In a bowl thoroughly blend egg yolks and wine. Gradually add flour, salt, sugar and oil. (use
        wire whisk or electric mixer at low speed). Gently fold in stiffly whipped egg whites.
      region_keys:
      - text-6
    - text: Peel and core the apples. Cut them in round slices (approx 1/3" thick), dip each in the batter
        and deep fry until golden brown. Drain on a paper towel, dust with sugar and serve. Or serve with
        apricot sauce.
      region_keys:
      - text-10
    - text: In a saucepan combine the wine, lemon rind, apricot preserve and sugar. Set over medium heat
        and bring to boil stirring constantly. Boil for 1 minute. Add the cornstarch dissolved in water
        and boil one minute more. Pass the sauce through a sieve. Serve warm with warm desserts and cold
        with cold desserts.
      region_keys:
      - text-15
    - text: Peel and pit the plums or peaches. Cut in halves or sections, dip in the batter and deep fry
        until golden brown. Drain on paper towel, dust with sugar.
      region_keys:
      - text-19
    - text: Sliced bananas and other fruits may be prepared in the same manner.
      region_keys:
      - text-20
