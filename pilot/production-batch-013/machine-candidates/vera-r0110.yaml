  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 2 cups flour
      language: en
      source_region_ids:
      - vera-r0110-listgroup-1
    - segment_id: ingredient-2
      text_verbatim: 1/2 cup sugar
      language: en
      source_region_ids:
      - vera-r0110-listgroup-1
    - segment_id: ingredient-3
      text_verbatim: 8 oz. ground almonds
      language: en
      source_region_ids:
      - vera-r0110-listgroup-1
    - segment_id: ingredient-4
      text_verbatim: 3 sticks butter
      language: en
      source_region_ids:
      - vera-r0110-listgroup-1
    - segment_id: ingredient-5
      text_verbatim: 2 packages vanilla sugar (1 package into dough, 1 for sprinkling)
      language: en
      source_region_ids:
      - vera-r0110-listgroup-1
    - segment_id: ingredient-6
      text_verbatim: 4 tablespoons sugar mixed with vanilla sugar
      language: en
      source_region_ids:
      - vera-r0110-listgroup-1
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: On a floured pastry board knead all ingredients into a ball. Use palms of your hands,
        not fingers, so that dough will not crumble. Dough is ready when smooth and no longer sticks to
        the board. Refrigerate 1 hour, or overnight as it will be easier to work with. Shape tiny horns
        the size of your little finger or smaller, according to your preference and patience. A small
        grinder is available in some speciality stores, which makes them all equal in size and is faster
        than the "manual method". Place horns on a clean dry cookie sheet, 1" apart. Preheat oven to 325F,
        bake 15-20 minutes, until pale golden. Remove from oven and let stand 5 minutes. While hot, sprinkle
        with sugar mixed with vanilla sugar. When cooled remove carefully from cookie sheet. They keep
        for many weeks in an airtight tin.
      language: en
      source_region_ids:
      - vera-r0110-text-2
      step_number: 1
