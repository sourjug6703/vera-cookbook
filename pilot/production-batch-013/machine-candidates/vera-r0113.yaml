    - vera-r0113-text-3
  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 2/3 cup heavy cream
      language: en
      source_region_ids:
      - vera-r0113-listgroup-2
    - segment_id: ingredient-2
      text_verbatim: 6 oz. ground walnuts or hazelnuts
      language: en
      source_region_ids:
      - vera-r0113-listgroup-2
    - segment_id: ingredient-3
      text_verbatim: 3/4 cup sugar
      language: en
      source_region_ids:
      - vera-r0113-listgroup-2
    - segment_id: ingredient-4
      text_verbatim: 1 teaspoon vanilla sugar
      language: en
      source_region_ids:
      - vera-r0113-listgroup-2
    - segment_id: ingredient-5
      text_verbatim: 1 egg white
      language: en
      source_region_ids:
      - vera-r0113-listgroup-2
    - segment_id: ingredient-6
      text_verbatim: 3/4 cup grated dark semi-sweet chocolate
      language: en
      source_region_ids:
      - vera-r0113-listgroup-2
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: 'Pour the cream in a saucepan and set over medium heat. When hot, but not boiling,
        add sugar, vanilla sugar and the ground nuts. Stirring steadily, boil until the mixture stiffens
        and separates from the pan. Remove from heat. Let it cool or refrigerate overnight. Next day:
        Make little balls, dip each in egg white and dredge in grated chocolate. Let the "truffles" dry
        for 10 minutes and place them in petit-four holders.'
      language: en
      source_region_ids:
      - vera-r0113-text-1
      step_number: 1
