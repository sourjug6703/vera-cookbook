  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: In a saucepan cream sugar and egg yolks. Add coffee, set over medium heat. Stir constantly
        until mixture becomes hot. Do not boil. Remove from heat, turn mixture into a clean bowl, let
        cool. In a bowl cream butter and gradually add the cooled sugar/egg yolks/coffee mixture. Beat
        until fluffy.
