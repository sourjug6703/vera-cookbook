  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1 cup flour
      language: en
      source_region_ids:
      - vera-r0104-listgroup-1
    - segment_id: ingredient-2
      text_verbatim: 1·1/2 cups milk
      language: en
      source_region_ids:
      - vera-r0104-listgroup-1
    - segment_id: ingredient-3
      text_verbatim: 1/3 cup sugar
      language: en
      source_region_ids:
      - vera-r0104-listgroup-1
    - segment_id: ingredient-4
      text_verbatim: 5 eggs, separated
      language: en
      source_region_ids:
      - vera-r0104-listgroup-1
    - segment_id: ingredient-5
      text_verbatim: pinch of salt
      language: en
      source_region_ids:
      - vera-r0104-listgroup-1
    - segment_id: ingredient-6
      text_verbatim: 2 large apples, Granny Smith type, peeled, diced
      language: en
      source_region_ids:
      - vera-r0104-listgroup-1
    - segment_id: ingredient-7
      text_verbatim: 6 tablespoons butter for frying
      language: en
      source_region_ids:
      - vera-r0104-listgroup-1
    - segment_id: ingredient-8
      text_verbatim: 2 tablespoons sugar for dusting
      language: en
      source_region_ids:
      - vera-r0104-listgroup-1
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Cream egg yolks and sugar, using wire whisk or electric mixer at low speed. When
        mixture becomes foamy, gradually add flour, salt and milk mixing well after each addition.
      language: en
      source_region_ids:
      - vera-r0104-text-2
      step_number: 1
    - segment_id: step-2
      text_verbatim: Blend in apples and stiffly whipped egg whites. Drop by scoopfuls in hot butter and
        fry on both sides. Roll each pancake, sprinkle with sugar and place on a serving dish.
      language: en
      source_region_ids:
      - vera-r0104-text-3
      step_number: 2
