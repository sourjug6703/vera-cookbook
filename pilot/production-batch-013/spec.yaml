  instruction_sections:
  - section_id: instructions-main
    items:
    - text: On a floured pastry board knead all ingredients into a ball using the palms of your hands,
        not the fingers. The dough will be smooth and will not crumble. You can let it rest for a few
        hours, overnight or more. You can use it right away also.
      region_keys:
      - text-2
    - text: With a roller pin roll the dough out as thin as possible. (1/8"). Cut it into 1-1/4" round
        cakes, using a cookie cutter or a glass. Separate half of the round cakes and cut out a small
        round hole in the center, the size of a thimble. Use a cookie cutter or a thimble. Place the round
        cakes on a clean, dry cookie sheet and bake at 350F for 15 minutes, or until they are pink/golden.
        Remove from oven and cool. Before serving put 1/2 teaspoon of red raspberry or red currant seedless
        preserve in the center of each plain round, top it with one "holed" round. The red color is important
        for the look of the cookies and the sour flavor of raspberry or currant compliments them well.
        Unfilled cookies can be stored for weeks in an airtight container.
      region_keys:
