  instruction_sections:
  - section_id: instructions-main
    items:
    - text: On a floured pastry board knead all ingredients into a ball. Use palms of your hands, not
        fingers, so that dough will not crumble. Dough is ready when smooth and no longer sticks to the
        board. Refrigerate 1 hour, or overnight as it will be easier to work with. Shape tiny horns the
        size of your little finger or smaller, according to your preference and patience. A small grinder
