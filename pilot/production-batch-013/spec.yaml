    items:
    - text: Beat egg whites until stiff, set aside. In a separate bowl cream sugar and egg yolks, adding
        one at a time and beating well after each addition. Add 1 tablespoon water. Continue beating until
        light and fluffy, about 10 minutes total. Fold in flour, nuts and stiffly whipped egg whites.
        Mix thoroughly, pour batter into buttered and floured 9" spring form cake pan. Preheat oven to
        350F, bake about 40 minutes or until cake tester or wooden pick comes out clean and cake separates
        from side of spring form.
      region_keys:
      - text-2
    - text: When cooled, cut cake horizontally, spread evenly with chocolate or mocca filling, then frost
        top and sides with the same. Decorate with walnuts or pecan halves or tosted almonds slivers.
