  instruction_sections:
  - section_id: instructions-main
    items:
    - text: 'Pour the cream in a saucepan and set over medium heat. When hot, but not boiling, add sugar,
        vanilla sugar and the ground nuts. Stirring steadily, boil until the mixture stiffens and separates
        from the pan. Remove from heat. Let it cool or refrigerate overnight. Next day: Make little balls,
        dip each in egg white and dredge in grated chocolate. Let the "truffles" dry for 10 minutes and
        place them in petit-four holders.'
