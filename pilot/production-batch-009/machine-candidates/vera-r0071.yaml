transcription:
  yield_time_lines:
  - segment_id: yield-1
    text_verbatim: 'Serves 10 – Preparation time: 3 hours'
    language: en
    source_region_ids:
    - vera-r0071-text-11
  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 4 cups flour
      language: en
      source_region_ids:
      - vera-r0071-listgroup-2
    - segment_id: ingredient-2
      text_verbatim: 1 oz. fresh yeast
      language: en
      source_region_ids:
      - vera-r0071-listgroup-2
    - segment_id: ingredient-3
      text_verbatim: 2 cups milk
      language: en
      source_region_ids:
      - vera-r0071-listgroup-2
    - segment_id: ingredient-4
      text_verbatim: 1/3 cup sugar
      language: en
      source_region_ids:
      - vera-r0071-listgroup-2
    - segment_id: ingredient-5
      text_verbatim: 6 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0071-listgroup-2
    - segment_id: ingredient-6
      text_verbatim: grated rind of 1 lemon
      language: en
      source_region_ids:
      - vera-r0071-listgroup-2
    - segment_id: ingredient-7
      text_verbatim: 2 egg yolks
      language: en
      source_region_ids:
      - vera-r0071-listgroup-2
    - segment_id: ingredient-8
      text_verbatim: dash of grated nutmeg
      language: en
      source_region_ids:
      - vera-r0071-listgroup-2
    - segment_id: ingredient-9
      text_verbatim: 1 whole egg for brushing
      language: en
      source_region_ids:
      - vera-r0071-listgroup-2
    - segment_id: ingredient-10
      text_verbatim: 1 cup filling or thick fruit preserve
      language: en
      source_region_ids:
      - vera-r0071-listgroup-2
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: 'Leavening: In a bowl stir yeast with 2 teaspoons sugar until dissolved. Add 2/3
        cup flour and 1/2 cup lukewarm milk. Knead into a ball. Dust with flour, cover with napkin, let
        rise in a warm place. It will double in bulk within 20 minutes.'
      language: en
      source_region_ids:
      - vera-r0071-text-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: In a separate bowl combine remaining flour and sugar, lemon rind, nutmeg, salt. Place
        risen leavening in center.
      language: en
      source_region_ids:
      - vera-r0071-text-3
      step_number: 2
    - segment_id: step-3
      text_verbatim: Lightly beat egg yolks and the remaining lukewarm milk, then add it gradually to
        flour/leavening while mixing thoroughly. Finally add melted lukewarm butter and knead dough until
        smooth and elastic.
      language: en
      source_region_ids:
      - vera-r0071-text-4
      step_number: 3
    - segment_id: step-4
      text_verbatim: Dust with flour, cover with a napkin and let rise 40 minutes in a warm place.
      language: en
      source_region_ids:
      - vera-r0071-text-5
      step_number: 4
    - segment_id: step-5
      text_verbatim: Punch dough down and turn onto lightly floured pastry board. Break off dough and
        form balls the size of a walnut. Place them on a greased baking sheet, 4" apart. Let rise 10 minutes.
      language: en
      source_region_ids:
      - vera-r0071-text-6
      step_number: 5
    - segment_id: step-6
      text_verbatim: Press down the center of each ball, using bottom of a small glass or other round
        object, or with your fingers, so that a higher border will be formed. Brush borders with beaten
        egg. Spread filling evenly over center wells. Let rise 15 minutes.
      language: en
      source_region_ids:
      - vera-r0071-text-7
      step_number: 6
    - segment_id: step-7
      text_verbatim: (If using butter crumbs filling, brush with melted butter first. This way filling
        will stick).
      language: en
      source_region_ids:
      - vera-r0071-text-8
      step_number: 7
    - segment_id: step-8
      text_verbatim: Preheat oven to 350F, bake 15 minutes, or until borders are golden brown.
      language: en
      source_region_ids:
      - vera-r0071-text-9
      step_number: 8
    - segment_id: step-9
      text_verbatim: Dust with sugar while warm.
      language: en
      source_region_ids:
      - vera-r0071-text-10
      step_number: 9
