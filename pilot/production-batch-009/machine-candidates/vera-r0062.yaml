  yield_time_lines:
  - segment_id: yield-1
    text_verbatim: 'Serves 6 – Preparation time: 1 hour'
    language: en
    source_region_ids:
    - vera-r0062-text-5
  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 5 medium potatoes
      language: en
      source_region_ids:
      - vera-r0062-listgroup-1
    - segment_id: ingredient-2
      text_verbatim: 1 cup flour
      language: en
      source_region_ids:
      - vera-r0062-listgroup-1
    - segment_id: ingredient-3
      text_verbatim: 1 cup cream of wheat, regular, not precooked
      language: en
      source_region_ids:
      - vera-r0062-listgroup-1
    - segment_id: ingredient-4
      text_verbatim: 4 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0062-listgroup-1
    - segment_id: ingredient-5
      text_verbatim: 2 whole eggs
      language: en
      source_region_ids:
      - vera-r0062-listgroup-1
    - segment_id: ingredient-6
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0062-listgroup-1
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Peel potatoes, cook in salted water, drain. Mash them, add butter, eggs, salt. Mix
        thoroughly, blend in flour and cream of wheat. Knead until dough is smooth and dry.
      language: en
      source_region_ids:
      - vera-r0062-text-2
      step_number: 1
    - segment_id: step-2
      text_verbatim: Pinch off bits of dough, roll into 2" balls. Cook in lightly salted boiling water
        10-12 minutes. Serve immediately.
      language: en
      source_region_ids:
      - vera-r0062-text-3
      step_number: 2
    - segment_id: step-3
      text_verbatim: Serve with roast goose, pork, cabbage, sauerkraut.
      language: en
      source_region_ids:
      - vera-r0062-text-4
      step_number: 3
