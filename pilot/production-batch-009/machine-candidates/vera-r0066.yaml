transcription:
  yield_time_lines:
  - segment_id: yield-1
    text_verbatim: 'Serves 6 – Preparation time: 1 hour'
    language: en
    source_region_ids:
    - vera-r0066-text-8
  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 2 lbs. tripe
      language: en
      source_region_ids:
      - vera-r0066-listgroup-2
    - segment_id: ingredient-2
      text_verbatim: 2 quarts chicken broth
      language: en
      source_region_ids:
      - vera-r0066-listgroup-2
    - segment_id: ingredient-3
      text_verbatim: 2 carrots
      language: en
      source_region_ids:
      - vera-r0066-listgroup-2
    - segment_id: ingredient-4
      text_verbatim: 1 celery root, or 4 stalks
      language: en
      source_region_ids:
      - vera-r0066-listgroup-2
    - segment_id: ingredient-5
      text_verbatim: 1 medium onion, quartered
      language: en
      source_region_ids:
      - vera-r0066-listgroup-2
    - segment_id: ingredient-6
      text_verbatim: 4 cloves garlic, pressed or chopped
      language: en
      source_region_ids:
      - vera-r0066-listgroup-2
    - segment_id: ingredient-7
      text_verbatim: 2 tablespoons paprika
      language: en
      source_region_ids:
      - vera-r0066-listgroup-2
    - segment_id: ingredient-8
      text_verbatim: 1/2 teaspoon each of marjoram, ground allspice, black pepper, ginger
      language: en
      source_region_ids:
      - vera-r0066-listgroup-2
    - segment_id: ingredient-9
      text_verbatim: 3 tablespoons butter and 4 tablespoons flour for the roux
      language: en
      source_region_ids:
      - vera-r0066-listgroup-2
    - segment_id: ingredient-10
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0066-listgroup-2
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: 'Most supermarkets and butchers sell tripe already cleaned and parboiled, so just
        rinse it well in cold water. However, if you need to start from scratch, here''s how:'
      language: en
      source_region_ids:
      - vera-r0066-text-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Clean tripe well and rinse thoroughly under running cold water. Rub with salt, scald
        with boiling water, then rinse again under running cold water. Put in a large pot, cover with
        salted water, and boil covered for 1 hour. Drain. Rinse thoroughly in cold water again. Start
        with clean salted water and boil tripe until almost tender. 1-2 hours.
      language: en
      source_region_ids:
      - vera-r0066-text-3
      step_number: 2
    - segment_id: step-3
      text_verbatim: Cook tripe with carrots, celery and onion in chicken broth until tripe
      language: en
      source_region_ids:
      - vera-r0066-text-4
      step_number: 3
    - segment_id: step-4
      text_verbatim: and vegetables are tender, 30-40 minutes. Remove tripe and vegetables, reserve the
        broth.
      language: en
      source_region_ids:
      - vera-r0066-text-5
      step_number: 4
    - segment_id: step-5
      text_verbatim: Melt butter in a saucepan. Stir in flour to make a smooth paste. Cook and stir until
        golden. Add garlic, paprika, marjoram, allspice, pepper and ginger. Brown mixture lightly. Add
        the broth, simmer 10 minutes, strain.
      language: en
      source_region_ids:
      - vera-r0066-text-6
      step_number: 5
    - segment_id: step-6
      text_verbatim: Cut tripe in 2" long thin strips, slice vegetables, stir into soup. Season to taste
        with salt and pepper.
      language: en
      source_region_ids:
      - vera-r0066-text-7
      step_number: 6
