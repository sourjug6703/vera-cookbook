  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Lightly beat egg yolks in one cup milk. Pour remaining milk in a saucepot, add sugar
        and salt. Set over medium/low heat, bring to boiling, stirring constantly. Blend in yolks/milk
        mixture, heat through, but do not boil. Serve with toasts or croutons.
