  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: 'Leavening: In a bowl stir yeast with 2 teaspoons sugar until dissolved. Add 2/3
        cup flour and 1/2 cup lukewarm milk. Knead into a ball. Dust with flour, cover with a napkin,
        set aside to rise – in a warm draft free place. It should double in bulk within 15-20 minutes.'
      language: en
      source_region_ids:
      - vera-r0072-text-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: In a separate bowl blend remaining flour with sugar, lemon rind and salt. Push to
        sides making a well in the center. Place risen leavening in the well.
      language: en
      source_region_ids:
      - vera-r0072-text-3
      step_number: 2
    - segment_id: step-3
      text_verbatim: Lightly beat egg yolks and whole egg in remaining lukewarm milk. Add it gradually
        to flour/leavening mixture, mixing thoroughly. Lastly, add melted lukewarm butter. Knead dough
        until smooth and no longer sticks to the bowl. Dust with flour, cover with napkin and let it rise
        40 minutes.
      language: en
      source_region_ids:
      - vera-r0072-text-4
      step_number: 3
    - segment_id: step-4
      text_verbatim: Turn dough over onto a floured pastry board and roll it out to 1/3" thickness. Cut
        into 2 × 3" rectangles. Drop filling by teaspoonfuls on narrower side of each rectangle, roll
        over so that filling will be well covered with the dough. Pinch sides firmly to seal them. Dip
        each piece in butter, or brush on all sides with melted butter. Arrange them close together in
        a buttered baking pan. Let them rise 30 minutes. Preheat oven to 350F and bake 25 minutes or until
        golden on top. Invert 'buchty' onto a wire rack and cool, at least 20 minutes. Separate them carefully
        and sprinkle with sugar.
      language: en
      source_region_ids:
      - vera-r0072-text-5
      step_number: 4
