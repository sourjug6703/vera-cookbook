    - vera-r0067-text-4
  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1-1/2 quarts water
      language: en
      source_region_ids:
      - vera-r0067-listgroup-2
    - segment_id: ingredient-2
      text_verbatim: 3 medium potatoes, peeled, cut in cubes
      language: en
      source_region_ids:
      - vera-r0067-listgroup-2
    - segment_id: ingredient-3
      text_verbatim: 1 medium onion, finely chopped
      language: en
      source_region_ids:
      - vera-r0067-listgroup-2
    - segment_id: ingredient-4
      text_verbatim: 4 cloves garlic, pressed
      language: en
      source_region_ids:
      - vera-r0067-listgroup-2
    - segment_id: ingredient-5
      text_verbatim: 1/2 teaspoon each of caraway seeds, and marjoram
      language: en
      source_region_ids:
      - vera-r0067-listgroup-2
    - segment_id: ingredient-6
      text_verbatim: 2 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0067-listgroup-2
    - segment_id: ingredient-7
      text_verbatim: 3 tablespoons flour
      language: en
      source_region_ids:
      - vera-r0067-listgroup-2
    - segment_id: ingredient-8
      text_verbatim: 1 cup fresh mushrooms, sliced lengthwise, sautéed in butter
      language: en
      source_region_ids:
      - vera-r0067-listgroup-2
    - segment_id: ingredient-9
      text_verbatim: parsley, finely chopped
      language: en
      source_region_ids:
      - vera-r0067-listgroup-2
    - segment_id: ingredient-10
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0067-listgroup-2
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: In a large saucepot combine potatoes, salt, caraway seeds, marjoram, water. Cook
        20 minutes, or until potatoes are crisp-tender.
      language: en
      source_region_ids:
      - vera-r0067-text-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Sauté onion and garlic in butter, stir in flour, brown lightly. Add 2 cups cooking
        liquid from the potatoes. Bring to boiling, cook and stir 5 minutes. Strain mixture into potatoes.
        Simmer 10 minutes, add mushrooms and parsley. Season to taste with salt and pepper.
      language: en
      source_region_ids:
      - vera-r0067-text-3
      step_number: 2
