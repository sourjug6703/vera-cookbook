  ingredient_sections:
  - section_id: ingredients-1
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 1-1/2 quarts beef stock
      language: en
      source_region_ids:
      - vera-r0064-listgroup-1
    - segment_id: ingredient-2
      text_verbatim: 1 lb. beef stew meat cut in 1/2" cubes
      language: en
      source_region_ids:
      - vera-r0064-listgroup-1
    - segment_id: ingredient-3
      text_verbatim: 3 tablespoons vegetable oil
      language: en
      source_region_ids:
      - vera-r0064-listgroup-1
    - segment_id: ingredient-4
      text_verbatim: 2 slices bacon cut in short strips
      language: en
      source_region_ids:
      - vera-r0064-listgroup-1
    - segment_id: ingredient-5
      text_verbatim: 1 medium onion, finely chopped
      language: en
      source_region_ids:
      - vera-r0064-listgroup-1
    - segment_id: ingredient-6
      text_verbatim: 2 medium potatoes, peeled and cut in 1/2" cubes
      language: en
      source_region_ids:
      - vera-r0064-listgroup-1
    - segment_id: ingredient-7
      text_verbatim: 1 tablespoon paprika
      language: en
      source_region_ids:
      - vera-r0064-listgroup-1
    - segment_id: ingredient-8
      text_verbatim: 4 tablespoons flour
      language: en
      source_region_ids:
      - vera-r0064-listgroup-1
    - segment_id: ingredient-9
      text_verbatim: 1/2 teaspoon each of caraway seeds, marjoram, ground nutmeg
      language: en
      source_region_ids:
      - vera-r0064-listgroup-1
    - segment_id: ingredient-10
      text_verbatim: 3 cloves garlic, pressed or chopped
      language: en
      source_region_ids:
      - vera-r0064-listgroup-1
    - segment_id: ingredient-11
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0064-listgroup-1
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: In a large saucepan combine oil, bacon and onion, brown it lightly. Add paprika,
        beef, pepper, caraway seeds, marjoram, nutmeg, garlic. Cover and simmer until beef is almost tender,
        about 45 minutes, stirring occasionally and adding 2-3 tablespoons beef stock, just enough to
        keep moisture in the pan. Uncover, blend in flour, braise 5 minutes. Add potatoes, beef stock,
        bring to boiling. Cook over medium/low heat until potatoes and beef are tender, 15-20 minutes.
        Season to taste with salt and pepper.
      language: en
      source_region_ids:
      - vera-r0064-text-2
      step_number: 1
