  instruction_sections:
  - section_id: instructions-main
    items:
    - text: 'Most supermarkets and butchers sell tripe already cleaned and parboiled, so just rinse it
        well in cold water. However, if you need to start from scratch, here''s how:'
      region_keys:
      - text-1
    - text: Clean tripe well and rinse thoroughly under running cold water. Rub with salt, scald with
        boiling water, then rinse again under running cold water. Put in a large pot, cover with salted
