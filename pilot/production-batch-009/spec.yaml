  ingredient_sections:
  - section_id: ingredients-1
    items:
    - text: 4 cups coarse flour, Gold Medal Wondra
      region_keys:
      - listgroup-2
    - text: 1 oz. fresh yeast
      region_keys:
      - listgroup-2
    - text: 1-1/4 cups milk
      region_keys:
      - listgroup-2
    - text: 1/3 cup sugar
      region_keys:
      - listgroup-2
    - text: 1 whole egg
      region_keys:
      - listgroup-2
    - text: 3 egg yolks
      region_keys:
      - listgroup-2
    - text: 8 tablespoons butter
      region_keys:
      - listgroup-2
    - text: dash of salt
      region_keys:
      - listgroup-2
    - text: 4 tablespoons butter for brushing and for baking pan
      region_keys:
      - listgroup-2
    - text: 1 cup filling
      region_keys:
      - listgroup-2
  instruction_sections:
  - section_id: instructions-main
    items:
    - text: 'Leavening: In a bowl stir yeast with 2 teaspoons sugar until dissolved. Add 2/3 cup flour
        and 1/2 cup lukewarm milk. Knead into a ball. Dust with flour, cover with a napkin, set aside
        to rise – in a warm draft free place. It should double in bulk within 15-20 minutes.'
      region_keys:
      - text-1
    - text: In a separate bowl blend remaining flour with sugar, lemon rind and salt. Push to sides making
        a well in the center. Place risen leavening in the well.
      region_keys:
      - text-3
    - text: Lightly beat egg yolks and whole egg in remaining lukewarm milk. Add it gradually to flour/leavening
        mixture, mixing thoroughly. Lastly, add melted lukewarm butter. Knead dough until smooth and no
        longer sticks to the bowl. Dust with flour, cover with napkin and let it rise 40 minutes.
      region_keys:
      - text-4
    - text: Turn dough over onto a floured pastry board and roll it out to 1/3" thickness. Cut into 2
        × 3" rectangles. Drop filling by teaspoonfuls on narrower side of each rectangle, roll over so
        that filling will be well covered with the dough. Pinch sides firmly to seal them. Dip each piece
        in butter, or brush on all sides with melted butter. Arrange them close together in a buttered
        baking pan. Let them rise 30 minutes. Preheat oven to 350F and bake 25 minutes or until golden
        on top. Invert 'buchty' onto a wire rack and cool, at least 20 minutes. Separate them carefully
        and sprinkle with sugar.
      region_keys:
      - text-5
