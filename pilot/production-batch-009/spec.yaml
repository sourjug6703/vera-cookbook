  instruction_sections:
  - section_id: instructions-main
    items:
    - text: In a large saucepan combine oil, bacon and onion, brown it lightly. Add paprika, beef, pepper,
        caraway seeds, marjoram, nutmeg, garlic. Cover and simmer until beef is almost tender, about 45
        minutes, stirring occasionally and adding 2-3 tablespoons beef stock, just enough to keep moisture
        in the pan. Uncover, blend in flour, braise 5 minutes. Add potatoes, beef stock, bring to boiling.
        Cook over medium/low heat until potatoes and beef are tender, 15-20 minutes. Season to taste with
