  instruction_sections:
  - section_id: instructions-main
    items:
    - text: 'Leavening: In a bowl stir yeast with 2 teaspoons sugar until dissolved. Add 2/3 cup flour
        and 1/2 cup lukewarm milk. Knead into a ball. Dust with flour, cover with napkin, let rise in
        a warm place. It will double in bulk within 20 minutes.'
      region_keys:
      - text-1
    - text: In a separate bowl combine remaining flour and sugar, lemon rind, nutmeg, salt. Place risen
        leavening in center.
      region_keys:
      - text-3
    - text: Lightly beat egg yolks and the remaining lukewarm milk, then add it gradually to flour/leavening
        while mixing thoroughly. Finally add melted lukewarm butter and knead dough until smooth and elastic.
      region_keys:
      - text-4
    - text: Dust with flour, cover with a napkin and let rise 40 minutes in a warm place.
      region_keys:
      - text-5
    - text: Punch dough down and turn onto lightly floured pastry board. Break off dough and form balls
        the size of a walnut. Place them on a greased baking sheet, 4" apart. Let rise 10 minutes.
      region_keys:
      - text-6
    - text: Press down the center of each ball, using bottom of a small glass or other round object, or
        with your fingers, so that a higher border will be formed. Brush borders with beaten egg. Spread
        filling evenly over center wells. Let rise 15 minutes.
      region_keys:
      - text-7
    - text: (If using butter crumbs filling, brush with melted butter first. This way filling will stick).
      region_keys:
      - text-8
    - text: Preheat oven to 350F, bake 15 minutes, or until borders are golden brown.
      region_keys:
      - text-9
    - text: Dust with sugar while warm.
      region_keys:
      - text-10
