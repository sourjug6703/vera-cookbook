  ingredient_sections:
  - section_id: ingredients-1
    items:
    - text: 2 lbs. tripe
      region_keys:
      - listgroup-2
    - text: 2 quarts chicken broth
      region_keys:
      - listgroup-2
    - text: 2 carrots
      region_keys:
      - listgroup-2
    - text: 1 celery root, or 4 stalks
      region_keys:
      - listgroup-2
    - text: 1 medium onion, quartered
      region_keys:
      - listgroup-2
    - text: 4 cloves garlic, pressed or chopped
      region_keys:
      - listgroup-2
    - text: 2 tablespoons paprika
      region_keys:
      - listgroup-2
    - text: 1/2 teaspoon each of marjoram, ground allspice, black pepper, ginger
      region_keys:
