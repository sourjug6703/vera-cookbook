    - vera-r0018-yield
  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 3 lbs. boned pork shoulder, cut in 1-1/2" cubes
      language: en
      source_region_ids:
      - vera-r0018-ingredients
    - segment_id: ingredient-2
      text_verbatim: 1/4 cup vegetable oil
      language: en
      source_region_ids:
      - vera-r0018-ingredients
    - segment_id: ingredient-3
      text_verbatim: 1 large onion, chopped
      language: en
      source_region_ids:
      - vera-r0018-ingredients
    - segment_id: ingredient-4
      text_verbatim: 2 tablespoons vinegar
      language: en
      source_region_ids:
      - vera-r0018-ingredients
    - segment_id: ingredient-5
      text_verbatim: 2 tablespoons paprika
      language: en
      source_region_ids:
      - vera-r0018-ingredients
    - segment_id: ingredient-6
      text_verbatim: 1 teaspoon caraway seeds
      language: en
      source_region_ids:
      - vera-r0018-ingredients
    - segment_id: ingredient-7
      text_verbatim: 2 cups beef stock
      language: en
      source_region_ids:
      - vera-r0018-ingredients
    - segment_id: ingredient-8
      text_verbatim: 4 tablespoons flour
      language: en
      source_region_ids:
      - vera-r0018-ingredients
    - segment_id: ingredient-9
      text_verbatim: 3/4 cup sour cream
      language: en
      source_region_ids:
      - vera-r0018-ingredients
    - segment_id: ingredient-10
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0018-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Sauté onion in oil. Add paprika, vinegar, pork, caraway seeds, pepper, few spoons
        of beef stock. Cover and simmer 1-1/2 hrs, or until meat is tender. Stir occasionally and gradually
        add beef stock, little at a time, just enough to keep moisture in the stew.
      language: en
      source_region_ids:
      - vera-r0018-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Blend flour, sour cream and 1/2 cup beef stock. Stir the mixture in the pan with
        the meat. Simmer 10-15 minutes. If the sauce is too thick, add more beef stock.
      language: en
      source_region_ids:
      - vera-r0018-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Taste for salt. Should you prefer to redden the color of the sauce, add 2-3 tablespoons
        tomato paste.
      language: en
      source_region_ids:
      - vera-r0018-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Serve with potatoes or dumplings.
      language: en
      source_region_ids:
      - vera-r0018-step-4
      step_number: 4
