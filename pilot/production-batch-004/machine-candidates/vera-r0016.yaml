  yield_time_lines:
  - segment_id: yield-1
    text_verbatim: 'Serves 6 – Preparation time: 45 minutes'
    language: en
    source_region_ids:
    - vera-r0016-yield
  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 6 pork loin rib chops, cut about 1/2" thick
      language: en
      source_region_ids:
      - vera-r0016-ingredients
    - segment_id: ingredient-2
      text_verbatim: 1/2 cup flour
      language: en
      source_region_ids:
      - vera-r0016-ingredients
    - segment_id: ingredient-3
      text_verbatim: 2 eggs
      language: en
      source_region_ids:
      - vera-r0016-ingredients
    - segment_id: ingredient-4
      text_verbatim: 1 cup bread crumbs
      language: en
      source_region_ids:
      - vera-r0016-ingredients
    - segment_id: ingredient-5
      text_verbatim: 1 cup vegetable oil
      language: en
      source_region_ids:
      - vera-r0016-ingredients
    - segment_id: ingredient-6
      text_verbatim: salt and pepper
      language: en
      source_region_ids:
      - vera-r0016-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Pound the pork chops lightly; make a few short cuts on the edges to prevent curling.
      language: en
      source_region_ids:
      - vera-r0016-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Spice them with salt and pepper. Dredge them in flour shaking off excess, dip in
        beaten eggs and coat with bread crumbs.
      language: en
      source_region_ids:
      - vera-r0016-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Fry the chops in a covered pan for 5 minutes, turn them and finish frying uncovered.
        Drain on paper towel.
      language: en
      source_region_ids:
      - vera-r0016-step-3
      step_number: 3
    - segment_id: step-4
      text_verbatim: Serve with potato salad, green salad, vegetables.
      language: en
      source_region_ids:
      - vera-r0016-step-4
      step_number: 4
