    ingredient_sections:
      - section_id: ingredients-main
        items:
          - {text: "3·4 lbs. fresh ham, boned and skinned", region_keys: [ingredients]}
          - {text: "4 slices bacon", region_keys: [ingredients]}
          - {text: "6 tablespoons butter", region_keys: [ingredients]}
          - {text: "2 carrots", region_keys: [ingredients]}
          - {text: "1 celery root", region_keys: [ingredients]}
          - {text: "1 parsnip", region_keys: [ingredients]}
          - {text: "3 bay leaves, thyme, whole allspice, whole black pepper", region_keys: [ingredients]}
          - {text: "1 lemon", region_keys: [ingredients]}
          - {text: "1·1/2 cups sour cream", region_keys: [ingredients]}
          - {text: "2 tablespoons flour", region_keys: [ingredients]}
          - {text: "1·1/2 cups chicken stock or water", region_keys: [ingredients]}
          - {text: "salt", region_keys: [ingredients]}
    instruction_sections:
      - section_id: instructions-main
        items:
          - {text: "Dice the carrots, celery root and parsnip. Cut the bacon into short strips.", region_keys: [step-1]}
          - {text: "Skim off fat from the meat, rinse and pat it dry, salt it and lard with bacon strips.", region_keys: [step-2]}
          - {text: "In a large stewpot combine melted butter, vegetables, spices, lemon rind, grated or chopped.", region_keys: [step-3]}
          - {text: "Set over medium heat. Add the meat and brown it lightly on all sides. Lower the heat, cover tightly and simmer over low heat until tender, about 2 hours, gradually adding the chicken stock or water.", region_keys: [step-4]}
          - {text: "Remove meat from pot, keep it warm.", region_keys: [step-5]}
          - {text: "Strain the gravy into a saucepan. Combine flour and sour cream and blend it into the gravy. Add lemon juice, simmer 5 minutes.", region_keys: [step-6a, step-6b]}
          - {text: "Slice meat, pour the gravy over it or serve separately.", region_keys: [step-6b]}
          - {text: "Serve with dumplings, noodles, vegetables.", region_keys: [step-6b]}
    yield_time_lines:
      - {text: "Serves 6 – Preparation time: 3 hours", region_keys: [yield]}
