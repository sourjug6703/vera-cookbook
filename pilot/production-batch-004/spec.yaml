      - {key: yield, role: yield-time, pdf_page: 14, block_ids: [/page/13/Text/10]}
    ingredient_sections:
      - section_id: ingredients-main
        items:
          - {text: "6 pork chops", region_keys: [ingredients]}
          - {text: "1/2 cup flour", region_keys: [ingredients]}
          - {text: "1/2 cup vegetable oil", region_keys: [ingredients]}
          - {text: "2 tablespoons butter", region_keys: [ingredients]}
          - {text: "1 cup chicken stock", region_keys: [ingredients]}
          - {text: "1 small onion", region_keys: [ingredients]}
          - {text: "2 teaspoons caraway seeds", region_keys: [ingredients]}
          - {text: "salt", region_keys: [ingredients]}
    instruction_sections:
      - section_id: instructions-main
        items:
          - {text: "Pound the pork chops lightly·they should not be more than 1/2\" thick. Make a few short cuts on the edges to prevent curling, salt them on both sides and dust with flour on one side. Brown chops in hot oil, floured side first.", region_keys: [step-1]}
          - {text: "In a large skillet combine the butter and finely chopped onion and set over medium heat.", region_keys: [step-2]}
          - {text: "When the onion becomes translucent, add caraway seeds and some of the chicken stock. Add the pork chops and simmer about 30 minutes or until they are tender.", region_keys: [step-3]}
          - {text: "Remove the chops, bring the liquid to boil, blend in flour and chicken stock and simmer until the sauce thickens. The sauce should be medium thick. Strain.", region_keys: [step-4]}
          - {text: "Return pork chops in the sauce, simmer until heated through.", region_keys: [step-5]}
          - {text: "Serve with boiled potatoes, rice, salad.", region_keys: [step-5]}
    yield_time_lines:
      - {text: "Serves 6 – Preparation time: 45 minutes", region_keys: [yield]}
