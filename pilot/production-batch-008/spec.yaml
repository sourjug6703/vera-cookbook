    ingredient_sections:
      - section_id: ingredients-main
        items:
          - {text: "5 cups coarse flour, Gold Medal Wondra", region_keys: [ingredients-main]}
          - {text: "1 teaspoon baking powder", region_keys: [ingredients-main]}
          - {text: "1·1/2 cups milk, lukewarm", region_keys: [ingredients-main]}
          - {text: "grated rind of 1 lemon", region_keys: [ingredients-main]}
          - {text: "2 egg yolks", region_keys: [ingredients-main]}
