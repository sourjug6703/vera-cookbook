        items: [{text: "3 tablespoons fried bread crumbs", region_keys: [optional-ingredients]}]
    instruction_sections:
      - section_id: instructions-main
        items:
          - {text: "Leavening: In a bowl stir fresh yeast and sugar until it dissolves. Add 1/4 cup lukewarm milk and 1/3 cup flour, mix thoroughly into a smooth ball. Dust with flour, set aside to rise, in a warm draft free place. Should double in bulk within 15 minutes.", region_keys: [leavening]}
          - {text: "In a separate bowl combine remaining flour, baking powder, lemon rind, salt. Make a well in center where you put egg yolks and the risen leavening. Mix all, gradually adding the remaining lukewarm milk. Knead until dough is smooth and separates from the bowl. Let it rise in a warm place for 30 minutes.", region_keys: [step-1a, step-1b]}
          - {text: "Cut tablespoonsfuls of dough, round them into balls, let them rise on a floured surface for 10 minutes. Drop dumplings into rapidly boiling salted water, boil 5 minutes, turn them around with a spatula and cook another 5 minutes. Drain, pierce each with fork, sprinkle with hot butter.", region_keys: [step-2]}
          - {text: "Optional: Coat with fried bread crumbs. Serve with meats and sauces.", region_keys: [step-3]}
    yield_time_lines: [{text: "Serves 6 – Preparation time: 1 hour 15 minutes", region_keys: [yield]}]
