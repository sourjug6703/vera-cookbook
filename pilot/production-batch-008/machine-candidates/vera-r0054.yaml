  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Discard outside leaves from the fresh head of cabbage. Quarter, core, rinse and cut
        in strips. Scald with boiling water. Drain. Sauté onion in oil until translucent. Add cabbage,
        salt and caraway seeds. Simmer, turning occasionally, until cabbage is tender but crisp, about
        15·20 minutes. Blend in flour, simmer 2·3 minutes. Add vinegar and sugar, simmer 1·2 minutes until
        thoroughly heated through. Serve with pork roast, meatloaf, smoked pork.
      language: en
      source_region_ids:
      - vera-r0054-step-1
      step_number: 1
