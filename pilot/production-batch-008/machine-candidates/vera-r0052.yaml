  ingredient_sections:
  - section_id: ingredients-main
    ingredients:
    - segment_id: ingredient-1
      text_verbatim: 6 medium size green peppers
      language: en
      source_region_ids:
      - vera-r0052-ingredients
    - segment_id: ingredient-2
      text_verbatim: 3 tablespoons vegetable oil
      language: en
      source_region_ids:
      - vera-r0052-ingredients
    - segment_id: ingredient-3
      text_verbatim: 1 small onion, finely chopped
      language: en
      source_region_ids:
      - vera-r0052-ingredients
    - segment_id: ingredient-4
      text_verbatim: 1 lb. finely ground pork or beef
      language: en
      source_region_ids:
      - vera-r0052-ingredients
    - segment_id: ingredient-5
      text_verbatim: 1 egg, whole
      language: en
      source_region_ids:
      - vera-r0052-ingredients
    - segment_id: ingredient-6
      text_verbatim: 1/2 cup firmly cooked rice
      language: en
      source_region_ids:
      - vera-r0052-ingredients
    - segment_id: ingredient-7
      text_verbatim: 2 tablespoons butter
      language: en
      source_region_ids:
      - vera-r0052-ingredients
    - segment_id: ingredient-8
      text_verbatim: 2 cups tomato sauce
      language: en
      source_region_ids:
      - vera-r0052-ingredients
    - segment_id: ingredient-9
      text_verbatim: salt
      language: en
      source_region_ids:
      - vera-r0052-ingredients
  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: Slice stem ends from peppers, remove white fiber and seeds. Drop into boiling salted
        water, simmer 1 minute. Drain on a sieve or paper towel. Pat dry cavities.
      language: en
      source_region_ids:
      - vera-r0052-step-1
      step_number: 1
    - segment_id: step-2
      text_verbatim: Meanwhile, heat oil in a skillet, add onion and ground meat, sauté 10 minutes, mixing
        often. Blend in the egg, rice and salt. Spoon mixture into peppers, pressing firmly towards bottom
        and sides.
      language: en
      source_region_ids:
      - vera-r0052-step-2
      step_number: 2
    - segment_id: step-3
      text_verbatim: Arrange stuffed peppers in a flameproof buttered casserole, pour tomato sauce over
        all. Simmer, covered, 30·35 minutes. Serve with noodles or gnocchi.
      language: en
      source_region_ids:
      - vera-r0052-step-3
      step_number: 3
