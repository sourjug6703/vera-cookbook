  instruction_sections:
  - section_id: instructions-main
    steps:
    - segment_id: step-1
      text_verbatim: In a skillet combine oil, onion and flour. Brown mixture lightly. Add sauerkraut,
        caraway seeds, dash of salt and simmer 15 minutes, or until tender. Add sugar, mix thoroughly,
        simmer about 5 minutes more. Sauerkraut should be tender but crisp. Taste sweet-sour. Serve with
        pork roast, roast goose, smoked pork.
      language: en
