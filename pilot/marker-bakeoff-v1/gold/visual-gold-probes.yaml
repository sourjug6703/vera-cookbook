schema_version: "1.0"
gold_id: "marker-bakeoff-v1-visual-probes"
created_on: "2026-08-23"
independence:
  established_before_candidate_review: true
  source: "direct visual inspection of 120 DPI renders from the immutable PDF"
  marker_output_used: false
review_status: "first-pass visually verified"
normalization_for_scoring: "Unicode NFC, HTML decoded, tags removed, whitespace collapsed; punctuation and diacritics otherwise exact"
scope_note: >-
  This is a source-specific consequential-probe gold set, not a complete
  character-error-rate transcription of every selected page. It tests exact
  recipe inventory, reading order, ownership, titles, Czech diacritics,
  fractions, units, temperatures, continuations, notes, and cross-references.
